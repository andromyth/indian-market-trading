name: One-time Cloud Run deployment preflight 2026-10-17

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/_cloud_deploy_preflight_once_20261017.yml"

permissions:
  contents: read

jobs:
  cloud-preflight:
    if: github.event.head_commit.message == 'Preflight Cloud Run deployment and scheduler on 2026-10-17'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_ID: indian-market-trading
      REGION: asia-south1
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          project_id: indian-market-trading
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: indian-market-trading
      - name: Inspect current Cloud Run revision and scheduler
        shell: bash
        run: |
          set -euo pipefail
          if gcloud run services describe indian-market-intraday-worker \
            --project="$PROJECT_ID" --region="$REGION" --format=json > /tmp/service.json; then
            python - <<'PY'
          import json
          s = json.load(open("/tmp/service.json", encoding="utf-8"))
          print("CLOUD_RUN_SERVICE")
          print(json.dumps({
              "service": s.get("metadata", {}).get("name"),
              "generation": s.get("metadata", {}).get("generation"),
              "url": s.get("status", {}).get("url"),
              "latestCreatedRevisionName": s.get("status", {}).get("latestCreatedRevisionName"),
              "latestReadyRevisionName": s.get("status", {}).get("latestReadyRevisionName"),
              "conditions": [
                  {"type": c.get("type"), "status": c.get("status"), "reason": c.get("reason")}
                  for c in s.get("status", {}).get("conditions", [])
              ],
              "traffic": s.get("status", {}).get("traffic", []),
              "calibrationMode": next((e.get("value") for e in s.get("spec", {}).get("template", {}).get("spec", {}).get("containers", [{}])[0].get("env", []) if e.get("name") == "PREDICTION_CALIBRATION_MODE"), "(unset; code default applies)")
          }, indent=2))
          PY
          else
            echo "CLOUD_RUN_SERVICE=unavailable_to_GitHub_service_account (run.services.get denied)"
          fi
          gcloud scheduler jobs list --project="$PROJECT_ID" --location="$REGION" --format=json > /tmp/jobs.json
          python - <<'PY'
          import json
          jobs = json.load(open("/tmp/jobs.json", encoding="utf-8"))
          selected = []
          for j in jobs:
              name = str(j.get("name", "")).rsplit("/", 1)[-1]
              uri = str((j.get("httpTarget") or {}).get("uri", ""))
              if "intraday-worker-" in name or "indian-market-intraday-worker" in uri:
                  selected.append({
                      "name": name,
                      "schedule": j.get("schedule"),
                      "timeZone": j.get("timeZone"),
                      "state": j.get("state"),
                      "lastAttemptTime": j.get("lastAttemptTime"),
                      "lastAttemptStatus": (j.get("status") or {}).get("code"),
                  })
          print("MATCHED_SCHEDULER_JOBS")
          print(json.dumps(sorted(selected, key=lambda x:x["name"]), indent=2))
          if not selected:
              raise SystemExit("No intraday worker scheduler jobs found.")
          PY
      - name: Inspect deployer roles and required secret availability
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          principal = json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]).get("client_email", "")
          print("DEPLOYER_PRINCIPAL=" + principal)
          if not principal:
              raise SystemExit("GOOGLE_SERVICE_ACCOUNT_JSON has no client_email")
          PY
          if gcloud projects get-iam-policy "$PROJECT_ID" --format=json > /tmp/project-iam.json 2>/tmp/project-iam.err; then
            python - <<'PY'
          import json, os
          principal = json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]).get("client_email", "")
          policy = json.load(open("/tmp/project-iam.json", encoding="utf-8"))
          roles = sorted({
              b.get("role", "")
              for b in policy.get("bindings", [])
              if any(m == "serviceAccount:" + principal for m in b.get("members", []))
          })
          print("DEPLOYER_PROJECT_ROLES=" + json.dumps(roles))
          PY
          else
            echo "PROJECT_IAM_POLICY=unavailable_to_GitHub_service_account"
            tail -n 3 /tmp/project-iam.err || true
          fi
          for secret in google-drive-root-id google-oauth-token-json indstocks-client-id indstocks-mpin indstocks-totp-secret indstocks-access-token; do
            if gcloud secrets describe "$secret" --project="$PROJECT_ID" >/dev/null 2>&1; then
              if gcloud secrets versions access latest --secret="$secret" --project="$PROJECT_ID" >/dev/null 2>&1; then
                echo "SECRET_STATUS $secret=available"
              else
                echo "SECRET_STATUS $secret=present_but_no_readable_latest_version"
              fi
            else
              echo "SECRET_STATUS $secret=missing_or_not_visible"
            fi
          done
