name: One-time calibration learning execution 2026-10-17

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/_run_calibration_learning_once_20261017.yml"

permissions:
  contents: read

concurrency:
  group: calibration-learning-once-20261017
  cancel-in-progress: false

jobs:
  run-learning:
    if: contains(github.event.head_commit.added, '.github/workflows/_run_calibration_learning_once_20261017.yml')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate date window and Google Drive write access
        run: |
          python - <<'PY'
          from datetime import date
          from market_session_guard import is_nse_trading_day
          from persistent_store import drive_status
          start = date.fromisoformat("2026-08-18")
          end = date.fromisoformat("2026-10-16")
          if end < start or not is_nse_trading_day(end):
              raise SystemExit(f"Invalid learning window: {start} through {end}")
          status = drive_status(require_write=True)
          print({
              key: status.get(key)
              for key in ("configured", "reachable", "write_ready", "auth_method", "write_auth_method", "reason")
          })
          if not status.get("configured") or status.get("reachable") is False or status.get("write_ready") is False:
              raise SystemExit("Google Drive read/write preflight failed: " + str(status.get("reason", "not ready")))
          print(f"Learning window verified: {start} through {end}")
          PY
      - name: Run strict prediction learning and calibration diagnostics
        run: |
          set -euo pipefail
          python -u prediction_learning_engine.py \
            --start-date "2026-08-18" \
            --end-date "2026-10-16" \
            --segment service \
            --train-fraction 0.70 \
            --strict
