name: Activate Cloud Run intraday schedules

# This is an explicit, manually dispatched activation task. It does not create
# schedules; it resumes only existing Cloud Scheduler jobs targeting the known
# intraday worker. The Google service account must have Cloud Scheduler list,
# get, and pause/resume permissions in the project before this can succeed.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/activate_intraday_cloud_scheduler.yml"

permissions:
  contents: read

jobs:
  resume-worker-schedules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_ID: indian-market-trading
      REGION: asia-south1
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
    steps:
      - name: Checkout project for Drive audit
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          project_id: indian-market-trading

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: indian-market-trading

      - name: Inspect and resume only the intraday worker scheduler jobs
        shell: bash
        run: |
          set -euo pipefail
          gcloud scheduler jobs list \
            --project="$PROJECT_ID" \
            --location="$REGION" \
            --format=json > /tmp/scheduler-jobs.json
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import PurePosixPath

          project = os.environ["PROJECT_ID"]
          region = os.environ["REGION"]
          jobs = json.load(open("/tmp/scheduler-jobs.json", encoding="utf-8"))
          token = "indian-market-intraday-worker"
          target_jobs = []
          for job in jobs:
              name = str(job.get("name", ""))
              uri = str((job.get("httpTarget") or {}).get("uri", ""))
              if token in name or token in uri:
                  target_jobs.append(job)

          if not target_jobs:
              raise SystemExit(
                  "No existing Cloud Scheduler jobs targeting indian-market-intraday-worker "
                  f"were found in project={project}, region={region}; nothing was changed."
              )

          print("Matched existing intraday worker schedules:")
          for job in sorted(target_jobs, key=lambda x: str(x.get("name", ""))):
              name = str(job.get("name", ""))
              short_name = PurePosixPath(name).name
              state = str(job.get("state", "UNKNOWN")).upper()
              print(
                  f"- {short_name}: state={state}, "
                  f"schedule={job.get('schedule')}, timezone={job.get('timeZone')}"
              )
              if state == "PAUSED":
                  subprocess.run(
                      [
                          "gcloud", "scheduler", "jobs", "resume", short_name,
                          "--project", project, "--location", region, "--quiet"
                      ],
                      check=True,
                  )
              elif state not in {"ENABLED"}:
                  raise SystemExit(
                      f"Job {short_name} has unexpected state={state}; "
                      "refusing to alter it automatically."
                  )

          refreshed = subprocess.run(
              [
                  "gcloud", "scheduler", "jobs", "list",
                  "--project", project, "--location", region, "--format=json"
              ],
              check=True, capture_output=True, text=True,
          )
          verified = json.loads(refreshed.stdout)
          by_name = {str(j.get("name", "")): j for j in verified}
          failures = []
          for prior in target_jobs:
              name = str(prior.get("name", ""))
              current = by_name.get(name, {})
              state = str(current.get("state", "UNKNOWN")).upper()
              print(f"VERIFY {PurePosixPath(name).name}: state={state}")
              if state != "ENABLED":
                  failures.append(f"{name}: {state}")
          if failures:
              raise SystemExit("Cloud Scheduler activation not verified: " + "; ".join(failures))
          print(f"SUCCESS: verified {len(target_jobs)} intraday worker schedule(s) ENABLED.")

          # Force exactly one invocation for the schedule covering the current
          # Kolkata market time. This tests the real private Cloud Run path,
          # rather than treating ENABLED scheduler state as proof of persistence.
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Asia/Kolkata"))
          hhmm = now.hour * 100 + now.minute
          active_name = None
          if now.weekday() < 5 and 915 <= hhmm <= 959:
              active_name = "intraday-worker-0915-0959"
          elif now.weekday() < 5 and 1000 <= hhmm <= 1459:
              active_name = "intraday-worker-1000-1459"
          elif now.weekday() < 5 and 1500 <= hhmm <= 1530:
              active_name = "intraday-worker-1500-1530"
          if active_name:
              available_names = {PurePosixPath(str(j.get("name", ""))).name for j in target_jobs}
              if active_name not in available_names:
                  raise SystemExit(f"Current-session scheduler job not found: {active_name}")
              print(f"REQUESTING_ONE_OFF_TICK: job={active_name}, time_ist={now.isoformat()}")
              subprocess.run(
                  ["gcloud", "scheduler", "jobs", "run", active_name,
                   "--project", project, "--location", region, "--quiet"],
                  check=True,
              )
              print("ONE_OFF_TICK_REQUEST_ACCEPTED")
              # Scheduler's "jobs run" command only confirms enqueueing. Capture
              # the resulting HTTP attempt status/target so request/auth failures
              # are distinguishable from a stopped or stale worker.
              described = subprocess.run(
                  [
                      "gcloud", "scheduler", "jobs", "describe", active_name,
                      "--project", project, "--location", region, "--format=json"
                  ],
                  check=True, capture_output=True, text=True,
              )
              latest_job = json.loads(described.stdout)
              target = latest_job.get("httpTarget") or {}
              attempt = latest_job.get("lastAttemptStatus") or {}
              response_status = attempt.get("responseStatus") or {}
              print("CLOUD_SCHEDULER_LAST_ATTEMPT:", json.dumps({
                  "job": active_name,
                  "lastAttemptTime": latest_job.get("lastAttemptTime"),
                  "lastAttemptStatus": attempt,
                  "responseStatus": response_status,
                  "target_uri": target.get("uri"),
                  "oidc_service_account": (target.get("oidcToken") or {}).get("serviceAccountEmail"),
                  "oauth_service_account": (target.get("oauthToken") or {}).get("serviceAccountEmail"),
              }, sort_keys=True))
          else:
              print(f"NO_LIVE_TICK_REQUESTED: outside weekday cash-session hours ({now.isoformat()})")
          PY

      - name: Install persistence audit dependencies
        run: python -m pip install -r requirements.txt

      - name: Recheck Google Drive after the live tick
        shell: bash
        run: |
          set -euo pipefail
          sleep 25
          python -u verify_minute_prediction_persistence.py | tee /tmp/minute-persistence-audit.log
          python - <<'PY'
          import json
          from pathlib import Path

          output = Path("/tmp/minute-persistence-audit.log").read_text(encoding="utf-8")
          begin = "MINUTE_PERSISTENCE_AUDIT_JSON_BEGIN"
          end = "MINUTE_PERSISTENCE_AUDIT_JSON_END"
          if begin not in output or end not in output:
              raise SystemExit("The Drive audit did not emit its expected report markers.")
          report_text = output.split(begin, 1)[1].split(end, 1)[0].strip()
          report = json.loads(report_text)
          verdict = report.get("verdict") or {}
          summary = {
              "checked_at_ist": report.get("checked_at_ist"),
              "worker_run_status": (report.get("worker_status_latest") or {}).get("run_status"),
              "worker_status_age_minutes": (report.get("worker_status_latest") or {}).get("modified_age_minutes"),
              "watchlist_minute_snapshots_fresh": verdict.get("watchlist_minute_snapshots_fresh"),
              "watchlist_actual_observation_rows_present": verdict.get("watchlist_actual_observation_rows_present"),
              "watchlist_prediction_rows_present_recently": verdict.get("watchlist_prediction_rows_present_recently"),
              "today_prediction_ledger_recent_and_nonempty": verdict.get("today_prediction_ledger_recent_and_nonempty"),
              "full_universe_minute_capture_fresh_and_status_ok": verdict.get("full_universe_minute_capture_fresh_and_status_ok"),
              "overall": verdict.get("overall"),
          }
          print("POST_TICK_PERSISTENCE_VERDICT:", json.dumps(summary, sort_keys=True))
          if verdict.get("overall") != "PASS_CURRENT_MINUTE_PREDICTION_AND_ACTUAL_SNAPSHOT_STORAGE":
              raise SystemExit(
                  "Live tick was requested, but current prediction/actual persistence is still not verified. "
                  "Check Cloud Run deployment revision and worker logs; the GitHub service account cannot deploy Cloud Run."
              )
          PY
