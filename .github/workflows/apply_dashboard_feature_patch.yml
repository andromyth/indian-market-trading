name: Prepare dashboard feature patch PR

on:
  push:
    branches:
      - main
    paths:
      - "tools/patch_dashboard_features.py"

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply dashboard patch to working tree
        run: python tools/patch_dashboard_features.py

      - name: Create or update reviewed pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/dashboard-feature-patch
          delete-branch: false
          add-paths: app.py
          commit-message: "Add prediction history and delivery price forecast"
          title: "Dashboard: apply prediction history and delivery forecast patch"
          body: |
            This pull request contains the generated dashboard feature patch.

            Review the app.py diff and CI checks before merging. This workflow does not push generated application changes directly to main.
