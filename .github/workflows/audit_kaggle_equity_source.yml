name: Audit Kaggle 5m equity source (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
    steps:
      - name: Install Google Drive client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-oauthlib

      - name: List source folder and print audit reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, io, json, os
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          info = json.loads(os.environ["GOOGLE_OAUTH_TOKEN_JSON"])
          creds = Credentials.from_authorized_user_info(info, scopes=["https://www.googleapis.com/auth/drive"])
          if not creds.valid:
              creds.refresh(Request())
          service = build("drive", "v3", credentials=creds, cache_discovery=False)
          FOLDER_ID = "1AJcMfL-G29_oQQYXGNZwdUQJ30J-Vbxc"

          def children(fid):
              out, page = [], None
              while True:
                  r = service.files().list(
                      q=f"'{fid}' in parents and trashed = false",
                      pageSize=1000, pageToken=page,
                      fields="nextPageToken,files(id,name,mimeType,size,modifiedTime)",
                      supportsAllDrives=True, includeItemsFromAllDrives=True,
                  ).execute()
                  out.extend(r.get("files", []))
                  page = r.get("nextPageToken")
                  if not page:
                      return out

          def walk(fid, prefix="", depth=0, rows=None, limit=5):
              if rows is None: rows = []
              for item in children(fid):
                  rows.append({"path": prefix + item.get("name", ""), **item})
                  if item.get("mimeType") == "application/vnd.google-apps.folder" and depth < limit:
                      walk(item["id"], prefix + item.get("name", "") + "/", depth + 1, rows, limit)
              return rows

          rows = walk(FOLDER_ID)
          print("KAGGLE_SOURCE_ENTRY_COUNT=" + str(len(rows)))
          for r in rows[:80]:
              print("KAGGLE_SOURCE_ENTRY=" + json.dumps({k: r.get(k) for k in ("path","id","mimeType","size","modifiedTime")}, sort_keys=True))
          folders = [r for r in rows if r.get("mimeType") == "application/vnd.google-apps.folder"]
          files = [r for r in rows if r.get("mimeType") != "application/vnd.google-apps.folder"]
          print("KAGGLE_SOURCE_FOLDER_COUNT=" + str(len(folders)))
          print("KAGGLE_SOURCE_FILE_COUNT=" + str(len(files)))
          print("KAGGLE_SOURCE_TOTAL_BYTES=" + str(sum(int(r.get("size") or 0) for r in files)))

          def report_text(name):
              res = service.files().list(
                  q=f"name = '{name}' and trashed = false",
                  pageSize=10, fields="files(id,name,size)",
                  supportsAllDrives=True, includeItemsFromAllDrives=True,
              ).execute().get("files", [])
              if not res:
                  print("KAGGLE_REPORT_MISSING=" + name)
                  return None
              item = res[0]
              return service.files().get_media(fileId=item["id"], supportsAllDrives=True).execute().decode("utf-8", "replace")

          import_text = report_text("KAGGLE_EQUITY_IMPORT_REPORT.csv")
          quality_text = report_text("KAGGLE_DATA_QUALITY_AUDIT.csv")
          import_rows = list(csv.DictReader(io.StringIO(import_text))) if import_text else []
          quality_rows = list(csv.DictReader(io.StringIO(quality_text))) if quality_text else []
          status_counts = {}
          for row in import_rows:
              status_counts[row.get("status", "")] = status_counts.get(row.get("status", ""), 0) + 1
          print("KAGGLE_IMPORT_STATUS_COUNTS=" + json.dumps(status_counts, sort_keys=True))
          imported_files = {row.get("file", "") for row in import_rows if row.get("status") == "IMPORTED"}
          print("KAGGLE_IMPORTED_FILE_COUNT=" + str(len(imported_files)))
          print("KAGGLE_IMPORTED_SAMPLE=" + json.dumps(sorted(imported_files)[:20]))
          by_file = {row.get("file", ""): row for row in quality_rows}
          eq5 = [by_file[name] for name in imported_files if name in by_file and by_file[name].get("timeframe") == "5minute"]
          sessions = [int(float(row.get("sessions") or 0)) for row in eq5]
          dates = [(row.get("first_date"), row.get("last_date")) for row in eq5 if row.get("first_date") and row.get("last_date")]
          print("KAGGLE_EQ_5M_FILE_COUNT=" + str(len(eq5)))
          if sessions:
              sessions_sorted = sorted(sessions)
              print("KAGGLE_EQ_5M_SESSIONS_MIN=" + str(min(sessions)))
              print("KAGGLE_EQ_5M_SESSIONS_MEDIAN=" + str(sessions_sorted[len(sessions_sorted)//2]))
              print("KAGGLE_EQ_5M_SESSIONS_MAX=" + str(max(sessions)))
              print("KAGGLE_EQ_5M_GE_200=" + str(sum(s >= 200 for s in sessions)))
              print("KAGGLE_EQ_5M_200_TO_500=" + str(sum(200 <= s <= 500 for s in sessions)))
              print("KAGGLE_EQ_5M_GT_500=" + str(sum(s > 500 for s in sessions)))
              print("KAGGLE_EQ_5M_FIRST_DATE_MIN=" + min(d[0] for d in dates))
              print("KAGGLE_EQ_5M_LAST_DATE_MAX=" + max(d[1] for d in dates))
              for row in sorted(eq5, key=lambda r: int(float(r.get("sessions") or 0)), reverse=True)[:20]:
                  print("KAGGLE_EQ_5M_ROW=" + json.dumps({k: row.get(k) for k in ("file","sessions","sessions_50plus_bars","first_date","last_date","zero_volume_pct")}, sort_keys=True))
          else:
              print("KAGGLE_EQ_5M_SESSIONS=NO_MATCHING_IMPORTED_EQUITY_5M_FILES")
          cats = {}
          for row in quality_rows:
              cats[row.get("category", "")] = cats.get(row.get("category", ""), 0) + 1
          print("KAGGLE_QUALITY_CATEGORY_COUNTS=" + json.dumps(cats, sort_keys=True))
          PY

      - name: Inspect equity research parquet (read-only)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pandas pyarrow
          python - <<'PY'
          import json, os
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          import pandas as pd

          info = json.loads(os.environ["GOOGLE_OAUTH_TOKEN_JSON"])
          creds = Credentials.from_authorized_user_info(info, scopes=["https://www.googleapis.com/auth/drive"])
          if not creds.valid:
              creds.refresh(Request())
          service = build("drive", "v3", credentials=creds, cache_discovery=False)
          path = "/tmp/nse_equity_research_rows_2016_2026.parquet"
          with open(path, "wb") as fh:
              service.files().get_media(fileId="1I41xG7qiPFPM7UEJIjCd4TNDQYjaP1vt", supportsAllDrives=True).execute_to_file(fh)
          df = pd.read_parquet(path)
          print("EQUITY_PARQUET_SHAPE=" + json.dumps([int(df.shape[0]), int(df.shape[1])]))
          print("EQUITY_PARQUET_COLUMNS=" + json.dumps(list(map(str, df.columns))))
          for col in df.columns:
              s = df[col]
              sample = s.dropna().head(2).tolist()
              print("EQUITY_PARQUET_COL=" + json.dumps({"name": str(col), "dtype": str(s.dtype), "nunique": int(s.nunique(dropna=True)), "sample": [str(v) for v in sample]}, sort_keys=True))
          candidates = [c for c in df.columns if any(k in str(c).lower() for k in ("timestamp","datetime","date","time"))]
          print("EQUITY_PARQUET_TIME_CANDIDATES=" + json.dumps(list(map(str, candidates))))
          for col in candidates[:4]:
              try:
                  ts = pd.to_datetime(df[col], errors="coerce")
                  print("EQUITY_PARQUET_TIME_RANGE=" + json.dumps({"column": str(col), "min": str(ts.min()), "max": str(ts.max()), "non_null": int(ts.notna().sum())}, sort_keys=True))
              except Exception as exc:
                  print("EQUITY_PARQUET_TIME_ERROR=" + json.dumps({"column": str(col), "error": type(exc).__name__}, sort_keys=True))
          sym = [c for c in df.columns if any(k in str(c).lower() for k in ("symbol","ticker","instrument"))]
          print("EQUITY_PARQUET_SYMBOL_CANDIDATES=" + json.dumps(list(map(str, sym))))
          PY
