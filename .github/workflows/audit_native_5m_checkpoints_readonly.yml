name: Read-only native five-minute checkpoint audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          project_id: indian-market-trading
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: indian-market-trading

      - name: Inspect Cloud Run durability configuration and instance startup
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe indian-market-intraday-worker \
            --project=indian-market-trading --region=asia-south1 --format=json \
            > "$RUNNER_TEMP/cloud_run_service.json"
          SERVICE_URL="$(gcloud run services describe indian-market-intraday-worker --project=indian-market-trading --region=asia-south1 --format='value(status.url)')"
          ID_TOKEN="$(gcloud auth print-identity-token --audiences="$SERVICE_URL")"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 25 \
            -H "Authorization: Bearer $ID_TOKEN" "$SERVICE_URL/backfillz" \
            > "$RUNNER_TEMP/backfill_state.json"
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="indian-market-intraday-worker" AND resource.labels.revision_name="indian-market-intraday-worker-00106-lor" AND timestamp >= "2026-11-10T07:00:00Z" AND timestamp <= "2026-11-10T09:30:00Z"' \
            --project=indian-market-trading --limit=5000 --order=asc --format=json \
            > "$RUNNER_TEMP/cloud_run_startup_logs.json" || echo "LIFECYCLE_LOG_QUERY=FAILED"
          python - "$RUNNER_TEMP/cloud_run_service.json" "$RUNNER_TEMP/cloud_run_startup_logs.json" <<'PY'
          import json, re, sys
          from pathlib import Path

          doc=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          meta=doc.get("metadata") or {}
          spec=doc.get("spec") or {}
          template=spec.get("template") or doc.get("template") or {}
          tmeta=template.get("metadata") or {}
          tspec=template.get("spec") or {}
          annotations={**(meta.get("annotations") or {}), **(tmeta.get("annotations") or {}), **(template.get("annotations") or {})}
          scaling=template.get("scaling") or tspec.get("scaling") or {}
          containers=template.get("containers") or tspec.get("containers") or []
          mounts=[]
          env_names=[]
          path_env={}
          for container in containers:
              for item in (container.get("env") or []):
                  name=str(item.get("name") or "")
                  env_names.append(name)
                  value_from=item.get("valueFrom") or {}
                  secret_ref=value_from.get("secretKeyRef") or item.get("valueSource",{}).get("secretKeyRef")
                  if secret_ref:
                      path_env[name]={"secret_reference":secret_ref}
                  elif re.search(r"(ROOT|PATH|WORK|CHECKPOINT|BACKFILL|CACHE|TMP)",name,re.I):
                      value=item.get("value")
                      if value is not None:
                          path_env[name]=value
              for mount in (container.get("volumeMounts") or []):
                  mounts.append({"name":mount.get("name"),"mountPath":mount.get("mountPath"),"readOnly":mount.get("readOnly",False)})
          volumes=[]
          for volume in (tspec.get("volumes") or template.get("volumes") or []):
              volumes.append({"name":volume.get("name"),"source_types":sorted(k for k in volume if k not in {"name"})})
          result={
            "revision":(doc.get("status") or {}).get("latestReadyRevisionName") or (doc.get("status") or {}).get("latestCreatedRevisionName"),
            "service_account":tspec.get("serviceAccountName") or template.get("serviceAccount"),
            "cpu_throttling_annotation":annotations.get("run.googleapis.com/cpu-throttling"),
            "min_instances":scaling.get("minInstanceCount") or annotations.get("autoscaling.knative.dev/minScale") or annotations.get("run.googleapis.com/minScale"),
            "max_instances":scaling.get("maxInstanceCount") or annotations.get("autoscaling.knative.dev/maxScale") or annotations.get("run.googleapis.com/maxScale"),
            "container_concurrency":tspec.get("containerConcurrency") or template.get("maxInstanceRequestConcurrency"),
            "path_environment":path_env,
            "environment_variable_names":sorted(set(env_names)),
            "volume_mounts":mounts,
            "volumes":volumes
          }
          print("CLOUD_RUN_DURABILITY_CONFIG="+json.dumps(result,sort_keys=True,default=str))
          status=json.loads(Path(sys.argv[2].replace("cloud_run_startup_logs.json","backfill_state.json")).read_text(encoding="utf-8"))
          backfill=status.get("five_minute_backfill") or {}
          progress=backfill.get("progress") or {}
          print("CURRENT_BACKFILL_STATE="+json.dumps({
            "status":backfill.get("status"),"started_at_utc":backfill.get("started_at_utc"),
            "updated_at_utc":backfill.get("updated_at_utc"),"worker_thread_alive":backfill.get("worker_thread_alive"),
            "progress":{k:progress.get(k) for k in ("stage","batch","total_batches","completed_symbols","resolved_symbols","api_calls","api_calls_in_batch","window_key","window_end","checkpoint_source")},
            "counters":backfill.get("counters"),"error":backfill.get("error")
          },sort_keys=True,default=str))
          try:
              logs=json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          except Exception:
              logs=[]
          found=[]
          by_instance={}
          for entry in logs if isinstance(logs,list) else []:
              payload=entry.get("textPayload") or entry.get("jsonPayload") or entry.get("protoPayload") or ""
              payload_text=json.dumps(payload,sort_keys=True,default=str) if not isinstance(payload,str) else payload
              labels=entry.get("labels") or {}
              instance=labels.get("instanceId") or labels.get("instance_id") or "INSTANCE_ID_NOT_EXPOSED"
              event_match=bool(re.search(r"SYMBOL_PARQUET_PERSISTED|CHECKPOINT.*PERSIST|BACKFILL.*(START|FINISH|COMPLETE|FAIL|ERROR)|indstocks_5m_backfill_(started|finished|failed|retry_scheduled)|cloud_run_worker_api_(started|stopped)|Traceback|Exception|ERROR|invalid_grant|RefreshError|upload.{0,30}(fail|error)|(?:fail|error).{0,30}upload|httpRequest|requestMethod|/backfill|OOM|out.of.memory|memory limit|container.*(terminate|exit|stop)|Killing|terminated",payload_text,re.I))
              if event_match:
                  item={"timestamp":entry.get("timestamp"),"instance_id":instance,"revision":(entry.get("resource") or {}).get("labels",{}).get("revision_name"),"logName":entry.get("logName"),"message":payload_text[:3000]}
                  found.append(item)
                  by_instance.setdefault(instance,[]).append(item)
          summary={k:{"matching_events":len(v),"first":v[0].get("timestamp"),"last":v[-1].get("timestamp"),"persisted_symbol_events":sum(bool(re.search(r"SYMBOL_PARQUET_PERSISTED",x["message"],re.I)) for x in v),"start_finish_error_events":sum(bool(re.search(r"BACKFILL.*(START|FINISH|COMPLETE|FAIL|ERROR)|started|finished|failed|Traceback|Exception",x["message"],re.I)) for x in v)} for k,v in by_instance.items()}
          print("WORKER_LIFECYCLE_REQUEST_AUTH_AND_FAILURE_EVENTS_2026_11_10_1100_IST_TO_NOW="+json.dumps(found[:300],sort_keys=True))
          print("EVENT_COUNTS_BY_INSTANCE_ID="+json.dumps(summary,sort_keys=True))
          print("CLOUD_RUN_LOG_ROWS_SINCE_1100_IST="+str(len(logs) if isinstance(logs,list) else 0))
          PY

      - name: Load Drive credential from Secret Manager
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          WORKFLOW_SA="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          echo "WORKFLOW_SERVICE_ACCOUNT=$WORKFLOW_SA"
          if ! gcloud secrets versions access latest \
            --project=indian-market-trading \
            --secret=google-oauth-token-json \
            > "$RUNNER_TEMP/drive_token.json"; then
            rm -f "$RUNNER_TEMP/drive_token.json"
            echo "ERROR=secret_accessor_role_required"
            echo "Grant roles/secretmanager.secretAccessor on google-oauth-token-json to serviceAccount:$WORKFLOW_SA"
            exit 1
          fi
          test -s "$RUNNER_TEMP/drive_token.json"
          echo "GOOGLE_OAUTH_TOKEN_FILE=$RUNNER_TEMP/drive_token.json" >> "$GITHUB_ENV"
      - name: Read-only Drive checkpoint and worker audit
        env:
          GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          PROJECT_ID: indian-market-trading
          REGION: asia-south1
          SERVICE: indian-market-intraday-worker
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${GOOGLE_OAUTH_TOKEN_FILE:-}" && -s "$GOOGLE_OAUTH_TOKEN_FILE" && -n "$GOOGLE_DRIVE_ROOT_ID" ]] || { echo "ERROR=drive_audit_credential_file_or_root_missing"; exit 1; }
          python -m pip install --quiet google-api-python-client google-auth
          SERVICE_URL="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          TOKEN="$(gcloud auth print-identity-token --audiences="$SERVICE_URL")"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 25 -H "Authorization: Bearer $TOKEN" "$SERVICE_URL/backfillz" > "$RUNNER_TEMP/backfill_state.json"
          python - "$RUNNER_TEMP/backfill_state.json" <<'PY'
          import json,sys
          b=json.load(open(sys.argv[1],encoding="utf-8"))
          s=b.get("five_minute_backfill") or {}
          print("LIVE_BACKFILL_STATE="+json.dumps({
            "status":s.get("status"),"started_at_utc":s.get("started_at_utc"),
            "updated_at_utc":s.get("updated_at_utc"),"error":s.get("error"),
            "exit_code":s.get("exit_code"),"progress":s.get("progress") or {}
          },sort_keys=True,default=str))
          PY
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          from collections import Counter
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          token_path=Path(os.environ["GOOGLE_OAUTH_TOKEN_FILE"])
          info=json.loads(token_path.read_text(encoding="utf-8"))
          # Do not request a new scope during refresh: Google refresh tokens are
          # restricted to the scopes originally granted during user consent.
          # Refresh with the token's existing grant, then verify Drive access.
          creds=Credentials.from_authorized_user_info(info)
          if not creds.valid: creds.refresh(Request())
          granted=set(creds.granted_scopes or [])
          drive_scopes={
              "https://www.googleapis.com/auth/drive",
              "https://www.googleapis.com/auth/drive.readonly",
              "https://www.googleapis.com/auth/drive.metadata.readonly",
          }
          print("DRIVE_OAUTH_GRANTED_SCOPES="+json.dumps(sorted(s for s in granted if "drive" in s)))
          if granted and not (granted & drive_scopes):
              raise RuntimeError("OAuth token has no usable Google Drive scope; reauthorize Drive access")
          drive=build("drive","v3",credentials=creds,cache_discovery=False)

          def children(parent,name=None):
              q=f"'{parent}' in parents and trashed=false"
              if name is not None: q += " and name="+json.dumps(name)
              out=[]; token=None
              while True:
                  r=drive.files().list(q=q,pageSize=1000,pageToken=token,
                    fields="nextPageToken,files(id,name,mimeType,size,modifiedTime,parents)").execute()
                  out.extend(r.get("files",[])); token=r.get("nextPageToken")
                  if not token: return out
          def folder(parent,name):
              found=[x for x in children(parent,name) if x.get("mimeType")=="application/vnd.google-apps.folder"]
              if len(found)!=1: raise RuntimeError(f"Expected one Drive folder {name}; found {len(found)}")
              return found[0]["id"]
          root=os.environ["GOOGLE_DRIVE_ROOT_ID"]
          for part in ["production_data","nse_official","intraday_seed","olo_5m_archive"]:
              root=folder(root,part)
          archive=root
          symbols=folder(archive,"symbols")
          cp=folder(symbols,"window_checkpoints")
          batch_dirs=[x for x in children(cp) if x.get("mimeType")=="application/vnd.google-apps.folder"]
          print("CHECKPOINT_BATCH_DIRECTORIES="+str(len(batch_dirs)))
          totals=Counter(); bad=[]; complete=[]
          for batch in batch_dirs:
              files=children(batch["id"])
              byname={x["name"]:x for x in files}
              parquet={n[:-8]:x for n,x in byname.items() if n.endswith(".parquet")}
              manifests={n[:-13]:x for n,x in byname.items() if n.endswith(".parquet.json")}
              totals["parquet"]+=len(parquet); totals["json"]+=len(manifests)
              totals["parquet_without_manifest"]+=len(set(parquet)-set(manifests))
              totals["manifest_without_parquet"]+=len(set(manifests)-set(parquet))
              for key in sorted(set(parquet)|set(manifests)):
                  if key not in parquet or key not in manifests:
                      bad.append({"batch":batch["name"],"window":key,"problem":"unpaired_file"})
                      continue
                  try:
                      raw=drive.files().get_media(fileId=manifests[key]["id"]).execute()
                      m=json.loads(raw.decode("utf-8") if isinstance(raw,bytes) else raw)
                      valid=(m.get("status")=="COMPLETE" and m.get("window_key")==key
                             and isinstance(m.get("symbols"),list) and 1<=len(m["symbols"])<=5
                             and isinstance(m.get("row_counts"),dict)
                             and set(m["row_counts"]).issubset(set(m["symbols"])))
                      if valid:
                          totals["valid_complete_manifests"]+=1
                          complete.append({"batch":batch["name"],"window":key,
                            "start":m.get("start"),"end":m.get("end"),
                            "symbols":m.get("symbols"),"rows":sum(
                              int(v) for v in m["row_counts"].values() if isinstance(v,(int,float))
                            ),"modified":manifests[key].get("modifiedTime")})
                      else:
                          totals["invalid_manifests"]+=1
                          bad.append({"batch":batch["name"],"window":key,"problem":"invalid_manifest",
                            "status":m.get("status"),"symbols_count":len(m.get("symbols",[])) if isinstance(m.get("symbols"),list) else None})
                  except Exception as e:
                      totals["unreadable_manifests"]+=1
                      bad.append({"batch":batch["name"],"window":key,"problem":type(e).__name__})
          print("CHECKPOINT_COUNTS="+json.dumps(dict(totals),sort_keys=True))
          print("CHECKPOINT_ISSUES="+json.dumps(bad[:100],sort_keys=True))
          print("LATEST_COMPLETE_CHECKPOINTS="+json.dumps(sorted(complete,key=lambda x:x.get("modified") or "",reverse=True)[:12],sort_keys=True))
          manifest_files=children(archive,"backfill_manifest.json")
          if manifest_files:
              try:
                  raw=drive.files().get_media(fileId=manifest_files[0]["id"]).execute()
                  gm=json.loads(raw.decode("utf-8") if isinstance(raw,bytes) else raw)
                  print("GLOBAL_MANIFEST_SUMMARY="+json.dumps({
                    "modified":manifest_files[0].get("modifiedTime"),
                    "top_level_keys":sorted(gm.keys()) if isinstance(gm,dict) else None,
                    "completed_symbols":gm.get("completed_symbols") if isinstance(gm,dict) else None,
                    "total_symbols":gm.get("total_symbols") if isinstance(gm,dict) else None,
                    "status_counts":dict(Counter(str(x.get("status")) for x in gm.get("results",[]) if isinstance(x,dict))) if isinstance(gm,dict) and isinstance(gm.get("results"),list) else None
                  },sort_keys=True,default=str))
              except Exception as e: print("GLOBAL_MANIFEST_READ_ERROR="+type(e).__name__)
          else: print("GLOBAL_MANIFEST=NOT_FOUND")
          print("AUDIT_MODE=READ_ONLY_NO_DRIVE_WRITES_NO_BACKFILL_RESTART")
          PY

      - name: Remove Drive credential
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/drive_token.json"
# Manual read-only reconciliation refresh: inspect checkpoint inventory and live worker state; no writes or restart.
