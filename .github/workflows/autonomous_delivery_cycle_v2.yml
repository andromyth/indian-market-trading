name: Beta V2 self-driving daily cycle

on:
  workflow_dispatch:
  # 07:15 IST on weekdays, after the overnight production refresh retries.
  # The runner also verifies the expected prior NSE session and refuses stale PIT.
  schedule:
    - cron: "45 1 * * 1-5"

jobs:
  beta-v2-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Google Drive authentication
        env:
          GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from persistent_store import drive_status

          status = drive_status(require_write=True)
          preflight_path = Path("/tmp/Indian_Market_Research/selfdriving/beta_version2/status_preflight.json")
          preflight_path.parent.mkdir(parents=True, exist_ok=True)
          preflight_path.write_text(
              json.dumps({
                  "checked_at_utc": datetime.now(timezone.utc).isoformat(),
                  "status": status,
              }, indent=2, default=str),
              encoding="utf-8",
          )
          print(status)
          if not status.get("configured") or status.get("reachable") is False or status.get("write_ready") is False:
              raise SystemExit(
                  "Google Drive read/write preflight failed: "
                  + str(status.get("reason", "write authorization is not ready"))
              )
          PY

      - name: Run Beta V2 predict and validate
        env:
          GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          python -u selfdriving/sd_github_job_v2.py

      - name: Stage Beta V2 runtime reports
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/beta-v2-audit"
          for name in status_preflight.json status_data_audit.json status_cycle.json; do
            source="/tmp/Indian_Market_Research/selfdriving/beta_version2/$name"
            if [ -s "$source" ]; then
              cp "$source" "$GITHUB_WORKSPACE/beta-v2-audit/$name"
            fi
          done

      - name: Upload Beta V2 audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-v2-audit-${{ github.run_id }}
          path: beta-v2-audit/*.json
          if-no-files-found: warn
          retention-days: 14
