name: Autonomous intraday prediction-vs-actual audit

on:
  workflow_dispatch:
    inputs:
      audit_date:
        description: "Optional NSE session date YYYY-MM-DD (defaults to today in IST)"
        required: false
        default: ""
  # 16:00 IST = 10:30 UTC, after the Cloud Run worker's regular-session final flush.
  schedule:
    - cron: "30 10 * * 1-5"

permissions:
  contents: read

concurrency:
  group: autonomous-intraday-outcome-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve NSE audit session
        id: target
        env:
          MANUAL_AUDIT_DATE: ${{ inputs.audit_date }}
        run: |
          python - <<'PY'
          import os
          from datetime import date, datetime
          from zoneinfo import ZoneInfo
          from market_session_guard import is_nse_trading_day

          requested = os.environ.get("MANUAL_AUDIT_DATE", "").strip()
          target = date.fromisoformat(requested) if requested else datetime.now(ZoneInfo("Asia/Kolkata")).date()
          should_run = is_nse_trading_day(target)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"audit_date={target.isoformat()}\n")
              out.write(f"should_run={'true' if should_run else 'false'}\n")
          print(f"audit_date={target.isoformat()} should_run={should_run}")
          if not should_run:
              print("Skipping weekends/NSE holidays.")
          PY

      - name: Verify Google Drive read/write access
        id: drive_preflight
        if: steps.target.outputs.should_run == 'true'
        env:
          GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          python - <<'PY'
          from persistent_store import drive_status
          status = drive_status(require_write=True)
          print(status)
          if not status.get("configured") or status.get("reachable") is False or status.get("write_ready") is False:
              raise SystemExit("Google Drive read/write preflight failed: " + str(status.get("reason", "not ready")))
          PY

      - name: Validate matured intraday predictions and store report in Drive
        if: steps.target.outputs.should_run == 'true'
        env:
          GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          set -euo pipefail
          python -u audit_autonomous_intraday_outcomes.py \
            --start-date "${{ steps.target.outputs.audit_date }}" \
            --end-date "${{ steps.target.outputs.audit_date }}" \
            --segment service \
            --sync-drive

      - name: Audit full-universe minute snapshots and persist coverage report
        if: always() && steps.target.outputs.should_run == 'true' && steps.drive_preflight.outcome == 'success'
        env:
          GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          set -euo pipefail
          python -u audit_all_universe_minute_snapshots.py \
            --date "${{ steps.target.outputs.audit_date }}" \
            --sync-drive \
            --strict
