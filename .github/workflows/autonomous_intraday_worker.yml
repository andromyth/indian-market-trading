name: Autonomous NSE minute-level intraday worker

on:
  # Two bounded session segments keep each GitHub-hosted job below the
  # standard runner timeout while polling once per minute without Streamlit.
  # 09:20 IST = 03:50 UTC; 12:20 IST = 06:50 UTC.
  schedule:
    - cron: "50 3 * * 1-5"
    - cron: "50 6 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run a single cycle for testing or an entire session segment"
        type: choice
        required: true
        default: once
        options:
          - once
          - morning
          - afternoon

concurrency:
  group: autonomous-nse-intraday-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  intraday-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    env:
      GOOGLE_DRIVE_ROOT_ID: \${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GDRIVE_ROOT_FOLDER_ID: \${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: \${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_TOKEN_JSON: \${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
      INDSTOCKS_CLIENT_ID: \${{ secrets.INDSTOCKS_CLIENT_ID }}
      INDSTOCKS_MPIN: \${{ secrets.INDSTOCKS_MPIN }}
      INDSTOCKS_TOTP_SECRET: \${{ secrets.INDSTOCKS_TOTP_SECRET }}
      INDSTOCKS_ACCESS_TOKEN: \${{ secrets.INDSTOCKS_ACCESS_TOKEN }}
      AUTONOMOUS_INTRADAY_MAX_STOCKS: "5"
      QUANT_TIMEFRAME_DIAGNOSTICS: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify Google Drive persistence is writable
        run: |
          python - <<'PY'
          from persistent_store import drive_status
          result = drive_status(require_write=True)
          print({
              key: result.get(key)
              for key in (
                  "configured", "reachable", "write_ready",
                  "auth_method", "write_auth_method", "reason"
              )
          })
          if (
              not result.get("configured")
              or result.get("reachable") is False
              or result.get("write_ready") is False
          ):
              raise SystemExit(
                  "Autonomous worker requires working Google Drive read/write "
                  "credentials; refusing to run without durable persistence."
              )
          PY

      - name: Run unattended minute-by-minute collection and prediction
        shell: bash
        run: |
          set -euo pipefail
          if [[ "\${{ github.event_name }}" == "schedule" ]]; then
            if [[ "\${{ github.event.schedule }}" == "50 3 * * 1-5" ]]; then
              MODE="morning"
            else
              MODE="afternoon"
            fi
          else
            MODE="\${{ inputs.mode || 'once' }}"
          fi
          echo "Starting autonomous intraday worker mode=\${MODE}"
          python -u autonomous_intraday_worker.py \\
            --segment "\${MODE}" \\
            --interval-seconds 60 \\
            --refresh-watchlist-seconds 900 \\
            --flush-every 5 \\
            --max-stocks 5

      - name: Upload worker logs and local status (diagnostic backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-intraday-worker-\${{ github.run_id }}
          path: |
            data/autonomous_intraday/**/*.json
            data/autonomous_intraday/**/*.jsonl
          if-no-files-found: warn
          retention-days: 14
