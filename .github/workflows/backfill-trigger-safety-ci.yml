name: Cloud Run backfill trigger safety tests

on:
  pull_request:
    paths:
      - "autonomous_intraday_worker_service.py"
      - "scripts/same_day_gap_backfill.py"
      - "tests/test_same_day_gap_backfill.py"
      - "indstocks_backfill_all_nse_5m_history.py"
      - "backfill_universe.json"
      - "tests/test_autonomous_intraday_backfill_trigger.py"
      - "tests/test_indstocks_backfill_request_guard.py"
      - "tests/test_backfill_checkpoint_key_stability.py"
      - "tests/test_backfill_universe_replacement.py"
      - "tests/test_indstocks_5m_backfill.py"
      - ".github/workflows/start_cloud_run_5m_backfill.yml"
      - ".github/workflows/backfill-trigger-safety-ci.yml"
  push:
    branches:
      - main
    paths:
      - "autonomous_intraday_worker_service.py"
      - "scripts/same_day_gap_backfill.py"
      - "tests/test_same_day_gap_backfill.py"
      - "indstocks_backfill_all_nse_5m_history.py"
      - "backfill_universe.json"
      - "tests/test_autonomous_intraday_backfill_trigger.py"
      - "tests/test_indstocks_backfill_request_guard.py"
      - "tests/test_backfill_checkpoint_key_stability.py"
      - "tests/test_backfill_universe_replacement.py"
      - "tests/test_indstocks_5m_backfill.py"
      - ".github/workflows/start_cloud_run_5m_backfill.yml"
      - ".github/workflows/backfill-trigger-safety-ci.yml"

permissions:
  contents: read

jobs:
  backfill-trigger-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Cloud Run worker and INDstocks backfill
        run: python -m py_compile autonomous_intraday_worker_service.py indstocks_backfill_all_nse_5m_history.py
      - name: Test controlled backfill trigger and request guard
        run: python -m pytest -q tests/test_autonomous_intraday_backfill_trigger.py tests/test_indstocks_backfill_request_guard.py tests/test_backfill_checkpoint_key_stability.py tests/test_backfill_universe_replacement.py tests/test_indstocks_5m_backfill.py tests/test_same_day_gap_backfill.py
