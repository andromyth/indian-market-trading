name: Backfill ALL-NSE native five-minute history

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backfill_all_nse_native_5m.yml"
      - "dhan_client.py"
      - "dhan_backfill_all_nse_5m_history.py"
      - "indstocks_backfill_all_nse_5m_history.py"
      - "indstocks_client.py"
  schedule:
    - cron: "15 10 * * 1-5"
  workflow_dispatch:
    inputs:
      sessions:
        description: "Maximum usable sessions retained per symbol (200-500)"
        required: true
        default: "500"
        type: choice
        options: ["200", "250", "300", "400", "500"]
      calendar_days:
        description: "Calendar-day lookback used to recover up to 500 sessions"
        required: true
        default: "1000"
        type: choice
        options: ["500", "750", "1000", "1250"]
      max_symbols:
        description: "0 = full official NSE equity universe; otherwise a test cap"
        required: true
        default: "0"
        type: string
      provider:
        description: "Prefer DhanHQ; fall back to INDstocks when Dhan credentials are absent"
        required: true
        default: "auto"
        type: choice
        options: ["auto", "dhan", "indstocks"]

permissions:
  contents: read

concurrency:
  group: nse-native-5m-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
      DHAN_PIN: ${{ secrets.DHAN_PIN }}
      DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
      DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
      INDSTOCKS_ACCESS_TOKEN: ${{ secrets.INDSTOCKS_ACCESS_TOKEN }}
      INDSTOCKS_AUTH_MODE: manual
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install backfill dependencies
        run: pip install -r requirements.txt
      - name: Select provider and validate credentials before any download
        shell: bash
        env:
          REQUESTED_PROVIDER: ${{ inputs.provider || 'auto' }}
        run: |
          set -euo pipefail
          PROVIDER="${REQUESTED_PROVIDER}"
          if [[ "${PROVIDER}" == "auto" ]]; then
            if [[ -n "${DHAN_ACCESS_TOKEN}" || ( -n "${DHAN_CLIENT_ID}" && -n "${DHAN_PIN}" && -n "${DHAN_TOTP_SECRET}" ) ]]; then
              PROVIDER="dhan"
            elif [[ -n "${INDSTOCKS_ACCESS_TOKEN}" ]]; then
              PROVIDER="indstocks"
            else
              echo "No five-minute historical data credentials are configured."
              echo "Add DhanHQ TOTP credentials or INDSTOCKS_ACCESS_TOKEN to repository Actions secrets."
              exit 1
            fi
          fi
          case "${PROVIDER}" in
            dhan)
              if [[ -z "${DHAN_ACCESS_TOKEN}" && ( -z "${DHAN_CLIENT_ID}" || -z "${DHAN_PIN}" || -z "${DHAN_TOTP_SECRET}" ) ]]; then
                echo "DhanHQ selected but its access-token/TOTP credentials are missing."
                exit 1
              fi
              ;;
            indstocks)
              if [[ -z "${INDSTOCKS_ACCESS_TOKEN}" ]]; then
                echo "INDstocks selected but INDSTOCKS_ACCESS_TOKEN is missing."
                echo "Use a dashboard-generated token; this job will not mint a TOTP token or invalidate the Cloud Run worker's token."
                exit 1
              fi
              ;;
            *)
              echo "Unsupported provider: ${PROVIDER}"
              exit 1
              ;;
          esac
          [[ -n "${GOOGLE_DRIVE_ROOT_ID}" && -n "${GOOGLE_OAUTH_TOKEN_JSON}" ]] || { echo "Missing Google Drive write credentials"; exit 1; }
          echo "BACKFILL_PROVIDER=${PROVIDER}" >> "$GITHUB_ENV"
      - name: Backfill or incrementally catch up five-minute OHLCV
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            DAYS="${{ inputs.calendar_days }}"
            INITIAL_DAYS="${{ inputs.calendar_days }}"
          else
            DAYS=30
            INITIAL_DAYS=1000
          fi
          SESSIONS="${{ inputs.sessions || '500' }}"
          MAX_SYMBOLS="${{ inputs.max_symbols || '0' }}"
          SESSIONS="${SESSIONS:-500}"
          MAX_SYMBOLS="${MAX_SYMBOLS:-0}"
          if [[ "${BACKFILL_PROVIDER}" == "dhan" ]]; then
            python dhan_backfill_all_nse_5m_history.py \
              --sessions "${SESSIONS}" \
              --calendar-days "${DAYS}" \
              --initial-calendar-days "${INITIAL_DAYS}" \
              --minimum-usable-sessions 200 \
              --minimum-symbol-coverage 0.90 \
              --workers 2 \
              --pause-seconds 0.55 \
              --max-symbols "${MAX_SYMBOLS}"
          else
            python indstocks_backfill_all_nse_5m_history.py \
              --sessions "${SESSIONS}" \
              --calendar-days "${DAYS}" \
              --initial-calendar-days "${INITIAL_DAYS}" \
              --minimum-usable-sessions 200 \
              --minimum-symbol-coverage 0.90 \
              --pause-seconds 0.22 \
              --max-symbols "${MAX_SYMBOLS}"
          fi
