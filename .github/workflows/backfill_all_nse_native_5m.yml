name: Backfill ALL-NSE native five-minute history

on:
  workflow_dispatch:
    inputs:
      sessions:
        description: "Maximum usable sessions retained per symbol (200-500)"
        required: true
        default: "500"
        type: choice
        options: ["200", "250", "300", "400", "500"]
      calendar_days:
        description: "Calendar-day lookback used to recover up to 500 sessions"
        required: true
        default: "1000"
        type: choice
        options: ["500", "750", "1000", "1250"]
      max_symbols:
        description: "0 = full official NSE equity universe; otherwise a test cap"
        required: true
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: nse-native-5m-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
      DHAN_API_KEY: ${{ secrets.DHAN_API_KEY }}
      DHAN_API_SECRET: ${{ secrets.DHAN_API_SECRET }}
      DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install backfill dependencies
        run: pip install -r requirements.txt
      - name: Validate credentials before any download
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${DHAN_CLIENT_ID}" || -n "${DHAN_ACCESS_TOKEN}" ]] || { echo "Missing Dhan credentials"; exit 1; }
          [[ -n "${GOOGLE_DRIVE_ROOT_ID}" && -n "${GOOGLE_OAUTH_TOKEN_JSON}" ]] || { echo "Missing Google Drive write credentials"; exit 1; }
      - name: Backfill five-minute OHLCV and preserve the 500-session rolling archive
        run: |
          python dhan_backfill_all_nse_5m_history.py \
            --sessions "${{ inputs.sessions }}" \
            --calendar-days "${{ inputs.calendar_days }}" \
            --minimum-usable-sessions 200 \
            --workers 2 \
            --pause-seconds 0.55 \
            --max-symbols "${{ inputs.max_symbols }}"
