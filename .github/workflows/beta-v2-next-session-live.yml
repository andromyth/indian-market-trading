name: Beta V2 next-session live check (temporary)

on:
  push:
    branches:
      - feat/beta-v2-next-session-weekend-forecast
    paths:
      - ".github/workflows/beta-v2-next-session-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-beta-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Verify Google Drive read/write access and save preflight
        env:
          GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from persistent_store import drive_status
          out = Path("beta-v2-audit")
          out.mkdir(parents=True, exist_ok=True)
          status = drive_status(require_write=True)
          (out / "status_preflight.json").write_text(
              json.dumps({"checked_at_utc": datetime.now(timezone.utc).isoformat(), "status": status}, indent=2, default=str),
              encoding="utf-8",
          )
          print(json.dumps(status, indent=2, default=str))
          if not status.get("configured") or status.get("reachable") is False or status.get("write_ready") is False:
              raise SystemExit("Google Drive read/write preflight failed: " + str(status.get("reason", "write authorization is not ready")))
          PY

      - name: Run actual Beta V2 next-session forecast
        env:
          GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: python -u selfdriving/sd_github_job_v2.py

      - name: Stage runtime reports
        if: always()
        run: |
          set -euo pipefail
          mkdir -p beta-v2-audit
          source="/tmp/Indian_Market_Research/selfdriving/beta_version2"
          for name in status_data_audit.json status_cycle.json; do
            if [ -s "$source/$name" ]; then cp "$source/$name" "beta-v2-audit/$name"; fi
          done

      - name: Upload Beta V2 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-v2-next-session-live-${{ github.run_id }}
          path: beta-v2-audit/*.json
          if-no-files-found: warn
          retention-days: 14
