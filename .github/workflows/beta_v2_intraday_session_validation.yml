name: Beta V2 intraday session validation (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-v2-intraday-session-validation
  cancel-in-progress: false

jobs:
  validate-sessions:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate source Parquet contents and horizon labels
        env:
          GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          set -euo pipefail
          python -u audit_beta_v2_intraday_session_validation.py --out beta_v2_intraday_session_validation.json
      - name: Upload session validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-v2-intraday-session-validation
          path: beta_v2_intraday_session_validation.json
          if-no-files-found: warn
          retention-days: 30
      - name: Summarize session validation
        if: always()
        run: |
          python -c 'import json, os; from pathlib import Path; r=json.loads(Path("beta_v2_intraday_session_validation.json").read_text()) if Path("beta_v2_intraday_session_validation.json").exists() else {}; s={"status":r.get("status"),"official_nse_symbol_count":r.get("official_nse_symbol_count"),"summary":r.get("summary"),"retraining_authorized_by_this_audit":r.get("retraining_authorized_by_this_audit"),"promotion_performed":r.get("promotion_performed")}; summary="## Beta V2 intraday session validation\n\n```json\n"+json.dumps(s,indent=2)+"\n```\n"; open(os.environ["GITHUB_STEP_SUMMARY"],"a").write(summary); print(json.dumps(s,indent=2))'
