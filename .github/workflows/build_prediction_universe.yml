name: Build focused prediction universe

# Re-scores every symbol from the realised delivery/intraday ledgers and the
# F&O roster, then publishes production_data/prediction_universe/current.json.
# The Cloud Run capture/predict path reads this manifest each process and only
# pays provider calls for the ~500 selected symbols.
on:
  workflow_dispatch:
    inputs:
      realised_pnl:
        description: "Realised P&L to reinvest (Rs, optional)"
        required: false
        default: "0"
  schedule:
    # Sunday 02:30 UTC = 08:00 IST, before the Monday session.
    - cron: "30 2 * * 0"
permissions:
  contents: read

concurrency:
  group: prediction-universe-build
  cancel-in-progress: false

jobs:
  build-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Set repository import path
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Compile and unit test selection logic
        run: |
          set -euo pipefail
          python -m py_compile prediction_universe.py daily_picks.py
          pytest -q tests/test_prediction_universe.py

      - name: Verify Drive credentials without printing secret values
        run: |
          python - <<'PY'
          import os
          from persistent_store import drive_status
          if not os.getenv("GOOGLE_OAUTH_TOKEN_JSON") or not os.getenv("GOOGLE_DRIVE_ROOT_ID"):
              raise SystemExit("Google Drive OAuth/root-folder secrets are missing.")
          status = drive_status(require_write=True)
          print({
              "configured": status.get("configured"),
              "reachable": status.get("reachable"),
              "write_ready": status.get("write_ready"),
              "auth_method": status.get("auth_method"),
              "write_auth_method": status.get("write_auth_method"),
          })
          if status.get("reachable") is not True or status.get("write_ready") is not True:
              raise SystemExit("Google Drive read/write preflight failed.")
          PY

      - name: Build and publish universe manifest
        run: |
          python -u prediction_universe.py \
            --realised-pnl "${{ github.event.inputs.realised_pnl || '0' }}"

      - name: Upload manifest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prediction-universe-${{ github.run_id }}
          path: |
            production_data/prediction_universe/current.json
          if-no-files-found: ignore
