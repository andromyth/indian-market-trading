name: Check native five-minute backfill status

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check_native_5m_backfill_status.yml"

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_ID: indian-market-trading
      REGION: asia-south1
      SERVICE: indian-market-intraday-worker
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          project_id: indian-market-trading

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: indian-market-trading

      - name: Audit Google Drive five-minute archive and checkpoint manifests
        shell: bash
        env:
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
        run: |
          set -euo pipefail
          python -m pip install --quiet google-api-python-client google-auth pandas pyarrow
          python - <<'PY'
          import json, os, sys
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError
          import io, re, hashlib
          import pandas as pd
          from googleapiclient.http import MediaIoBaseDownload

          token_text = os.environ.get("GOOGLE_OAUTH_TOKEN_JSON", "")
          root_id = os.environ.get("GOOGLE_DRIVE_ROOT_ID", "").strip()
          if not token_text or not root_id:
              print("DRIVE_AUDIT_STATUS=BLOCKED_MISSING_OAUTH_TOKEN_OR_ROOT_ID")
              sys.exit(2)
          info = json.loads(token_text)
          creds = Credentials.from_authorized_user_info(info, scopes=["https://www.googleapis.com/auth/drive"])
          if not creds.valid:
              creds.refresh(Request())
          service = build("drive", "v3", credentials=creds, cache_discovery=False)

          def children(parent_id, name=None):
              q = f"'{parent_id}' in parents and trashed = false"
              if name is not None:
                  q += " and name = " + json.dumps(name)
              rows, page = [], None
              while True:
                  result = service.files().list(
                      q=q, pageSize=1000, pageToken=page,
                      fields="nextPageToken,files(id,name,mimeType,size,modifiedTime,webViewLink,parents)"
                  ).execute()
                  rows.extend(result.get("files", []))
                  page = result.get("nextPageToken")
                  if not page:
                      break
              return rows

          def descend(parent, names):
              current = parent
              for name in names:
                  matches = [x for x in children(current, name) if x["mimeType"] == "application/vnd.google-apps.folder"]
                  if not matches:
                      raise RuntimeError("Drive folder path component not found: " + name)
                  current = matches[0]["id"]
              return current

          archive_id = descend(root_id, [
              "production_data", "nse_official", "intraday_seed", "olo_5m_archive"
          ])
          root_files = children(archive_id)
          symbols_dirs = [x for x in root_files if x["name"] == "symbols" and x["mimeType"] == "application/vnd.google-apps.folder"]
          if not symbols_dirs:
              raise RuntimeError("symbols folder is missing under the archive")
          symbols_id = symbols_dirs[0]["id"]
          symbol_root_files = children(symbols_id)
          checkpoint_dirs = [x for x in symbol_root_files if x["name"] == "window_checkpoints" and x["mimeType"] == "application/vnd.google-apps.folder"]
          symbol_dirs = [x for x in symbol_root_files if x["name"].startswith("symbol=") and x["mimeType"] == "application/vnd.google-apps.folder"]
          root_manifest = [x for x in root_files if x["name"] == "backfill_manifest.json"]
          if not checkpoint_dirs:
              raise RuntimeError("symbols/window_checkpoints folder is missing under the archive")
          all_checkpoint_files = []
          stack = [checkpoint_dirs[0]["id"]]
          while stack:
              parent = stack.pop()
              for item in children(parent):
                  if item["mimeType"] == "application/vnd.google-apps.folder":
                      stack.append(item["id"])
                  else:
                      all_checkpoint_files.append(item)
          # Deep-read every checkpoint Parquet; report each file separately.
          parquet_detail = []
          schema_counts = {}
          column_counts = {}
          symbol_union_by_batch = {}
          bad_parquet = []
          timestamp_candidates = ("Datetime", "datetime", "Timestamp", "timestamp", "Date", "date", "time")
          for item in sorted([x for x in all_checkpoint_files if x["name"].endswith(".parquet")], key=lambda x: x["name"]):
              batch = next((p for p in item.get("webViewLink", "").split("/") if False), None)
              # Find containing batch folder by Drive parent lookup; keep this audit read-only.
              try:
                  raw = io.BytesIO()
                  downloader = MediaIoBaseDownload(raw, service.files().get_media(fileId=item["id"]))
                  done = False
                  while not done:
                      _, done = downloader.next_chunk()
                  frame = pd.read_parquet(io.BytesIO(raw.getvalue()))
                  cols = list(map(str, frame.columns))
                  schema_key = "|".join(cols)
                  schema_counts[schema_key] = schema_counts.get(schema_key, 0) + 1
                  for col in cols:
                      column_counts[col] = column_counts.get(col, 0) + 1
                  symbol_col = next((c for c in ("Symbol", "symbol", "SYMBOL", "tradingsymbol") if c in frame.columns), None)
                  symbols = sorted({str(v).strip().upper() for v in frame[symbol_col].dropna().unique() if str(v).strip()}) if symbol_col else []
                  time_col = next((c for c in timestamp_candidates if c in frame.columns), None)
                  time_min = time_max = None
                  invalid_times = None
                  time_source = None
                  if time_col:
                      parsed = pd.to_datetime(frame[time_col], errors="coerce", utc=True)
                      time_source = "column:" + time_col
                  elif isinstance(frame.index, pd.DatetimeIndex):
                      parsed = pd.to_datetime(frame.index, errors="coerce", utc=True)
                      time_source = "DatetimeIndex:" + str(frame.index.name or "unnamed")
                  else:
                      parsed = None
                  if parsed is not None:
                      invalid_times = int(pd.isna(parsed).sum())
                      valid_times = parsed[~pd.isna(parsed)]
                      if len(valid_times):
                          time_min, time_max = str(valid_times.min()), str(valid_times.max())
                  reason = []
                  if len(frame) and not symbol_col: reason.append("nonempty_without_symbol_column")
                  # Checkpoint files intentionally aggregate multiple symbols per batch.
                  if parsed is None: reason.append("no_recognized_timestamp_column_or_datetime_index")
                  if parsed is not None and invalid_times: reason.append("invalid_timestamps")
                  name = item["name"]
                  stem = name[:-8] if name.endswith(".parquet") else name
                  patterns = [
                      r"^\d{8}T\d{4}_\d{8}T\d{4}$",
                      r"^\d{8}T\d{6}_\d{8}T\d{6}$",
                      r"^\d{8}_\d{8}$",
                      r"^\d{8}T\d{4}__\d{8}T\d{4}$"
                  ]
                  pattern = next((i + 1 for i, pat in enumerate(patterns) if re.fullmatch(pat, stem)), None)
                  parquet_detail.append({
                      "name": name, "bytes": item.get("size"), "rows": int(len(frame)),
                      "columns": cols, "symbol_column": symbol_col, "symbols": symbols,
                      "symbol_count": len(symbols), "timestamp_column": time_col, "timestamp_source": time_source,
                      "timestamp_min_utc": time_min, "timestamp_max_utc": time_max,
                      "invalid_timestamp_count": invalid_times, "filename_pattern_id": pattern,
                      "filename_stem": stem, "issues": reason,
                      "modifiedTime": item.get("modifiedTime")
                  })
                  if reason: bad_parquet.append({"name": name, "issues": reason})
              except Exception as exc:
                  bad_parquet.append({"name": item["name"], "issues": [type(exc).__name__ + ": " + str(exc)[:250]]})
                  parquet_detail.append({"name": item["name"], "read_error": type(exc).__name__ + ": " + str(exc)[:250]})
          # Match parquet/manifests within the same Drive parent folder; filenames repeat across batches.
          def file_key(x):
              return ((x.get("parents") or [""])[0], x["name"])
          by_key = {file_key(x): x for x in all_checkpoint_files}
          parquet_files = [x for x in all_checkpoint_files if x["name"].endswith(".parquet")]
          manifests = [x for x in all_checkpoint_files if x["name"].endswith(".parquet.json")]
          missing_pairs = [x["name"] for x in parquet_files if (file_key(x)[0], x["name"] + ".json") not in by_key]
          orphan_manifests = [x["name"] for x in manifests if (file_key(x)[0], x["name"][:-5]) not in by_key]
          complete, invalid, malformed, manifest_rows = 0, [], [], []
          for item in manifests:
              try:
                  req = service.files().get_media(fileId=item["id"])
                  import io
                  from googleapiclient.http import MediaIoBaseDownload
                  buf = io.BytesIO()
                  downloader = MediaIoBaseDownload(buf, req)
                  done = False
                  while not done:
                      _, done = downloader.next_chunk()
                  doc = json.loads(buf.getvalue().decode("utf-8"))
                  status = doc.get("status")
                  if status == "COMPLETE":
                      complete += 1
                  else:
                      invalid.append({"manifest": item["name"], "status": status})
                  manifest_rows.append({
                      "manifest": item["name"], "status": status,
                      "window_key": doc.get("window_key"),
                      "symbols_count": len(doc.get("symbols") or []),
                      "row_counts": doc.get("row_counts"),
                      "provider_omitted_codes_count": len(doc.get("provider_omitted_codes") or []),
                      "updated_at": item.get("modifiedTime"),
                  })
              except Exception as exc:
                  malformed.append({"manifest": item["name"], "error": str(exc)[:300]})
          report = {
              "archive_path": "production_data/nse_official/intraday_seed/olo_5m_archive",
              "archive_root_file_count": len(root_files),
              "symbols_root_file_count": len(symbol_root_files),
              "checkpoint_path": "production_data/nse_official/intraday_seed/olo_5m_archive/symbols/window_checkpoints",
              "checkpoint_subfolder_count": len([x for x in children(checkpoint_dirs[0]["id"]) if x["mimeType"] == "application/vnd.google-apps.folder"]),
              "checkpoint_file_count_recursive": len(all_checkpoint_files),
              "checkpoint_parquet_count": len(parquet_files),
              "checkpoint_manifest_count": len(manifests),
              "complete_manifest_count": complete,
              "parquet_missing_manifest_count": len(missing_pairs),
              "parquet_missing_manifest_examples": missing_pairs[:30],
              "orphan_manifest_count": len(orphan_manifests),
              "invalid_manifest_count": len(invalid),
              "invalid_manifest_examples": invalid[:20],
              "malformed_manifest_count": len(malformed),
              "malformed_manifest_examples": malformed[:20],
              "consolidated_symbol_folder_count": len(symbol_dirs),
              "root_backfill_manifest_present": bool(root_manifest),
              "recent_checkpoint_manifests": sorted(manifest_rows, key=lambda x: x.get("updated_at") or "", reverse=True)[:20],
              "parquet_deep_audit": {
                  "files_examined": len(parquet_detail),
                  "read_error_or_content_issue_count": len(bad_parquet),
                  "schema_variants": [{"columns": k.split("|") if k else [], "file_count": v} for k, v in sorted(schema_counts.items(), key=lambda kv: (-kv[1], kv[0]))],
                  "column_presence_counts": column_counts,
                  "filename_pattern_counts": {str(i): sum(1 for x in parquet_detail if x.get("filename_pattern_id") == i) for i in range(1, 5)},
                  "unrecognized_filename_count": sum(1 for x in parquet_detail if not x.get("filename_pattern_id")),
                  "bad_parquet_examples": bad_parquet[:100],
                  "every_file": parquet_detail
              },
          }
          print("DRIVE_ARCHIVE_AUDIT=" + json.dumps(report, sort_keys=True, default=str))
          if missing_pairs or malformed or invalid or bad_parquet:
              print("DRIVE_ARCHIVE_AUDIT_STATUS=NEEDS_ATTENTION")
          else:
              print("DRIVE_ARCHIVE_AUDIT_STATUS=STRUCTURAL_CHECKS_PASS")
          PY

      - name: Read live backfill state and recent Cloud Run progress logs
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          TOKEN="$(gcloud auth print-identity-token --audiences="$SERVICE_URL")"
          RESPONSE="$(mktemp)"
          LOGS="$(mktemp)"
          trap 'rm -f "$RESPONSE" "$LOGS"; unset TOKEN' EXIT
          CODE="$(curl --silent --show-error --connect-timeout 10 --max-time 25 \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/json" \
            --output "$RESPONSE" --write-out '%{http_code}' "$SERVICE_URL/backfillz")"
          echo "BACKFILL_STATUS_HTTP=$CODE"
          if [[ "$CODE" == "200" ]]; then
            python - "$RESPONSE" <<'PY'
          import json, sys
          body=json.load(open(sys.argv[1], encoding="utf-8"))
          state=body.get("five_minute_backfill") or {}
          progress=state.get("progress") or {}
          summary={
            "status": body.get("status"),
            "started_at_utc": state.get("started_at_utc"),
            "updated_at_utc": state.get("updated_at_utc"),
            "finished_at_utc": state.get("finished_at_utc"),
            "exit_code": state.get("exit_code"),
            "error": state.get("error"),
            "progress": progress,
          }
          print("BACKFILL_LIVE_STATE=" + json.dumps(summary, sort_keys=True, default=str))
          PY
          else
            cat "$RESPONSE"
            exit 1
          fi

          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="indian-market-intraday-worker" AND timestamp >= "'$(date -u -d '90 minutes ago' +%Y-%m-%dT%H:%M:%SZ)'"' \
            --project="$PROJECT_ID" --limit=500 --order=desc --format=json > "$LOGS"

          python - "$LOGS" <<'PY'
          import json, sys
          rows=json.load(open(sys.argv[1], encoding="utf-8"))
          keys=("indstocks_5m_backfill_progress","indstocks_5m_backfill_failed",
                "indstocks_5m_backfill_completed","indstocks_5m_backfill_started",
                "five_minute_backfill","FETCHING_HISTORY","RESUMED_CHECKPOINT",
                "api_calls_in_batch","api_calls","checkpoint write failed","window_checkpoints",
                "provider_omitted_codes","checkpoint_remote","FETCHING_HISTORY",
                "BACKFILL_PROGRESS","BACKFILL_BATCH_FAILED")
          found=[]
          for row in rows:
            rendered=json.dumps(row, sort_keys=True, default=str)
            if any(k in rendered for k in keys):
              found.append({
                "timestamp": row.get("timestamp"),
                "revision": (row.get("resource") or {}).get("labels",{}).get("revision_name"),
                "severity": row.get("severity"),
                "text": row.get("textPayload"),
                "jsonPayload": row.get("jsonPayload"),
              })
          print("BACKFILL_RELATED_LOG_COUNT=" + str(len(found)))
          for row in reversed(found[-80:]):
            print("BACKFILL_LOG=" + json.dumps(row, sort_keys=True, default=str))
          if not found:
            print("BACKFILL_LOG_NOTE=No matching backfill progress/error events found in the last 90 minutes.")
          PY
# Read-only checkpoint audit: compare resumable window checkpoints with consolidated per-symbol training coverage.
