name: Clean native 5m archive

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run to list, delete to wipe the archive contents"
        required: true
        type: choice
        options: [dry_run, delete, seed]
        default: dry_run
      confirm:
        description: "Type DELETE_ENTIRE_5M_ARCHIVE to allow delete"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      MODE: ${{ inputs.mode }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Wipe the five-minute archive folder
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet google-api-python-client google-auth
          python - <<'PY'
          import io, json, os, sys
          from datetime import datetime, timezone
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseUpload

          mode = os.environ.get("MODE", "dry_run")
          confirm = os.environ.get("CONFIRM", "")
          token_text = os.environ.get("GOOGLE_OAUTH_TOKEN_JSON", "")
          root_id = os.environ.get("GOOGLE_DRIVE_ROOT_ID", "").strip()
          if not token_text or not root_id:
              print("CLEAN_RESULT=BLOCKED_MISSING_OAUTH_TOKEN_OR_ROOT_ID")
              sys.exit(2)
          creds = Credentials.from_authorized_user_info(
              json.loads(token_text), scopes=["https://www.googleapis.com/auth/drive"]
          )
          if not creds.valid:
              creds.refresh(Request())
          service = build("drive", "v3", credentials=creds, cache_discovery=False)
          FOLDER = "application/vnd.google-apps.folder"

          def children(parent_id, name=None):
              q = f"'{parent_id}' in parents and trashed = false"
              if name is not None:
                  q += " and name = " + json.dumps(name)
              rows, page = [], None
              while True:
                  result = service.files().list(
                      q=q, pageSize=1000, pageToken=page,
                      fields="nextPageToken,files(id,name,mimeType,size,modifiedTime,parents)"
                  ).execute(num_retries=3)
                  rows.extend(result.get("files", []))
                  page = result.get("nextPageToken")
                  if not page:
                      break
              return rows

          def descend(parent, names):
              current = parent
              for name in names:
                  matches = [x for x in children(current, name) if x["mimeType"] == FOLDER]
                  if not matches:
                      raise RuntimeError("Drive folder path component not found: " + name)
                  current = matches[0]["id"]
              return current

          archive_id = descend(root_id, ["production_data", "nse_official", "intraday_seed", "olo_5m_archive"])
          root = children(archive_id)
          inventory = [
              {"name": x["name"], "type": "folder" if x["mimeType"] == FOLDER else "file", "id": x["id"]}
              for x in root
          ]
          print("CLEAN_ARCHIVE_PATH=production_data/nse_official/intraday_seed/olo_5m_archive")
          print("CLEAN_ROOT_INVENTORY=" + json.dumps(inventory, sort_keys=True))
          if mode == "seed":
              for item in root:
                  if item["name"] == "backfill_manifest.json":
                      service.files().delete(fileId=item["id"]).execute(num_retries=3)
              payload = {
                  "history_schema": "indstocks_5m_completed_close_ist_v2",
                  "checkpoint_schema_version": "indstocks-5m-date-def-v2-2026-11-19",
                  "seeded_after_clean_utc": datetime.now(timezone.utc).isoformat(),
                  "note": "Seeded fresh after wiping the archive so nightly runs resume instead of replacing every night.",
              }
              data = json.dumps(payload, sort_keys=True).encode("utf-8")
              created = service.files().create(
                  body={"name": "backfill_manifest.json", "parents": [archive_id]},
                  media_body=MediaIoBaseUpload(io.BytesIO(data), mimetype="application/json", resumable=False),
                  fields="id,name,size",
              ).execute(num_retries=3)
              print("CLEAN_SEEDED_MANIFEST_ID=" + created["id"])
              print("CLEAN_SEEDED_HISTORY_SCHEMA=" + payload["history_schema"])
              print("CLEAN_RESULT=SEEDED_MANIFEST")
              sys.exit(0)
          if mode != "delete":
              print("CLEAN_RESULT=DRY_RUN_ENTIRE_ARCHIVE")
              sys.exit(0)
          if confirm != "DELETE_ENTIRE_5M_ARCHIVE":
              print("CLEAN_RESULT=REFUSED_MISSING_CONFIRMATION")
              sys.exit(2)

          for item in root:
              service.files().delete(fileId=item["id"]).execute(num_retries=3)
              print("CLEAN_DELETED=" + item["name"] + " type=" + ("folder" if item["mimeType"] == FOLDER else "file"))

          created = service.files().create(
              body={"name": "symbols", "mimeType": FOLDER, "parents": [archive_id]},
              fields="id,name",
          ).execute(num_retries=3)
          print("CLEAN_RECREATED_SYMBOLS_ID=" + created["id"])

          after = children(archive_id)
          symbols = [x for x in after if x["name"] == "symbols" and x["mimeType"] == FOLDER]
          empty = bool(symbols) and not children(symbols[0]["id"])
          print("CLEAN_VERIFY_ROOT=" + json.dumps([x["name"] for x in after], sort_keys=True))
          print("CLEAN_VERIFY_SYMBOLS_EMPTY=" + str(empty))
          print("CLEAN_RESULT=DELETED_ENTIRE_ARCHIVE")
          PY
