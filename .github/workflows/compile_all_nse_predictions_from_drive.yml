name: Compile ALL-NSE predictions from Google Drive

on:
  pull_request:
  workflow_dispatch:
  # GitHub cron is UTC; the Python guard restricts execution to 09:15–15:25 IST
  # on NSE trading days. Cloud Run alone collects INDstocks quotes/history.
  schedule:
    - cron: "*/5 3-9 * * 1-5"

permissions:
  contents: read

concurrency:
  group: all-nse-drive-prediction-compiler
  cancel-in-progress: true

jobs:
  compile-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve India market date for history cache
        id: market_date
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          value = datetime.now(ZoneInfo("Asia/Kolkata")).strftime("%Y%m%d")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("value=" + value + "\\n")
          PY

      - name: Restore Drive history cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/drive_all_nse/history_cache
          key: nse-history-${{ steps.market_date.outputs.value }}
          restore-keys: |
            nse-history-

      - name: Compile and test Drive-only prediction path
        run: |
          set -euo pipefail
          python -m py_compile drive_all_nse_prediction_compiler.py all_nse_minute_prediction_capture.py
          pytest -q tests/test_indstocks_client.py tests/test_all_nse_minute_prediction_capture.py tests/test_drive_all_nse_prediction_compiler.py

      - name: Verify Drive credentials without printing secret values
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import os
          from persistent_store import drive_status
          if not os.getenv("GOOGLE_OAUTH_TOKEN_JSON") or not os.getenv("GOOGLE_DRIVE_ROOT_ID"):
              raise SystemExit("Google Drive OAuth/root-folder secrets are missing.")
          status = drive_status(require_write=True)
          print({
              "configured": status.get("configured"),
              "reachable": status.get("reachable"),
              "write_ready": status.get("write_ready"),
              "auth_method": status.get("auth_method"),
              "write_auth_method": status.get("write_auth_method"),
          })
          if status.get("reachable") is not True or status.get("write_ready") is not True:
              raise SystemExit("Google Drive read/write preflight failed.")
          PY

      - name: Compile latest persisted Drive snapshot and upload predictions
        if: github.event_name != 'pull_request'
        run: python -u drive_all_nse_prediction_compiler.py

      - name: Save updated Drive history cache
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: /tmp/drive_all_nse/history_cache
          key: nse-history-${{ steps.market_date.outputs.value }}
