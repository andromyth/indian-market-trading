name: Consolidate live 5m snapshots into native archive

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Trading-day lookback"
        type: string
        required: false
        default: "10"
      end_date:
        description: "Inclusive end date (YYYY-MM-DD); blank = today IST"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Report only, do not write Drive"
        type: boolean
        required: false
        default: false
  schedule:
    # 10:45 UTC = 16:15 IST, after the close and after the 16:00 backfill trigger.
    - cron: "45 10 * * *"

permissions:
  contents: read

concurrency:
  group: consolidate-live-5m-into-archive
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
      PYTHONPATH: ${{ github.workspace }}
      DAYS: ${{ github.event.inputs.days || '10' }}
      END_DATE: ${{ github.event.inputs.end_date || '' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Drive read/write preflight
        run: |
          python - <<'PY'
          from persistent_store import drive_status
          status = drive_status(require_write=True)
          print({key: status.get(key) for key in ("configured", "reachable", "write_ready", "auth_method")})
          if status.get("reachable") is not True or status.get("write_ready") is not True:
              raise SystemExit("Drive read/write preflight failed")
          PY

      - name: Fold recent live snapshots into the authoritative archive
        shell: bash
        run: |
          set -euo pipefail
          args=(--days "$DAYS")
          if [ -n "$END_DATE" ]; then args+=(--end-date "$END_DATE"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python -u consolidate_live_5m_into_archive.py "${args[@]}"
