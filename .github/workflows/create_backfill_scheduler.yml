name: Create native 5m backfill Cloud Scheduler job

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_ID: indian-market-trading
      REGION: asia-south1
      JOB: native-5m-backfill
      SCHED: native-5m-backfill-daily
      TRIGGER_SA: indian-market-scheduler@indian-market-trading.iam.gserviceaccount.com
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          project_id: indian-market-trading

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: indian-market-trading

      - name: Create or update the 16:00 IST trigger
        shell: bash
        run: |
          set -euo pipefail
          gcloud services enable cloudscheduler.googleapis.com --project="$PROJECT_ID" >/dev/null 2>&1 || true
          URI="https://run.googleapis.com/v2/projects/$PROJECT_ID/locations/$REGION/jobs/$JOB:run"
          if gcloud scheduler jobs describe "$SCHED" --project="$PROJECT_ID" --location="$REGION" >/dev/null 2>&1; then
            gcloud scheduler jobs update http "$SCHED" \
              --project="$PROJECT_ID" --location="$REGION" \
              --schedule="0 16 * * *" --time-zone="Asia/Kolkata" \
              --uri="$URI" --http-method=POST \
              --oauth-service-account-email="$TRIGGER_SA" \
              --message-body='{}' --attempt-deadline=180s
          else
            gcloud scheduler jobs create http "$SCHED" \
              --project="$PROJECT_ID" --location="$REGION" \
              --schedule="0 16 * * *" --time-zone="Asia/Kolkata" \
              --uri="$URI" --http-method=POST \
              --oauth-service-account-email="$TRIGGER_SA" \
              --message-body='{}' --attempt-deadline=180s
          fi
          gcloud scheduler jobs describe "$SCHED" --project="$PROJECT_ID" --location="$REGION" \
            --format='yaml(name,schedule,timeZone,state,httpTarget.uri,httpTarget.oauthToken.serviceAccountEmail)'

      - name: Report trigger status
        if: always()
        shell: bash
        run: |
          echo "TRIGGER_JOB=$SCHED"
          gcloud scheduler jobs list --project="$PROJECT_ID" --location="$REGION" \
            --format='table(name,schedule,timeZone,state)' || true
