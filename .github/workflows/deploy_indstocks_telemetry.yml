name: Deploy INDstocks telemetry revision (preserve schedules)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy_indstocks_telemetry.yml"
      - "indstocks_client.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: indstocks-telemetry-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJECT_ID: indian-market-trading
      REGION: asia-south1
      SERVICE: indian-market-intraday-worker
    steps:
      - name: Checkout merged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Require successful CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/multifactor_candidate_ci.yml/runs?branch=main&head_sha=${GITHUB_SHA}&per_page=20")"
            MATCH="$(printf '%s' "$RUNS" | python -c 'import json,os,sys; sha=os.environ["GITHUB_SHA"]; runs=[r for r in json.load(sys.stdin).get("workflow_runs",[]) if r.get("head_sha")==sha]; print(json.dumps(max(runs,key=lambda r:r.get("created_at","")) if runs else {}))')"
            STATUS="$(printf '%s' "$MATCH" | python -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')"
            CONCLUSION="$(printf '%s' "$MATCH" | python -c 'import json,sys; print(json.load(sys.stdin).get("conclusion",""))')"
            if [[ "$STATUS" == "completed" ]]; then
              [[ "$CONCLUSION" == "success" ]] || { echo "CI failed; deployment blocked."; exit 1; }
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for CI; deployment blocked."
          exit 1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          project_id: indian-market-trading

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: indian-market-trading

      - name: Stage candidate without production traffic
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --source . \
            --build-service-account "projects/$PROJECT_ID/serviceAccounts/cloud-run-source-builder@$PROJECT_ID.iam.gserviceaccount.com" \
            --service-account "indian-market-intraday-runtime@$PROJECT_ID.iam.gserviceaccount.com" \
            --port 8080 --cpu 2 --memory 8Gi --min 1 --max 1 \
            --no-cpu-throttling --concurrency 1 --timeout 300 \
            --no-allow-unauthenticated --no-traffic --tag=telemetry \
            --update-env-vars "INDSTOCKS_AUTH_MODE=totp,AUTONOMOUS_INTRADAY_ROOT=/tmp/autonomous_intraday,AUTONOMOUS_INTRADAY_MAX_STOCKS=5,AUTONOMOUS_INTRADAY_INTERVAL_SECONDS=300,QUANT_TIMEFRAME_DIAGNOSTICS=1" \
            --update-secrets "GOOGLE_DRIVE_ROOT_ID=google-drive-root-id:latest,GDRIVE_ROOT_FOLDER_ID=google-drive-root-id:latest,GOOGLE_OAUTH_TOKEN_JSON=google-oauth-token-json:latest"

      - name: Validate candidate before promotion
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          CANDIDATE_URL="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.traffic)' | true)"
          CANDIDATE_URL="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format=json | python -c 'import json,sys; d=json.load(sys.stdin); xs=[x for x in d.get("status",{}).get("traffic",[]) if x.get("tag")=="telemetry"]; assert xs and xs[0].get("url"); print(xs[0]["url"])')"
          TOKEN="$(gcloud auth print-identity-token --audiences="$SERVICE_URL")"
          RESPONSE="$(mktemp)"
          trap 'rm -f "$RESPONSE"' EXIT
          CODE="$(curl --silent --show-error --connect-timeout 10 --max-time 60 -H "Authorization: Bearer $TOKEN" -H "Accept: application/json" -o "$RESPONSE" -w "%{http_code}" "$CANDIDATE_URL/modelz")"
          python - "$RESPONSE" "$CODE" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          checks=data.get("checks") or {}
          ok=(sys.argv[2]=="200" and data.get("status")=="ok"
              and checks.get("bar_interval_minutes")==5
              and checks.get("target")=="target_30m"
              and checks.get("feature_count_manifest")==checks.get("feature_count_runtime")
              and checks.get("feature_list_matches_runtime") is True
              and checks.get("artifact_hashes_match") is True
              and checks.get("drive_configured") is True
              and checks.get("drive_reachable") is True
              and checks.get("drive_write_ready") is True)
          print(json.dumps({"http":sys.argv[2],"status":data.get("status"),
              "bar_interval_minutes":checks.get("bar_interval_minutes"),
              "target":checks.get("target"),
              "feature_count_manifest":checks.get("feature_count_manifest"),
              "feature_count_runtime":checks.get("feature_count_runtime"),
              "drive_reachable":checks.get("drive_reachable"),
              "drive_write_ready":checks.get("drive_write_ready")},sort_keys=True))
          if not ok: sys.exit("Candidate preflight failed; production traffic unchanged.")
          PY
          echo "CANDIDATE_PREFLIGHT=PASS"

      - name: Promote candidate revision only
        shell: bash
        run: |
          set -euo pipefail
          REVISION="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format=json | python -c 'import json,sys; d=json.load(sys.stdin); xs=[x for x in d.get("status",{}).get("traffic",[]) if x.get("tag")=="telemetry"]; assert xs and xs[0].get("revisionName"); print(xs[0]["revisionName"])')"
          gcloud run services update-traffic "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --to-revisions="$REVISION=100" --quiet
          READY="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.latestReadyRevisionName)')"
          [[ "$READY" == "$REVISION" ]] || { echo "Ready revision mismatch: $READY"; exit 1; }
          echo "PROMOTED_REVISION=$REVISION"
          echo "SCHEDULER_AND_BACKFILL_TIMING=UNCHANGED"
