name: Deploy intraday worker recovery revision

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy_intraday_worker_recovery.yml"
      - "autonomous_intraday_worker.py"
      - "autonomous_intraday_worker_service.py"
      - "all_universe_minute_capture.py"
      - "all_nse_minute_prediction_capture.py"
      - "all_nse_intraday_model.py"
      - "calibration_overlay.py"
      - "audit_all_universe_minute_snapshots.py"
      - "verify_minute_prediction_persistence.py"
      - "tests/test_all_universe_minute_audit.py"
      - "tests/test_autonomous_intraday_worker.py"
      - "persistent_store.py"
      - "indstocks_client.py"
      - "market_session_guard.py"
      - "data_fetcher.py"
      - "nse_data_layer.py"
      - "selfdriving/**"
      - "requirements.txt"
      - "Dockerfile"

permissions:
  contents: read
  actions: read

concurrency:
  group: intraday-worker-recovery-deploy
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    # Deploy only by explicit dispatch or a clearly tagged, CI-gated main commit.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-intraday]'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJECT_ID: indian-market-trading
      REGION: asia-south1
    steps:
      - name: Checkout the commit being verified
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Require successful Multi-factor candidate CI for this exact commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/multifactor_candidate_ci.yml/runs?branch=main&head_sha=${GITHUB_SHA}&per_page=20")"
            MATCH="$(printf '%s' "$RUNS" | python -c 'import json, os, sys; sha=os.environ["GITHUB_SHA"]; runs=[r for r in json.load(sys.stdin).get("workflow_runs", []) if r.get("head_sha")==sha]; print(json.dumps(max(runs, key=lambda r:r.get("created_at", "")) if runs else {}))')"
            RUN_ID="$(printf '%s' "$MATCH" | python -c 'import json,sys; print(json.load(sys.stdin).get("id", ""))')"
            STATUS="$(printf '%s' "$MATCH" | python -c 'import json,sys; print(json.load(sys.stdin).get("status", ""))')"
            CONCLUSION="$(printf '%s' "$MATCH" | python -c 'import json,sys; print(json.load(sys.stdin).get("conclusion", ""))')"
            if [[ -n "$RUN_ID" ]]; then
              echo "CI_RUN_ID=$RUN_ID STATUS=$STATUS CONCLUSION=$CONCLUSION"
              if [[ "$STATUS" == "completed" ]]; then
                [[ "$CONCLUSION" == "success" ]] || {
                  echo "Deployment blocked: CI for this exact commit did not pass."
                  exit 1
                }
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Deployment blocked: timed out waiting for CI for this exact commit."
          exit 1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          project_id: indian-market-trading

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: indian-market-trading

      - name: Stage candidate revision without production traffic
        shell: bash
        run: |
          set -euo pipefail
          # The existing APIs, runtime service account, scheduler identity, and
          # invoker bindings were provisioned previously. Do not re-enable APIs
          # or mutate project IAM from this narrowly scoped deployment identity.
          gcloud run deploy indian-market-intraday-worker \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --source . \
            --build-service-account "projects/$PROJECT_ID/serviceAccounts/cloud-run-source-builder@$PROJECT_ID.iam.gserviceaccount.com" \
            --service-account "indian-market-intraday-runtime@$PROJECT_ID.iam.gserviceaccount.com" \
            --port 8080 \
            --cpu 1 \
            --memory 2Gi \
            --min 1 \
            --max 1 \
            --no-cpu-throttling \
            --concurrency 1 \
            --timeout 300 \
            --no-allow-unauthenticated \
            --no-traffic \
            --tag=five-minute-preflight \
            --update-env-vars "INDSTOCKS_AUTH_MODE=totp,AUTONOMOUS_INTRADAY_ROOT=/tmp/autonomous_intraday,AUTONOMOUS_INTRADAY_MAX_STOCKS=5,AUTONOMOUS_INTRADAY_INTERVAL_SECONDS=300,QUANT_TIMEFRAME_DIAGNOSTICS=1" \
            --update-secrets "GOOGLE_DRIVE_ROOT_ID=google-drive-root-id:latest,GDRIVE_ROOT_FOLDER_ID=google-drive-root-id:latest,GOOGLE_OAUTH_TOKEN_JSON=google-oauth-token-json:latest"

      - name: Validate staged five-minute model bundle with runtime credentials
        shell: bash
        run: |
          set -euo pipefail
          SERVICE=indian-market-intraday-worker
          SERVICE_URL="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          SERVICE_JSON="$(mktemp)"
          RESPONSE="$(mktemp)"
          trap 'rm -f "$SERVICE_JSON" "$RESPONSE"' EXIT
          gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format=json > "$SERVICE_JSON"
          python - "$SERVICE_JSON" "$GITHUB_ENV" <<'PY'
          import json, sys
          payload=json.load(open(sys.argv[1],encoding="utf-8"))
          matches=[
              item for item in ((payload.get("status") or {}).get("traffic") or [])
              if item.get("tag") == "five-minute-preflight" and item.get("url") and item.get("revisionName")
          ]
          if not matches:
              sys.exit("No tagged, zero-traffic candidate revision was found.")
          item=matches[0]
          with open(sys.argv[2],"a",encoding="utf-8") as env:
              env.write("STAGED_REVISION="+item["revisionName"]+"\\n")
              env.write("STAGED_URL="+item["url"]+"\\n")
          print("STAGED_REVISION_READY=true")
          PY
          echo "STAGED_REVISION=$STAGED_REVISION"
          MODEL_OK=0
          for SA in "SELF" "indian-market-scheduler@$PROJECT_ID.iam.gserviceaccount.com" "intraday-scheduler@$PROJECT_ID.iam.gserviceaccount.com"; do
            if [[ "$SA" == "SELF" ]]; then
              TOKEN="$(gcloud auth print-identity-token --audiences="$SERVICE_URL" 2>/dev/null)" || TOKEN=""
            else
              TOKEN="$(gcloud auth print-identity-token --impersonate-service-account="$SA" --audiences="$SERVICE_URL" 2>/dev/null)" || TOKEN=""
            fi
            [[ -n "$TOKEN" ]] || continue
            HTTP_CODE="$(curl --silent --show-error --connect-timeout 10 --max-time 60 -H "Authorization: Bearer $TOKEN" -H "Accept: application/json" --output "$RESPONSE" --write-out "%{http_code}" "$STAGED_URL/modelz")" || HTTP_CODE=000
            echo "STAGED_MODEL_DIAGNOSTIC_HTTP_STATUS=$HTTP_CODE"
            set +e
            python - "$RESPONSE" "$HTTP_CODE" <<'PY'
          import json,sys
          path, code = sys.argv[1:]
          try:
              data=json.load(open(path,encoding="utf-8"))
          except Exception:
              print("STAGED_MODEL_DIAGNOSTIC_JSON=INVALID")
              sys.exit(1)
          checks=data.get("checks") or {}
          summary={
              "status":data.get("status"),
              "probe":data.get("probe"),
              "bar_interval_minutes":checks.get("bar_interval_minutes"),
              "target":checks.get("target"),
              "feature_count_manifest":checks.get("feature_count_manifest"),
              "feature_count_runtime":checks.get("feature_count_runtime"),
              "feature_list_matches_runtime":checks.get("feature_list_matches_runtime"),
              "training_symbol_count":checks.get("training_symbol_count"),
              "artifact_hashes_match":checks.get("artifact_hashes_match"),
              "drive_configured":checks.get("drive_configured"),
              "drive_reachable":checks.get("drive_reachable"),
              "drive_write_ready":checks.get("drive_write_ready"),
              "reason":data.get("reason"),
              "error_type":data.get("error_type"),
          }
          print("STAGED_MODEL_PREFLIGHT="+json.dumps(summary,sort_keys=True))
          ok=(
              code=="200"
              and data.get("status")=="ok"
              and checks.get("bar_interval_minutes")==5
              and checks.get("target")=="target_30m"
              and checks.get("feature_count_manifest")==checks.get("feature_count_runtime")
              and checks.get("feature_list_matches_runtime") is True
              and checks.get("artifact_hashes_match") is True
              and checks.get("drive_configured") is True
              and checks.get("drive_reachable") is True
              and checks.get("drive_write_ready") is True
          )
          sys.exit(0 if ok else 1)
          PY
            RC=$?
            set -e
            if [[ "$RC" -eq 0 ]]; then MODEL_OK=1; break; fi
          done
          if [[ "$MODEL_OK" != "1" ]]; then
            echo "Deployment blocked: staged model/Drive preflight failed; production traffic and schedules remain unchanged."
            exit 1
          fi
          echo "STAGED_FIVE_MINUTE_MODEL_PREFLIGHT=PASS"

      - name: Promote verified candidate to production traffic
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update-traffic indian-market-intraday-worker \\
            --project="$PROJECT_ID" \\
            --region="$REGION" \\
            --to-revisions="$STAGED_REVISION=100" \\
            --quiet
          echo "PRODUCTION_TRAFFIC_PROMOTED_REVISION=$STAGED_REVISION"

      - name: Change existing intraday jobs to five-minute cadence
        shell: bash
        run: |
          set -euo pipefail
          # Patch schedule/retry metadata only. Do not send httpTarget/oidcToken
          # back to the API: that would require iam.serviceAccounts.actAs for the
          # existing Scheduler identity, which this deploy identity must not alter.
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          patch_schedule() {
            local job="$1"
            local schedule="$2"
            local name="projects/$PROJECT_ID/locations/$REGION/jobs/$job"
            local payload
            payload="$(python - "$name" "$schedule" <<'PY'
          import json, sys
          name, schedule = sys.argv[1:]
          print(json.dumps({
              "name": name,
              "schedule": schedule,
              "timeZone": "Asia/Kolkata",
              "attemptDeadline": "300s",
              "retryConfig": {
                  "retryCount": 2,
                  "maxRetryDuration": "45s",
                  "minBackoffDuration": "5s",
                  "maxBackoffDuration": "15s",
                  "maxDoublings": 1,
              },
          }))
          PY
          )"
            curl --fail-with-body --silent --show-error --request PATCH \
              --header "Authorization: Bearer $ACCESS_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$payload" \
              "https://cloudscheduler.googleapis.com/v1/$name?updateMask=schedule,timeZone,attemptDeadline,retryConfig" \
              >/dev/null
          }
          patch_schedule "intraday-worker-0915-0959" "15-55/5 9 * * 1-5"
          patch_schedule "intraday-worker-1000-1459" "*/5 10-14 * * 1-5"
          patch_schedule "intraday-worker-1500-1530" "0-25/5 15 * * 1-5"

          verify_schedule() {
            job="$1"; expected="$2"
            actual="$(gcloud scheduler jobs describe "$job" --project="$PROJECT_ID" --location="$REGION" --format='value(schedule)')"
            if [[ "$actual" != "$expected" ]]; then
              echo "SCHEDULE_VERIFICATION_FAILED job=$job expected=$expected actual=$actual"
              exit 1
            fi
            echo "FIVE_MINUTE_SCHEDULE_VERIFIED job=$job schedule=$actual"
          }
          verify_schedule "intraday-worker-0915-0959" "15-55/5 9 * * 1-5"
          verify_schedule "intraday-worker-1000-1459" "*/5 10-14 * * 1-5"
          verify_schedule "intraday-worker-1500-1530" "0-25/5 15 * * 1-5"

          verify_retry_config() {
            job="$1"
            gcloud scheduler jobs describe "$job" --project="$PROJECT_ID" --location="$REGION" --format=json |
              python -c '
          import json, sys
          job = json.load(sys.stdin)
          retry = job.get("retryConfig") or {}
          expected = {
              "retryCount": 2,
              "maxRetryDuration": "45s",
              "minBackoffDuration": "5s",
              "maxBackoffDuration": "15s",
              "maxDoublings": 1,
          }
          mismatches = {
              key: {"expected": value, "actual": retry.get(key)}
              for key, value in expected.items()
              if retry.get(key) != value
          }
          if mismatches:
              print(json.dumps({"job": job.get("name"), "retry_config_mismatch": mismatches}, sort_keys=True))
              sys.exit(1)
          print("BOUNDED_RETRIES_VERIFIED job=" + str(job.get("name")) + " retryConfig=" + json.dumps(retry, sort_keys=True))
          '
          }
          verify_retry_config "intraday-worker-0915-0959"
          verify_retry_config "intraday-worker-1000-1459"
          verify_retry_config "intraday-worker-1500-1530"

      - name: Verify ready revision, traffic, scheduler states and startup diagnostics
        shell: bash
        run: |
          set -euo pipefail
          SERVICE=indian-market-intraday-worker
          REVISION="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.latestReadyRevisionName)')"
          if [[ -z "$REVISION" ]]; then
            echo "ERROR: Cloud Run has no ready revision after deploy."
            gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='yaml(status)'
            exit 1
          fi
          echo "READY_REVISION=$REVISION"
          gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='yaml(status.latestReadyRevisionName,status.latestCreatedRevisionName,status.traffic)'

          echo "=== Scheduler job states ==="
          for job in intraday-worker-0915-0959 intraday-worker-1000-1459 intraday-worker-1500-1530 intraday-worker-finalize-1532; do
            gcloud scheduler jobs describe "$job" --project="$PROJECT_ID" --location="$REGION" --format='yaml(name,state,schedule,lastAttemptTime,status)' || exit 1
          done

          # An authenticated /tick probe runs the complete capture pipeline when
          # sent on a five-minute slot. Never force an extra full-universe capture
          # while the NSE market is open; doing so can exhaust the Scheduler request
          # deadline and overlap the normal production slot. Outside market hours,
          # the same Scheduler identity can safely confirm Drive preflight.
          LOCAL_DOW="$(TZ=Asia/Kolkata date +%u)"
          LOCAL_HHMM="$(TZ=Asia/Kolkata date +%H%M)"
          LOCAL_MINUTES=$((10#${LOCAL_HHMM:0:2} * 60 + 10#${LOCAL_HHMM:2:2}))
          PROBE_OK=false
          if [[ "$LOCAL_DOW" -le 5 && "$LOCAL_MINUTES" -ge 555 && "$LOCAL_MINUTES" -lt 930 ]]; then
            echo "DRIVE_PREFLIGHT_PROBE_SKIPPED=true reason=market_open_no_extra_tick"
            echo "Drive preflight will be verified by the normal authenticated scheduled tick."
            PROBE_OK=true
          else
            PROBE_JOB=intraday-worker-0915-0959
            echo "DRIVE_PREFLIGHT_PROBE_JOB=$PROBE_JOB"

          for probe in 1 2 3; do
            BEFORE="$(gcloud scheduler jobs describe "$PROBE_JOB" --project="$PROJECT_ID" --location="$REGION" --format='value(lastAttemptTime)')"
            echo "Starting authenticated Drive-preflight probe attempt $probe/3"
            if ! gcloud scheduler jobs run "$PROBE_JOB" --project="$PROJECT_ID" --location="$REGION" --quiet; then
              echo "Scheduler rejected or could not enqueue the probe; retrying."
              sleep 8
              continue
            fi

            for attempt in $(seq 1 18); do
              JOB_JSON="$(gcloud scheduler jobs describe "$PROBE_JOB" --project="$PROJECT_ID" --location="$REGION" --format=json)"
              set +e
              CHECK="$(printf '%s' "$JOB_JSON" | python -c '
          import datetime, json, sys
          job=json.load(sys.stdin)
          def parse(v):
              try:
                  return datetime.datetime.fromisoformat(str(v).replace("Z","+00:00"))
              except (TypeError, ValueError):
                  return None
          before=parse(sys.argv[1]) if sys.argv[1] else None
          attempted=parse(job.get("lastAttemptTime"))
          newer=attempted is not None and (before is None or attempted > before)
          status=job.get("status") or {}
          code=status.get("code")
          message=str(status.get("message") or "")[:240]
          # Cloud Scheduler omits default-valued Status fields on success.
          # A new attempt with an empty status object is therefore HTTP 2xx/OK.
          if code is None and not message:
              code=0
          print(json.dumps({
              "lastAttemptTime": job.get("lastAttemptTime"),
              "new_attempt": newer,
              "last_attempt_code": code,
              "last_attempt_message": message,
          }, sort_keys=True))
          if not newer or code is None:
              sys.exit(2)
          sys.exit(0 if int(code)==0 else 1)
          ' "$BEFORE" 2>/dev/null)"
              RC=$?
              set -e
              if [[ -n "$CHECK" ]]; then
                echo "SCHEDULER_PROBE_RESULT=$CHECK"
              fi
              if [[ $RC -eq 0 ]]; then
                echo "DRIVE_PREFLIGHT=OK via authenticated Cloud Scheduler /tick probe"
                PROBE_OK=true
                break
              elif [[ $RC -eq 1 ]]; then
                if printf '%s' "$CHECK" | grep -Eq '"last_attempt_message":.*(409|already running|in progress)'; then
                  echo "Worker was busy during the probe; retrying after a short pause."
                  break
                fi
                echo "ERROR: Authenticated /tick probe returned a failed Cloud Scheduler result."
                exit 1
              fi
              sleep 5
            done

            if [[ "$PROBE_OK" == "true" ]]; then
              break
            fi
            sleep 8
          done

          if [[ "$PROBE_OK" != "true" ]]; then
            echo "ERROR: Could not confirm successful authenticated /tick and Drive preflight."
            exit 1
          fi
          fi
