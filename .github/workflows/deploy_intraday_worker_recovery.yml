name: Deploy intraday worker recovery revision

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy_intraday_worker_recovery.yml"
      - "autonomous_intraday_worker.py"
      - "autonomous_intraday_worker_service.py"
      - "all_universe_minute_capture.py"
      - "all_nse_minute_prediction_capture.py"
      - "persistent_store.py"
      - "indstocks_client.py"
      - "market_session_guard.py"
      - "data_fetcher.py"
      - "nse_data_layer.py"
      - "selfdriving/**"
      - "requirements.txt"
      - "Dockerfile"

permissions:
  contents: read
  actions: read

concurrency:
  group: intraday-worker-recovery-deploy
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJECT_ID: indian-market-trading
      REGION: asia-south1
    steps:
      - name: Checkout the commit being verified
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Require successful Multi-factor candidate CI for this exact commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/multifactor_candidate_ci.yml/runs?branch=main&head_sha=${GITHUB_SHA}&per_page=20")"
            MATCH="$(printf '%s' "$RUNS" | python -c 'import json, os, sys; sha=os.environ["GITHUB_SHA"]; runs=[r for r in json.load(sys.stdin).get("workflow_runs", []) if r.get("head_sha")==sha]; print(json.dumps(max(runs, key=lambda r:r.get("created_at", "")) if runs else {}))')"
            RUN_ID="$(printf '%s' "$MATCH" | python -c 'import json,sys; print(json.load(sys.stdin).get("id", ""))')"
            STATUS="$(printf '%s' "$MATCH" | python -c 'import json,sys; print(json.load(sys.stdin).get("status", ""))')"
            CONCLUSION="$(printf '%s' "$MATCH" | python -c 'import json,sys; print(json.load(sys.stdin).get("conclusion", ""))')"
            if [[ -n "$RUN_ID" ]]; then
              echo "CI_RUN_ID=$RUN_ID STATUS=$STATUS CONCLUSION=$CONCLUSION"
              if [[ "$STATUS" == "completed" ]]; then
                [[ "$CONCLUSION" == "success" ]] || {
                  echo "Deployment blocked: CI for this exact commit did not pass."
                  exit 1
                }
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Deployment blocked: timed out waiting for CI for this exact commit."
          exit 1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          project_id: indian-market-trading

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: indian-market-trading

      - name: Deploy the tested worker using existing project infrastructure
        shell: bash
        run: |
          set -euo pipefail
          # The existing APIs, runtime service account, scheduler identity, and
          # invoker bindings were provisioned previously. Do not re-enable APIs
          # or mutate project IAM from this narrowly scoped deployment identity.
          gcloud run deploy indian-market-intraday-worker \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --source . \
            --build-service-account "projects/$PROJECT_ID/serviceAccounts/cloud-run-source-builder@$PROJECT_ID.iam.gserviceaccount.com" \
            --service-account "indian-market-intraday-runtime@$PROJECT_ID.iam.gserviceaccount.com" \
            --port 8080 \
            --cpu 1 \
            --memory 2Gi \
            --min 1 \
            --max 1 \
            --no-cpu-throttling \
            --concurrency 1 \
            --timeout 300 \
            --no-allow-unauthenticated \
            --update-env-vars "AUTONOMOUS_INTRADAY_ROOT=/tmp/autonomous_intraday,AUTONOMOUS_INTRADAY_MAX_STOCKS=5,AUTONOMOUS_INTRADAY_INTERVAL_SECONDS=60,QUANT_TIMEFRAME_DIAGNOSTICS=1" \
            --update-secrets "GOOGLE_DRIVE_ROOT_ID=google-drive-root-id:latest,GDRIVE_ROOT_FOLDER_ID=google-drive-root-id:latest,GOOGLE_OAUTH_TOKEN_JSON=google-oauth-token-json:latest"

      - name: Verify ready revision, traffic, scheduler states and startup diagnostics
        shell: bash
        run: |
          set -euo pipefail
          SERVICE=indian-market-intraday-worker
          REVISION="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.latestReadyRevisionName)')"
          if [[ -z "$REVISION" ]]; then
            echo "ERROR: Cloud Run has no ready revision after deploy."
            gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='yaml(status)'
            exit 1
          fi
          echo "READY_REVISION=$REVISION"
          gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='yaml(status.latestReadyRevisionName,status.latestCreatedRevisionName,status.traffic)'

          echo "=== Scheduler job states ==="
          for job in intraday-worker-0915-0959 intraday-worker-1000-1459 intraday-worker-1500-1530 intraday-worker-finalize-1532; do
            gcloud scheduler jobs describe "$job" --project="$PROJECT_ID" --location="$REGION" --format='yaml(name,state,schedule,lastAttemptTime,status)' || exit 1
          done

          # Validate Drive preflight through the real authenticated private /tick path.
          # /tick returns HTTP 503 when Drive read/write preflight is not ready. Invoke
          # a Scheduler job whose normal schedule is outside the current market window,
          # so this probe uses the already-authorized OIDC identity without requiring
          # project-wide Cloud Logging access for the GitHub deploy identity.
          PROBE_JOB=intraday-worker-0915-0959
          BEFORE="$(gcloud scheduler jobs describe "$PROBE_JOB" --project="$PROJECT_ID" --location="$REGION" --format='value(lastAttemptTime)')"
          echo "DRIVE_PREFLIGHT_PROBE_JOB=$PROBE_JOB"
          PROBE_OK=false

          for probe in 1 2 3; do
            echo "Starting authenticated Drive-preflight probe attempt $probe/3"
            if ! gcloud scheduler jobs run "$PROBE_JOB" --project="$PROJECT_ID" --location="$REGION" --quiet; then
              echo "Scheduler rejected or could not enqueue the probe; retrying."
              sleep 8
              continue
            fi

            for attempt in $(seq 1 18); do
              JOB_JSON="$(gcloud scheduler jobs describe "$PROBE_JOB" --project="$PROJECT_ID" --location="$REGION" --format=json)"
              set +e
              CHECK="$(printf '%s' "$JOB_JSON" | python -c '
          import datetime, json, sys
          job=json.load(sys.stdin)
          def parse(v):
              try:
                  return datetime.datetime.fromisoformat(str(v).replace("Z","+00:00"))
              except (TypeError, ValueError):
                  return None
          before=parse(sys.argv[1]) if sys.argv[1] else None
          attempted=parse(job.get("lastAttemptTime"))
          newer=attempted is not None and (before is None or attempted > before)
          status=job.get("lastAttemptStatus") or {}
          code=status.get("code")
          message=str(status.get("message") or "")[:240]
          print(json.dumps({
              "lastAttemptTime": job.get("lastAttemptTime"),
              "new_attempt": newer,
              "last_attempt_code": code,
              "last_attempt_message": message,
          }, sort_keys=True))
          if not newer or code is None:
              sys.exit(2)
          sys.exit(0 if int(code)==0 else 1)
          ' "$BEFORE" 2>/dev/null)"
              RC=$?
              set -e
              if [[ -n "$CHECK" ]]; then
                echo "SCHEDULER_PROBE_RESULT=$CHECK"
              fi
              if [[ $RC -eq 0 ]]; then
                echo "DRIVE_PREFLIGHT=OK via authenticated Cloud Scheduler /tick probe"
                PROBE_OK=true
                break
              elif [[ $RC -eq 1 ]]; then
                if printf '%s' "$CHECK" | grep -Eq '"last_attempt_message":.*(409|already running|in progress)'; then
                  echo "Worker was busy during the probe; retrying after a short pause."
                  break
                fi
                echo "ERROR: Authenticated /tick probe returned a failed Cloud Scheduler result."
                exit 1
              fi
              sleep 5
            done

            if [[ "$PROBE_OK" == "true" ]]; then
              break
            fi
            sleep 8
          done

          if [[ "$PROBE_OK" != "true" ]]; then
            echo "ERROR: Could not confirm successful authenticated /tick and Drive preflight."
            exit 1
          fi
