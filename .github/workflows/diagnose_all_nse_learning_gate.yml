name: Diagnose ALL-NSE row-gate eligibility

on:
  workflow_dispatch:
    inputs:
      session_date:
        description: "NSE session date YYYY-MM-DD; blank selects the latest weekday session"
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - "all_nse_prediction_learning.py"
      - "all_nse_minute_prediction_capture.py"
      - "all_universe_minute_capture.py"
      - ".github/workflows/diagnose_all_nse_learning_gate.yml"

permissions:
  contents: read

concurrency:
  group: all-nse-row-gate-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Read one session from Google Drive and report row-gate counters
        env:
          SESSION_DATE: ${{ inputs.session_date }}
          GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import date, datetime, timedelta
          from zoneinfo import ZoneInfo

          import io
          import pandas as pd

          from all_nse_prediction_learning import (
              PREDICTION_ROOT,
              _day_folder_files,
              _download_bytes,
              _download_json,
              _file_map,
              load_clean_session_data,
          )
          from persistent_store import GoogleDriveStore
          from market_session_guard import is_nse_trading_day

          ist = ZoneInfo("Asia/Kolkata")
          configured = os.environ.get("SESSION_DATE", "").strip()
          if configured:
              session = date.fromisoformat(configured)
          else:
              today = datetime.now(ist).date()
              session = next(
                  (today - timedelta(days=offset)
                   for offset in range(8)
                   if is_nse_trading_day(today - timedelta(days=offset))),
                  today,
              )

          store = GoogleDriveStore()
          predictions, quotes, ingestion = load_clean_session_data(store, session, session)

          # Inspect the newest persisted raw prediction shard as well as the
          # strict loader result. This is read-only and helps explain which
          # readiness/status fields block individually valid-looking forecasts.
          pred_files = _day_folder_files(store, PREDICTION_ROOT, session)
          manifests = _file_map(pred_files, "manifest_", ".json")
          shards = _file_map(pred_files, "predictions_", ".parquet")
          available_keys = sorted(set(manifests) & set(shards))
          latest_slot = available_keys[-1] if available_keys else None
          latest_manifest = {}
          latest_stats = {"status": "NO_COMPLETE_MANIFEST_AND_SHARD"}
          if latest_slot:
              latest_manifest = _download_json(store, manifests[latest_slot]["id"])
              raw = _download_bytes(store, shards[latest_slot]["id"])
              frame = pd.read_parquet(io.BytesIO(raw))
              def counts(column):
                  if column not in frame.columns:
                      return {}
                  return {
                      str(key): int(value)
                      for key, value in frame[column].astype("string").fillna("<NULL>").value_counts(dropna=False).items()
                  }
              def numeric_summary(column):
                  if column not in frame.columns:
                      return {"available": False}
                  series = pd.to_numeric(frame[column], errors="coerce").dropna()
                  if series.empty:
                      return {"available": True, "non_null": 0}
                  return {
                      "available": True,
                      "non_null": int(series.size),
                      "min": float(series.min()),
                      "p10": float(series.quantile(0.10)),
                      "p25": float(series.quantile(0.25)),
                      "median": float(series.median()),
                      "p75": float(series.quantile(0.75)),
                      "max": float(series.max()),
                  }
              latest_stats = {
                  "status": "RAW_SHARD_LOADED",
                  "slot_key_ist": latest_slot,
                  "row_count": int(len(frame)),
                  "columns_present": [
                      name for name in (
                          "symbol", "prediction_status", "actual_quote_status",
                          "trained_for_symbol", "data_limited",
                          "data_readiness_score", "feature_count",
                          "non_missing_feature_count", "actual_quote_age_seconds",
                          "actual_market_value", "probability_up_30m",
                          "forecast_target_timestamp_utc",
                      ) if name in frame.columns
                  ],
                  "prediction_status_counts": counts("prediction_status"),
                  "actual_quote_status_counts": counts("actual_quote_status"),
                  "feature_build_error_counts": (
                      frame.loc[
                          frame.get("prediction_status", pd.Series(index=frame.index, dtype="string"))
                          .astype(str).eq("FEATURE_BUILD_ERROR"), "error"
                      ].astype("string").fillna("<NULL>").value_counts(dropna=False).head(10).to_dict()
                      if "error" in frame.columns and "prediction_status" in frame.columns else {}
                  ),
                  "feature_build_error_examples": (
                      frame.loc[
                          frame.get("prediction_status", pd.Series(index=frame.index, dtype="string"))
                          .astype(str).eq("FEATURE_BUILD_ERROR"),
                          [col for col in ("symbol", "error") if col in frame.columns],
                      ].head(12).to_dict(orient="records")
                      if "prediction_status" in frame.columns else []
                  ),
                  "trained_for_symbol_counts": counts("trained_for_symbol"),
                  "data_limited_counts": counts("data_limited"),
                  "data_readiness_score": numeric_summary("data_readiness_score"),
                  "non_missing_feature_count": numeric_summary("non_missing_feature_count"),
                  "feature_count": numeric_summary("feature_count"),
                  "actual_quote_age_seconds": numeric_summary("actual_quote_age_seconds"),
                  "probability_up_30m": numeric_summary("probability_up_30m"),
                  "target_timestamp_non_null": (
                      int(pd.to_datetime(frame["forecast_target_timestamp_utc"], errors="coerce", utc=True).notna().sum())
                      if "forecast_target_timestamp_utc" in frame.columns else 0
                  ),
                  "actual_market_value_non_null": (
                      int(pd.to_numeric(frame["actual_market_value"], errors="coerce").notna().sum())
                      if "actual_market_value" in frame.columns else 0
                  ),
                  "unique_symbol_count": (
                      int(frame["symbol"].astype(str).str.strip().str.upper().str.replace(".NS", "", regex=False).nunique())
                      if "symbol" in frame.columns else 0
                  ),
                  "blank_symbol_count": (
                      int(frame["symbol"].astype(str).str.strip().eq("").sum())
                      if "symbol" in frame.columns else int(len(frame))
                  ),
                  "duplicate_symbol_count": (
                      int(len(frame) - frame["symbol"].astype(str).str.strip().str.upper().str.replace(".NS", "", regex=False).nunique())
                      if "symbol" in frame.columns else int(len(frame))
                  ),
                  "symbol_identity_complete_and_unique": (
                      "symbol" in frame.columns
                      and not frame["symbol"].astype(str).str.strip().eq("").any()
                      and not frame["symbol"].astype(str).str.strip().str.upper().str.replace(".NS", "", regex=False).duplicated().any()
                  ),
                  "unique_forecast_key_count": (
                      int(frame["forecast_key"].dropna().astype(str).nunique())
                      if "forecast_key" in frame.columns else 0
                  ),
              }
          # Inspect the interval ledger independently from the +30-minute forecast horizon.
          # A slot is a five-minute sampling time; target_timestamp remains +30 minutes.
          recent_slot_summaries = []
          for slot_key in available_keys[-24:]:
              slot_manifest = latest_manifest if slot_key == latest_slot else _download_json(store, manifests[slot_key]["id"])
              recent_slot_summaries.append({
                  "slot_key_ist": slot_key,
                  "manifest_status": slot_manifest.get("status"),
                  "expected_symbol_count": slot_manifest.get("expected_symbol_count"),
                  "row_count": slot_manifest.get("row_count"),
                  "prediction_count": slot_manifest.get("prediction_count"),
                  "quality_gate_pass": slot_manifest.get("quality_gate_pass"),
                  "missing_quote_count": slot_manifest.get("missing_quote_count"),
                  "data_limited_count": slot_manifest.get("data_limited_count"),
                  "history_ready": slot_manifest.get("history_ready"),
              })
          slot_start = datetime.combine(session, datetime.min.time(), tzinfo=ist).replace(hour=9, minute=15)
          last_session_anchor = datetime.combine(session, datetime.min.time(), tzinfo=ist).replace(hour=15, minute=25)
          now_ist = datetime.now(ist)
          if session < now_ist.date():
              expected_end = last_session_anchor
          else:
              expected_end = min(now_ist.replace(second=0, microsecond=0), last_session_anchor)
              expected_end = expected_end.replace(minute=(expected_end.minute // 5) * 5)
          expected_slot_keys = []
          cursor = slot_start
          while cursor <= expected_end and cursor <= last_session_anchor:
              expected_slot_keys.append(cursor.strftime("%Y%m%d_%H%M"))
              cursor += timedelta(minutes=5)
          available_slot_keys = set(available_keys)
          missing_expected_slots = [key for key in expected_slot_keys if key not in available_slot_keys]
          recent_expected_slots = expected_slot_keys[-12:]
          recent_slot_presence = [
              {"slot_key_ist": key, "prediction_and_manifest_persisted": key in available_slot_keys}
              for key in recent_expected_slots
          ]
          manifest_fields = {
              key: latest_manifest.get(key)
              for key in (
                  "status", "quality_gate_pass", "expected_symbol_count", "row_count",
                  "prediction_count", "missing_quote_count", "data_limited_count",
                  "untrained_symbol_count", "model_failure_count", "history_ready",
                  "history_seed_coverage_symbols", "history_seed_failed_batches",
                  "model_coverage_symbols", "model_status", "nifty_context_status",
                  "nifty_context_error", "trained_symbol_manifest_available",
                  "model_version", "quote_snapshot_read_error",
              )
              if key in latest_manifest
          }
          payload = {
              "diagnostic": "ALL_NSE_ROW_GATE",
              "session_date": session.isoformat(),
              "mode": "READ_ONLY",
              "latest_raw_slot": latest_slot,
              "latest_prediction_manifest": manifest_fields,
              "latest_raw_prediction_stats": latest_stats,
              "prediction_rows_returned_for_outcome_matching": int(len(predictions)),
              "quote_rows_loaded": int(len(quotes)),
              "clean_prediction_unique_symbols": (
                  int(predictions["symbol"].astype(str).str.strip().str.upper().str.replace(".NS", "", regex=False).nunique())
                  if "symbol" in predictions.columns else 0
              ),
              "clean_quote_unique_symbols": (
                  int(quotes["symbol"].astype(str).str.strip().str.upper().str.replace(".NS", "", regex=False).nunique())
                  if "symbol" in quotes.columns else 0
              ),
              "prediction_capture_interval_minutes": 5,
              "prediction_horizon_minutes": 30,
              "available_prediction_slots": int(len(available_keys)),
              "expected_prediction_slots_so_far": int(len(expected_slot_keys)),
              "missing_expected_prediction_slots_so_far": int(len(missing_expected_slots)),
              "missing_prediction_slot_keys_first_20": missing_expected_slots[:20],
              "recent_expected_slot_presence": recent_slot_presence,
              "recent_persisted_slot_manifests": recent_slot_summaries,
              "ingestion": ingestion,
              "production_model_changed": False,
              "calibration_registry_changed": False,
              "orders_placed": False,
          }
          print("ALL_NSE_ROW_GATE_DIAGNOSTIC_BEGIN")
          print(json.dumps(payload, indent=2, sort_keys=True, default=str))
          print("ALL_NSE_ROW_GATE_DIAGNOSTIC_END")
          PY
