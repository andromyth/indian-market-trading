name: Diagnose intraday model bundle location

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose_intraday_model_bundle_location.yml"

permissions:
  contents: read

concurrency:
  group: diagnose-intraday-model-bundle-location
  cancel-in-progress: false

jobs:
  locate-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-oauthlib
      - name: Locate five-minute model bundle in Drive (read only)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          token_text = os.environ.get("GOOGLE_OAUTH_TOKEN_JSON", "").strip()
          root_id = os.environ.get("GOOGLE_DRIVE_ROOT_ID", "").strip()
          if not token_text or not root_id:
              raise SystemExit("Drive OAuth token or research root ID is not configured.")
          info = json.loads(token_text)
          creds = Credentials.from_authorized_user_info(info, scopes=["https://www.googleapis.com/auth/drive"])
          if not creds.valid:
              creds.refresh(Request())
          service = build("drive", "v3", credentials=creds, cache_discovery=False)

          FOLDER = "application/vnd.google-apps.folder"

          def children(parent_id):
              out, page = [], None
              while True:
                  resp = service.files().list(
                      q=f"'{parent_id}' in parents and trashed = false",
                      pageSize=1000,
                      pageToken=page,
                      fields="nextPageToken,files(id,name,mimeType,size,modifiedTime)",
                      includeItemsFromAllDrives=True,
                      supportsAllDrives=True,
                  ).execute()
                  out.extend(resp.get("files", []))
                  page = resp.get("nextPageToken")
                  if not page:
                      break
              return out

          def find_child(parent_id, name):
              resp = service.files().list(
                  q=f"'{parent_id}' in parents and name = '{name}' and trashed = false",
                  pageSize=10,
                  fields="files(id,name,mimeType,size)",
                  includeItemsFromAllDrives=True,
                  supportsAllDrives=True,
              ).execute()
              files = resp.get("files", [])
              return files[0] if files else None

          models = find_child(root_id, "models")
          print("MODELS_FOLDER=" + json.dumps(models, sort_keys=True))
          if not models:
              print("MODELS_FOLDER_MISSING=true")
              raise SystemExit(0)

          top = children(models["id"])
          summary = []
          for item in sorted(top, key=lambda x: x.get("name", "").lower()):
              entry = {
                  "name": item.get("name"),
                  "id": item.get("id"),
                  "type": "folder" if item.get("mimeType") == FOLDER else item.get("mimeType"),
                  "modifiedTime": item.get("modifiedTime"),
              }
              if item.get("mimeType") == FOLDER:
                  kids = children(item["id"])
                  entry["children"] = sorted(k.get("name") for k in kids)[:40]
                  entry["child_count"] = len(kids)
              summary.append(entry)
          print("MODELS_CHILDREN=" + json.dumps(summary, sort_keys=True))

          wanted = [
              "ALL_NSE_INTRADAY_SESSION_CLOSE_MULTIFACTOR_2026_MODEL_MANIFEST.json",
              "deployment_all_nse_intraday_session_close_multifactor_classifier_2026.joblib",
              "deployment_all_nse_intraday_session_close_multifactor_regressor_2026.joblib",
          ]
          for name in wanted:
              resp = service.files().list(
                  q=f"name = '{name}' and trashed = false",
                  pageSize=20,
                  fields="files(id,name,mimeType,size,modifiedTime,parents)",
                  includeItemsFromAllDrives=True,
                  supportsAllDrives=True,
              ).execute()
              hits = resp.get("files", [])
              parents = []
              for hit in hits:
                  for pid in hit.get("parents", []):
                      meta = service.files().get(fileId=pid, fields="id,name,parents").execute()
                      parents.append(meta)
              print("GLOBAL_FILE_SEARCH=" + json.dumps({"name": name, "hits": hits, "parents": parents}, sort_keys=True))

          resp = service.files().list(
              q="mimeType = '" + FOLDER + "' and name contains 'session_close' and trashed = false",
              pageSize=50,
              fields="files(id,name,modifiedTime,parents)",
              includeItemsFromAllDrives=True,
              supportsAllDrives=True,
          ).execute()
          print("SESSION_CLOSE_FOLDERS=" + json.dumps(resp.get("files", []), sort_keys=True))

          # Inspect the to-close champion lane that the capture prefers.
          def read_text(file_id):
              return service.files().get_media(fileId=file_id).execute().decode("utf-8", "replace")

          def walk(path_parts):
              parent = root_id
              for part in path_parts:
                  found = find_child(parent, part)
                  if not found:
                      return None
                  parent = found["id"]
              return parent

          to_close = walk(["models", "to_close"])
          print("TO_CLOSE_FOLDER_ID=" + json.dumps(to_close))
          if to_close:
              print("TO_CLOSE_CHILDREN=" + json.dumps(sorted(k.get("name") for k in children(to_close))))
              latest = find_child(to_close, "latest.json")
              if latest:
                  print("TO_CLOSE_LATEST=" + read_text(latest["id"])[:4000])
              runs = walk(["models", "to_close", "runs"])
              if runs:
                  run_dirs = sorted((k for k in children(runs) if k.get("mimeType") == FOLDER), key=lambda x: x.get("name", ""))
                  print("TO_CLOSE_RUNS=" + json.dumps([{"name": k.get("name"), "id": k.get("id"), "children": sorted(c.get("name") for c in children(k["id"]))} for k in run_dirs], sort_keys=True))

          champion = walk(["production_data", "all_nse_champion"])
          print("CHAMPION_FOLDER_ID=" + json.dumps(champion))
          if champion:
              print("CHAMPION_CHILDREN=" + json.dumps(sorted(k.get("name") for k in children(champion))))
              champ_json = find_child(champion, "champion.json")
              if champ_json:
                  print("CHAMPION_JSON=" + read_text(champ_json["id"])[:6000])
          PY
