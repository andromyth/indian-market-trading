name: Diagnose live 5m snapshot and prediction readiness (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnose-live-5m-readonly
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PROJECT_ID: indian-market-trading
      REGION: asia-south1
      SERVICE: indian-market-intraday-worker
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
    steps:
      - name: Authenticate to Google Cloud (read only)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          project_id: indian-market-trading

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: indian-market-trading

      - name: GET live worker diagnostics (read only)
        shell: bash
        run: |
          set -uo pipefail
          SERVICE_URL="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          TOKEN="$(gcloud auth print-identity-token --audiences="$SERVICE_URL")"
          echo "SERVICE_URL=$SERVICE_URL"
          for route in healthz modelz capturez predictionz; do
            out="$(mktemp)"
            code="$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $TOKEN" -H "Accept: application/json" \
              --output "$out" --write-out '%{http_code}' "$SERVICE_URL/$route")"
            echo "GET_${route}_HTTP=$code"
            python - "$route" "$out" <<'PY'
          import json, sys
          route, path = sys.argv[1], sys.argv[2]
          try:
              body = json.load(open(path, encoding="utf-8"))
          except Exception as exc:
              print(f"{route.upper()}_PARSE_ERROR={exc}")
              raise SystemExit(0)
          if route == "healthz":
              keep = {k: v for k, v in body.items() if any(
                  t in k for t in ("history", "prediction", "capture", "worker_status", "status", "error")
              )}
              print("LIVE_HEALTH_SUBSET=" + json.dumps(keep, sort_keys=True, default=str)[:14000])
          else:
              print(route.upper() + "=" + json.dumps(body, sort_keys=True, default=str)[:14000])
          PY
            rm -f "$out"
          done
          unset TOKEN

      - name: Set up Python for Drive listing
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Drive client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-oauthlib

      - name: List live snapshot folders in Drive (read only)
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          token_text = os.environ.get("GOOGLE_OAUTH_TOKEN_JSON", "").strip()
          root_id = os.environ.get("GOOGLE_DRIVE_ROOT_ID", "").strip()
          if not token_text or not root_id:
              raise SystemExit("Drive OAuth token or research root ID is not configured.")
          info = json.loads(token_text)
          creds = Credentials.from_authorized_user_info(info, scopes=["https://www.googleapis.com/auth/drive"])
          if not creds.valid:
              creds.refresh(Request())
          service = build("drive", "v3", credentials=creds, cache_discovery=False)

          def find_child(parent, name):
              page = None
              while True:
                  res = service.files().list(
                      q=f"'{parent}' in parents and name = '{name}' and trashed = false",
                      pageSize=1000, pageToken=page,
                      fields="nextPageToken,files(id,name,mimeType)"
                  ).execute()
                  for item in res.get("files", []):
                      if item.get("name") == name:
                          return item["id"]
                  page = res.get("nextPageToken")
                  if not page:
                      return None

          def list_children(folder_id):
              rows, page = [], None
              while True:
                  res = service.files().list(
                      q=f"'{folder_id}' in parents and trashed = false",
                      pageSize=1000, pageToken=page,
                      fields="nextPageToken,files(id,name,mimeType,size,modifiedTime)"
                  ).execute()
                  rows.extend(res.get("files", []))
                  page = res.get("nextPageToken")
                  if not page:
                      return rows

          paths = [
              "production_data/intraday_minute_snapshots/2026/11/19",
              "production_data/intraday_minute_snapshots/2026/11/20",
              "production_data/all_universe_minute_snapshots/2026/11/19",
              "production_data/nse_official/intraday_5m_live/2026/11/19",
          ]
          for path in paths:
              cur = root_id
              missing = None
              for part in path.split("/"):
                  nxt = find_child(cur, part)
                  if not nxt:
                      missing = part
                      break
                  cur = nxt
              if missing:
                  print(f"DRIVE_PATH_MISSING={path} segment={missing}")
                  continue
              rows = list_children(cur)
              files = sorted(
                  [r for r in rows if r.get("mimeType") != "application/vnd.google-apps.folder"],
                  key=lambda r: str(r.get("name") or "")
              )
              total = sum(int(r.get("size") or 0) for r in files)
              names = [r.get("name") for r in files]
              report = {
                  "path": path,
                  "file_count": len(files),
                  "folder_count": len(rows) - len(files),
                  "total_bytes": total,
                  "first_names": names[:3],
                  "last_names": names[-3:],
                  "latest_modified": max([str(r.get("modifiedTime") or "") for r in files], default=None),
              }
              print("DRIVE_FOLDER_REPORT=" + json.dumps(report, sort_keys=True))
          PY

      - name: Note
        run: echo "READ_ONLY_DIAGNOSTIC_COMPLETE - no deploy, scheduler, secret, or backfill changes made."
