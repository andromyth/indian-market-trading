name: Find large Kaggle archives in Drive

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/find_large_kaggle_drive_archives.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: find-large-kaggle-drive-archives
  cancel-in-progress: false

jobs:
  find-archives:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google Drive client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-oauthlib

      - name: Search Drive metadata for large or Kaggle/NIFTY files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          token_text = os.environ.get("GOOGLE_OAUTH_TOKEN_JSON", "").strip()
          if not token_text:
              raise SystemExit("GOOGLE_OAUTH_TOKEN_JSON is not configured.")
          info = json.loads(token_text)
          creds = Credentials.from_authorized_user_info(
              info, scopes=["https://www.googleapis.com/auth/drive"]
          )
          if not creds.valid:
              creds.refresh(Request())
          service = build("drive", "v3", credentials=creds, cache_discovery=False)

          terms = ("kaggle", "nifty", "5minute", "5min", "5m", "ohlcv", "ohlc", "equity", "stock", "archive", "zip", "rar", "7z", "tar", "historical", "history", "intraday", "dataset", "data", "market", "nse", "parquet", "csv")
          found = {}
          for term in terms:
              query = f"trashed = false and name contains '{term}'"
              page = None
              while True:
                  response = service.files().list(
                      q=query,
                      pageSize=1000,
                      pageToken=page,
                      fields="nextPageToken,files(id,name,mimeType,size,modifiedTime,parents,webViewLink)"
                  ).execute()
                  for item in response.get("files", []):
                      found[item["id"]] = item
                  page = response.get("nextPageToken")
                  if not page:
                      break
          rows = [
              item for item in found.values()
              if int(item.get("size") or 0) >= 50_000_000
              or "kaggle" in str(item.get("name") or "").lower()
          ]
          rows.sort(key=lambda item: int(item.get("size") or 0), reverse=True)
          result = []
          for item in rows:
              result.append({
                  "name": item.get("name"),
                  "mimeType": item.get("mimeType"),
                  "size_bytes": int(item.get("size") or 0),
                  "size_mib": round(int(item.get("size") or 0) / (1024 * 1024), 2),
                  "modifiedTime": item.get("modifiedTime"),
                  "id": item.get("id"),
                  "parents": item.get("parents", []),
                  "webViewLink": item.get("webViewLink"),
              })
          print("KAGGLE_LARGE_DRIVE_FILE_SEARCH=" + json.dumps(result, sort_keys=True))
          print("KAGGLE_LARGE_DRIVE_FILE_COUNT=" + str(len(result)))
          PY
