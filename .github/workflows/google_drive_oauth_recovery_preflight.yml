name: Google Drive OAuth recovery preflight

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/google_drive_oauth_recovery_preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-drive-oauth-recovery-preflight
  cancel-in-progress: false

jobs:
  oauth-write-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal Google API dependencies
        run: python -m pip install --disable-pip-version-check google-auth google-api-python-client

      - name: Refresh OAuth token and verify temporary Drive write/delete
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import uuid

          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaInMemoryUpload

          root_id = os.environ.get("GOOGLE_DRIVE_ROOT_ID", "").strip()
          raw = os.environ.get("GOOGLE_OAUTH_TOKEN_JSON", "").strip()
          if not root_id or not raw:
              raise SystemExit("PREFLIGHT_FAIL: missing Drive root ID or OAuth token secret")

          try:
              info = json.loads(raw)
              if not isinstance(info, dict):
                  raise ValueError("token JSON is not an object")
              if not all(info.get(k) for k in ("client_id", "client_secret", "refresh_token", "token_uri")):
                  raise ValueError("authorized-user token is missing a required field")
          except Exception as exc:
              raise SystemExit(f"PREFLIGHT_FAIL: OAuth token JSON invalid ({type(exc).__name__})")

          credentials = Credentials.from_authorized_user_info(
              info,
              scopes=["https://www.googleapis.com/auth/drive"],
          )
          try:
              credentials.refresh(Request())
          except Exception as exc:
              text = str(exc).lower()
              print(f"OAUTH_REFRESH=FAIL exception={type(exc).__name__} invalid_grant={'invalid_grant' in text}")
              raise SystemExit("PREFLIGHT_FAIL: OAuth refresh rejected; no Drive file was created")

          print("OAUTH_REFRESH=PASS")
          service = build("drive", "v3", credentials=credentials, cache_discovery=False)
          marker = "oauth-recovery-preflight-" + uuid.uuid4().hex
          created_id = None
          try:
              created = service.files().create(
                  body={
                      "name": marker + ".txt",
                      "mimeType": "text/plain",
                      "parents": [root_id],
                      "appProperties": {"purpose": "temporary-auth-preflight"},
                  },
                  media_body=MediaInMemoryUpload(b"temporary OAuth write test; safe to delete"),
                  fields="id,name",
                  supportsAllDrives=True,
              ).execute()
              created_id = created["id"]
              print("DRIVE_TEMP_CREATE=PASS")
          except Exception as exc:
              print(f"DRIVE_TEMP_CREATE=FAIL exception={type(exc).__name__}")
              raise SystemExit("PREFLIGHT_FAIL: OAuth refreshed, but Drive create was rejected")
          finally:
              if created_id:
                  try:
                      service.files().delete(
                          fileId=created_id,
                          supportsAllDrives=True,
                      ).execute()
                      print("DRIVE_TEMP_DELETE=PASS")
                  except Exception as exc:
                      print(f"DRIVE_TEMP_DELETE=FAIL exception={type(exc).__name__}")
                      raise SystemExit("PREFLIGHT_FAIL: temporary test file cleanup failed; delete it manually in Drive")
          print("PREFLIGHT=PASS")
          PY
