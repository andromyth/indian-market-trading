name: Import NIFTY 5m context from Kaggle source (Drive)

on:
  workflow_dispatch:
    inputs:
      file_id:
        description: "Drive file id of NIFTY 50_5minute.csv"
        required: false
        default: "1OYzKJdwpqiIc5Qruzc_GTItVgjIC7_A4"

permissions:
  contents: read

jobs:
  import-nifty-context:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      FILE_ID: ${{ github.event.inputs.file_id || '1OYzKJdwpqiIc5Qruzc_GTItVgjIC7_A4' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --disable-pip-version-check pandas pyarrow google-api-python-client google-auth google-auth-oauthlib

      - name: Import CSV into NIFTY context parquet in Drive
        shell: bash
        run: |
          python - <<'PY'
          import io, json, os, sys
          from pathlib import Path
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload, MediaFileUpload

          sys.path.insert(0, ".")
          from ingest_kaggle_nifty_5m_context import (
              prepare_context_frame, REMOTE_RELATIVE_DIR, OUTPUT_NAME, _sha256,
          )

          info = json.loads(os.environ["GOOGLE_OAUTH_TOKEN_JSON"])
          root_id = os.environ["GOOGLE_DRIVE_ROOT_ID"]
          file_id = os.environ["FILE_ID"]
          creds = Credentials.from_authorized_user_info(info, scopes=["https://www.googleapis.com/auth/drive"])
          if not creds.valid:
              creds.refresh(Request())
          service = build("drive", "v3", credentials=creds, cache_discovery=False)

          local_csv = Path("/tmp/NIFTY_50_5minute.csv")
          req = service.files().get_media(fileId=file_id, supportsAllDrives=True)
          with local_csv.open("wb") as fh:
              dl = MediaIoBaseDownload(fh, req, chunksize=8 * 1024 * 1024)
              done = False
              while not done:
                  _, done = dl.next_chunk()
          print("DOWNLOADED_SOURCE_BYTES=" + str(local_csv.stat().st_size))

          import pandas as pd
          raw = pd.read_csv(local_csv)
          output, stats = prepare_context_frame(raw)
          local_parquet = Path("/tmp") / OUTPUT_NAME
          output.to_parquet(local_parquet, index=False)
          print("CONTEXT_ROWS=" + str(len(output)))
          print("CONTEXT_LAST_TIMESTAMP=" + str(output["Timestamp"].max()))
          print("CONTEXT_STATS=" + json.dumps(stats, sort_keys=True, default=str))

          def children(fid):
              out, page = [], None
              while True:
                  r = service.files().list(
                      q=f"'{fid}' in parents and trashed = false",
                      pageSize=1000, pageToken=page,
                      fields="nextPageToken,files(id,name,mimeType)",
                      supportsAllDrives=True, includeItemsFromAllDrives=True,
                  ).execute()
                  out.extend(r.get("files", []))
                  page = r.get("nextPageToken")
                  if not page:
                      return out

          current = root_id
          for part in REMOTE_RELATIVE_DIR.parts:
              matches = [x for x in children(current) if x["name"] == part and x["mimeType"] == "application/vnd.google-apps.folder"]
              if matches:
                  current = matches[0]["id"]
              else:
                  meta = {"name": part, "mimeType": "application/vnd.google-apps.folder", "parents": [current]}
                  made = service.files().create(body=meta, fields="id", supportsAllDrives=True).execute()
                  current = made["id"]

          media = MediaFileUpload(str(local_parquet), mimetype="application/octet-stream", resumable=True)
          existing = [x for x in children(current) if x["name"] == OUTPUT_NAME]
          if existing:
              service.files().update(fileId=existing[0]["id"], media_body=media, fields="id", supportsAllDrives=True).execute()
              print("CONTEXT_UPLOAD=updated")
          else:
              meta = {"name": OUTPUT_NAME, "parents": [current]}
              service.files().create(body=meta, media_body=media, fields="id", supportsAllDrives=True).execute()
              print("CONTEXT_UPLOAD=created")
          print("CONTEXT_PARENT_FOLDER_ID=" + current)
          print("CONTEXT_SOURCE_SHA256=" + _sha256(local_csv))
          print("CONTEXT_OUTPUT_SHA256=" + _sha256(local_parquet))
          print("NIFTY_CONTEXT_IMPORT=PASS")
          PY
