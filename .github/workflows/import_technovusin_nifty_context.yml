name: Extend NIFTY 5m context from technovusin 1-min (Drive)

on:
  workflow_dispatch:
    inputs:
      through_month:
        description: "Last 2026 month folder to include (1-12)"
        required: false
        default: "11"

permissions:
  contents: read

jobs:
  extend-nifty-context:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      THROUGH_MONTH: ${{ github.event.inputs.through_month || '11' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pandas pyarrow google-api-python-client google-auth google-auth-oauthlib
      - name: Build merged NIFTY 5m context and upload to Drive
        shell: bash
        run: |
          python - <<'PY'
          import io, json, os, urllib.request
          from pathlib import Path
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload, MediaFileUpload

          RAW = "https://raw.githubusercontent.com/technovusin/nifty50-historical-data/main/1min"
          work = Path("/tmp/technovusin")
          work.mkdir(parents=True, exist_ok=True)
          through = int(os.environ["THROUGH_MONTH"])

          files = [
              f"2024/NIFTY50_1min_2024.csv",
              f"2025/NIFTY50_1min_2025.csv",
          ] + [f"2026/NIFTY50_1min_2026-{m:02d}.csv" for m in range(1, through + 1)]

          local_inputs = []
          for rel in files:
              dest = work / Path(rel).name
              with urllib.request.urlopen(f"{RAW}/{rel}", timeout=120) as r, dest.open("wb") as fh:
                  fh.write(r.read())
              local_inputs.append(str(dest))
              print(f"DOWNLOADED {rel} bytes={dest.stat().st_size}")

          info = json.loads(os.environ["GOOGLE_OAUTH_TOKEN_JSON"])
          root_id = os.environ["GOOGLE_DRIVE_ROOT_ID"]
          creds = Credentials.from_authorized_user_info(info, scopes=["https://www.googleapis.com/auth/drive"])
          if not creds.valid:
              creds.refresh(Request())
          service = build("drive", "v3", credentials=creds, cache_discovery=False)

          def children(fid):
              out, page = [], None
              while True:
                  r = service.files().list(
                      q=f"'{fid}' in parents and trashed = false",
                      pageSize=1000, pageToken=page,
                      fields="nextPageToken,files(id,name,mimeType)",
                      supportsAllDrives=True, includeItemsFromAllDrives=True,
                  ).execute()
                  out.extend(r.get("files", []))
                  page = r.get("nextPageToken")
                  if not page:
                      return out

          current = root_id
          for part in ("production_data/nse_official/intraday_seed/olo_5m_archive/symbols/symbol=__NIFTY50__").split("/"):
              matches = [x for x in children(current) if x["name"] == part and x["mimeType"] == "application/vnd.google-apps.folder"]
              if matches:
                  current = matches[0]["id"]
              else:
                  made = service.files().create(
                      body={"name": part, "mimeType": "application/vnd.google-apps.folder", "parents": [current]},
                      fields="id", supportsAllDrives=True).execute()
                  current = made["id"]

          kaggle_parquet = ""
          kaggle_hits = [x for x in children(current) if x["name"] == "nifty50_kaggle_5m_close_only.parquet"]
          if kaggle_hits:
              kaggle_parquet = "/tmp/nifty50_kaggle_5m_close_only.parquet"
              with open(kaggle_parquet, "wb") as fh:
                  dl = MediaIoBaseDownload(fh, service.files().get_media(fileId=kaggle_hits[0]["id"], supportsAllDrives=True))
                  done = False
                  while not done:
                      _, done = dl.next_chunk()
              print("KAGGLE_PARQUET_DOWNLOADED_BYTES=" + str(os.path.getsize(kaggle_parquet)))
          else:
              print("KAGGLE_PARQUET_NOT_FOUND")

          import subprocess
          cmd = [
              "python", "-u", "ingest_technovusin_nifty_5m_context.py",
              "--input", *local_inputs,
              "--output", "/tmp/nifty50_5m_merged_close_only.parquet",
              "--manifest", "/tmp/nifty50_5m_merged_close_only_technovusin_manifest.json",
          ]
          if kaggle_parquet:
              cmd += ["--kaggle-parquet", kaggle_parquet]
          subprocess.run(cmd, check=True)

          def upsert(name, path, mimetype="application/octet-stream"):
              media = MediaFileUpload(path, mimetype=mimetype, resumable=True)
              existing = [x for x in children(current) if x["name"] == name]
              if existing:
                  service.files().update(fileId=existing[0]["id"], media_body=media, fields="id", supportsAllDrives=True).execute()
                  print(f"UPLOAD {name}=updated")
              else:
                  service.files().create(body={"name": name, "parents": [current]}, media_body=media, fields="id", supportsAllDrives=True).execute()
                  print(f"UPLOAD {name}=created")

          upsert("nifty50_5m_merged_close_only.parquet", "/tmp/nifty50_5m_merged_close_only.parquet")
          upsert("nifty50_5m_merged_close_only_technovusin_manifest.json", "/tmp/nifty50_5m_merged_close_only_technovusin_manifest.json", "application/json")
          print("NIFTY_CONTEXT_EXTEND=PASS")
          PY
