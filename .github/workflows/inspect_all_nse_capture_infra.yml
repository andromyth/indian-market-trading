name: Inspect all-NSE capture infrastructure

# Runtime capture diagnosis after refreshed Cloud Run OAuth revision.
# Follow-up read-only inspection after worker revision rollout.
# A push to this workflow requests a fresh read-only capture/scheduler diagnostics run.
# Post-current-deploy diagnostic request: 2026-10-29; verify staged revision, traffic, private invokers, and scheduler state without mutations.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect_all_nse_capture_infra.yml"
      - ".github/workflows/verify_all_nse_minute_capture.yml"
      - ".github/workflows/configure_intraday_five_minute_schedule.yml"
      - "autonomous_intraday_worker_service.py"
      - "autonomous_intraday_worker.py"
      - "indstocks_client.py"
      - "all_universe_minute_capture.py"
      - "all_nse_minute_prediction_capture.py"
      - "audit_all_universe_minute_snapshots.py"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROJECT_ID: indian-market-trading
      REGION: asia-south1
      SERVICE: indian-market-intraday-worker
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          project_id: indian-market-trading
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: indian-market-trading
      - name: Test the exact Cloud Run OAuth Secret Manager version without printing token data
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check google-auth
          gcloud secrets versions access latest \
            --secret=google-oauth-token-json \
            --project="$PROJECT_ID" \
            --out-file=/tmp/cloud-run-oauth-token.json
          python - <<'PY'
          import json
          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials

          path = "/tmp/cloud-run-oauth-token.json"
          with open(path, encoding="utf-8") as fh:
              token_info = json.load(fh)
          print("RUNTIME_SECRET_METADATA:", json.dumps({
              "has_refresh_token": bool(token_info.get("refresh_token")),
              "has_client_id": bool(token_info.get("client_id")),
              "has_client_secret": bool(token_info.get("client_secret")),
              "scopes_include_drive": "https://www.googleapis.com/auth/drive" in (token_info.get("scopes") or []),
          }, sort_keys=True))
          try:
              credentials = Credentials.from_authorized_user_info(
                  token_info,
                  scopes=["https://www.googleapis.com/auth/drive"],
              )
              credentials.refresh(Request())
          except Exception as exc:
              print("RUNTIME_SECRET_REFRESH=FAIL")
              print("RUNTIME_SECRET_REFRESH_ERROR:", type(exc).__name__, str(exc)[:300])
              raise SystemExit(1)
          print("RUNTIME_SECRET_REFRESH=PASS")
          PY
          rm -f /tmp/cloud-run-oauth-token.json

      - name: Inspect deployment revision, build and scheduled tick activity
        shell: bash
        run: |
          set -uo pipefail
          echo "=== Cloud Run service ==="
          gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='yaml(metadata.generation,status.latestCreatedRevisionName,status.latestReadyRevisionName,status.traffic,status.conditions)' || true
          echo "=== Cloud Run invoker policy: verify service remains private (read-only) ==="
          if gcloud run services get-iam-policy "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format=json > /tmp/service_iam_policy.json 2>/tmp/service_iam_policy.err; then
            python - /tmp/service_iam_policy.json <<'PY'
          import json,sys
          policy=json.load(open(sys.argv[1],encoding="utf-8"))
          public=[]
          invokers=[]
          for binding in policy.get("bindings",[]):
              if binding.get("role") == "roles/run.invoker":
                  for member in binding.get("members",[]):
                      if member in ("allUsers","allAuthenticatedUsers"):
                          public.append(member)
                      elif member.startswith("serviceAccount:"):
                          invokers.append(member)
          print("SERVICE_PUBLIC_INVOKER_BINDINGS="+json.dumps(sorted(set(public))))
          print("SERVICE_PRIVATE_VERDICT="+("FAIL_PUBLIC_INVOKER_BINDING" if public else "PASS_NO_PUBLIC_INVOKER_BINDING"))
          print("SERVICE_ACCOUNT_INVOKER_COUNT="+str(len(set(invokers))))
          PY
          else
            echo "SERVICE_PRIVATE_VERDICT=UNVERIFIABLE_IAM_POLICY_READ_DENIED"
            sed -n '1,3p' /tmp/service_iam_policy.err || true
          fi
          echo "=== Recent Cloud Run revisions ==="
          gcloud run revisions list --service="$SERVICE" --project="$PROJECT_ID" --region="$REGION" --limit=8 --sort-by='~metadata.creationTimestamp' --format='table(metadata.name,metadata.creationTimestamp,status.conditions[0].status,status.conditions[0].reason)' || true
          echo "=== Newly created Cloud Run revision readiness diagnostics ==="
          CREATED_REVISION="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.latestCreatedRevisionName)' 2>/dev/null || true)"
          READY_REVISION="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.latestReadyRevisionName)' 2>/dev/null || true)"
          echo "LATEST_CREATED_REVISION=$CREATED_REVISION"
          echo "LATEST_READY_REVISION=$READY_REVISION"
          if [[ -n "$CREATED_REVISION" ]]; then
            gcloud run revisions describe "$CREATED_REVISION" --project="$PROJECT_ID" --region="$REGION" --format='yaml(metadata.name,status.conditions,status.logUrl,spec.serviceAccountName)' || true
            echo "=== Logs for latest created revision ==="
            gcloud logging read "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"$SERVICE\" AND resource.labels.revision_name=\"$CREATED_REVISION\"" --project="$PROJECT_ID" --limit=80 --order=desc --format='table(timestamp,severity,textPayload,jsonPayload.message,jsonPayload.error)' || true
          fi
          echo "=== Safe runtime configuration: variable names and Secret Manager references only ==="
          if [[ -n "$READY_REVISION" ]] && gcloud run revisions describe "$READY_REVISION" --project="$PROJECT_ID" --region="$REGION" --format=json > /tmp/ready_revision.json 2>/dev/null; then
            python - /tmp/ready_revision.json <<'PY'
          import json, sys
          payload=json.load(open(sys.argv[1],encoding="utf-8"))
          containers=(payload.get("spec") or {}).get("containers") or []
          for index, container in enumerate(containers):
              for item in container.get("env") or []:
                  name=item.get("name")
                  source=item.get("valueSource") or {}
                  secret=(source.get("secretKeyRef") or {})
                  if not secret:
                      secret=((item.get("valueFrom") or {}).get("secretKeyRef") or {})
                  if secret:
                      entry={
                          "container_index":index,
                          "env_name":name,
                          "source_type":"secretKeyRef",
                          "secret_name":secret.get("secret") or secret.get("name"),
                          "secret_version":secret.get("version") or secret.get("key") or "latest"
                      }
                  elif "value" in item and item.get("value") not in (None, ""):
                      entry={"container_index":index,"env_name":name,"source_type":"literal_value","literal_value":"REDACTED"}
                  else:
                      entry={"container_index":index,"env_name":name,"source_type":"unset_or_unknown","literal_value":"REDACTED"}
                  print("SAFE_RUNTIME_ENV_REFERENCE="+json.dumps(entry,sort_keys=True))
          PY
          else
            echo "SAFE_RUNTIME_ENV_REFERENCE_STATUS=UNAVAILABLE"
          fi
          echo "=== Safe INDstocks Secret Manager presence check (names/status only; values never read to output) ==="
          for secret_name in indstocks-client-id indstocks-mpin indstocks-totp-secret indstocks-access-token; do
            if gcloud secrets describe "$secret_name" --project="$PROJECT_ID" >/dev/null 2>&1; then
              if gcloud secrets versions access latest --secret="$secret_name" --project="$PROJECT_ID" >/dev/null 2>&1; then
                echo "INDSTOCKS_SECRET=$secret_name STATUS=LATEST_VERSION_READABLE"
              else
                echo "INDSTOCKS_SECRET=$secret_name STATUS=NO_READABLE_LATEST_VERSION"
              fi
            else
              echo "INDSTOCKS_SECRET=$secret_name STATUS=MISSING_OR_UNREADABLE"
            fi
          done
          echo "=== Recent Cloud Builds ==="
          gcloud builds list --project="$PROJECT_ID" --limit=8 --sort-by='~createTime' --format='table(id,status,createTime,finishTime,logUrl)' || true
          echo "=== Cloud Run HTTP request metrics for last 20 minutes ==="
          END_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          START_TIME="$(date -u -d '20 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          echo "METRICS_WINDOW_START=$START_TIME"
          echo "METRICS_WINDOW_END=$END_TIME"
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          set +e
          METRICS_CODE="$(curl --silent --show-error --connect-timeout 10 --max-time 30 -G \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            --data-urlencode 'filter=metric.type="run.googleapis.com/request_count" AND resource.type="cloud_run_revision" AND resource.labels.service_name="indian-market-intraday-worker"' \
            --data-urlencode "interval.startTime=$START_TIME" \
            --data-urlencode "interval.endTime=$END_TIME" \
            --data-urlencode "view=FULL" \
            --output /tmp/run_request_metrics.json --write-out "%{http_code}" \
            "https://monitoring.googleapis.com/v3/projects/$PROJECT_ID/timeSeries")"
          METRICS_RC=$?
          set -e
          echo "METRICS_HTTP_STATUS=$METRICS_CODE"
          if [[ "$METRICS_RC" -eq 0 && "$METRICS_CODE" == "200" ]]; then
            python - /tmp/run_request_metrics.json <<'PY'
          import json,sys
          try:
              response=json.load(open(sys.argv[1],encoding="utf-8"))
          except Exception as exc:
              print(f"METRICS_PARSE_ERROR={exc}")
              sys.exit(0)
          items=response.get("timeSeries",[])
          print(f"REQUEST_METRIC_SERIES_COUNT={len(items)}")
          if response.get("nextPageToken"):
              print("REQUEST_METRICS_PAGE_TRUNCATED=true")
          for item in items:
              metric=item.get("metric",{})
              resource=item.get("resource",{})
              labels=metric.get("labels",{})
              rlabels=resource.get("labels",{})
              values=item.get("points",[])
              for point in values[:8]:
                  value=point.get("value",{})
                  num=value.get("int64Value",value.get("doubleValue",value.get("distributionValue")))
                  interval=point.get("interval",{})
                  print("REQUEST_METRIC="+json.dumps({
                      "revision":rlabels.get("revision_name"),
                      "response_code":labels.get("response_code"),
                      "response_code_class":labels.get("response_code_class"),
                      "method":labels.get("method"),
                      "value":num,
                      "end":interval.get("endTime")
                  },sort_keys=True))
          PY
          else
            echo "REQUEST_METRICS_UNAVAILABLE=true"
            head -c 1200 /tmp/run_request_metrics.json 2>/dev/null || true
            echo
          fi
          echo "=== Parsed active minute-job status ==="
          if gcloud scheduler jobs describe intraday-worker-1000-1459 --project="$PROJECT_ID" --location="$REGION" --format=json > /tmp/active_scheduler_job.json; then
            python - /tmp/active_scheduler_job.json <<'PY'
          import json,sys
          job=json.load(open(sys.argv[1],encoding="utf-8"))
          status=job.get("status") or {}
          print("ACTIVE_JOB_STATE="+str(job.get("state")))
          print("ACTIVE_JOB_SCHEDULE="+str(job.get("schedule")))
          print("ACTIVE_JOB_LAST_ATTEMPT_UTC="+str(job.get("lastAttemptTime")))
          print("ACTIVE_JOB_NEXT_SCHEDULE_UTC="+str(job.get("scheduleTime")))
          print("ACTIVE_JOB_ATTEMPT_DEADLINE="+str(job.get("attemptDeadline")))
          print("ACTIVE_JOB_STATUS_CODE="+str(status.get("code","OK_OR_OMITTED")))
          print("ACTIVE_JOB_STATUS_MESSAGE="+str(status.get("message",""))[:300])
          PY
          fi
          echo "=== Scheduler state and last attempt ==="
          for job in intraday-worker-0915-0959 intraday-worker-1000-1459 intraday-worker-1500-1530 intraday-worker-finalize-1532; do
            echo "--- $job ---"
            gcloud scheduler jobs describe "$job" --project="$PROJECT_ID" --location="$REGION" --format='yaml(state,schedule,timeZone,lastAttemptTime,scheduleTime,status,attemptDeadline,retryConfig,httpTarget.uri,httpTarget.httpMethod,httpTarget.oidcToken.serviceAccountEmail)' || true
          done
          echo "=== Recent Cloud Run worker tick/capture logs (last 6 hours) ==="
          LOG_START="$(date -u -d '6 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          echo "WORKER_LOG_WINDOW_START=$LOG_START"
          gcloud logging read \
            "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"$SERVICE\" AND timestamp >= \"$LOG_START\"" \
            --project="$PROJECT_ID" \
            --limit=120 \
            --order=desc \
            --format='table(timestamp,severity,jsonPayload.event,jsonPayload.status,jsonPayload.error,jsonPayload.reason,jsonPayload.capture_status,jsonPayload.all_universe_capture.status,jsonPayload.all_universe_capture.expected_symbol_count,jsonPayload.all_universe_capture.quoted_symbol_count,jsonPayload.all_universe_capture.missing_quote_count,jsonPayload.all_nse_minute_predictions.status,jsonPayload.all_nse_minute_predictions.prediction_count,jsonPayload.all_nse_minute_predictions.error,textPayload)' || true

