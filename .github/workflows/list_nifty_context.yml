name: List NIFTY 5m context folder (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-nifty-context:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-oauthlib
      - name: List the NIFTY 5m context folder
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          token = os.environ["GOOGLE_OAUTH_TOKEN_JSON"]
          root_id = os.environ["GOOGLE_DRIVE_ROOT_ID"]
          creds = Credentials.from_authorized_user_info(json.loads(token), scopes=["https://www.googleapis.com/auth/drive"])
          if not creds.valid:
              creds.refresh(Request())
          service = build("drive", "v3", credentials=creds, cache_discovery=False)

          def children(parent_id):
              out, page = [], None
              while True:
                  res = service.files().list(
                      q=f"'{parent_id}' in parents and trashed = false",
                      pageSize=1000, pageToken=page,
                      fields="nextPageToken,files(id,name,mimeType,size,modifiedTime)",
                      supportsAllDrives=True, includeItemsFromAllDrives=True,
                  ).execute()
                  out.extend(res.get("files", []))
                  page = res.get("nextPageToken")
                  if not page:
                      return out

          path = [
              "production_data", "nse_official", "intraday_seed",
              "olo_5m_archive", "symbols", "symbol=__NIFTY50__",
          ]
          current = root_id
          for part in path:
              matches = [x for x in children(current) if x["name"] == part and x["mimeType"] == "application/vnd.google-apps.folder"]
              if not matches:
                  print("NIFTY_CONTEXT_MISSING_FOLDER=" + part)
                  raise SystemExit(0)
              current = matches[0]["id"]
          rows = [
              {"name": x.get("name"), "type": x.get("mimeType"),
               "size_bytes": int(x.get("size") or 0), "modifiedTime": x.get("modifiedTime")}
              for x in sorted(children(current), key=lambda x: x.get("modifiedTime", ""), reverse=True)
          ]
          print("NIFTY_CONTEXT_FILES=" + json.dumps(rows, sort_keys=True))
          print("NIFTY_CONTEXT_FILE_COUNT=" + str(len(rows)))
          PY
