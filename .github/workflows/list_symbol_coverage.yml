name: List F&O / archive symbol coverage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-symbols:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pandas pyarrow google-api-python-client google-auth google-auth-oauthlib
      - name: List symbol coverage
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload
          import pandas as pd

          creds = Credentials.from_authorized_user_info(json.loads(os.environ["GOOGLE_OAUTH_TOKEN_JSON"]), scopes=["https://www.googleapis.com/auth/drive"])
          if not creds.valid:
              creds.refresh(Request())
          svc = build("drive", "v3", credentials=creds, cache_discovery=False)

          def children(fid):
              out, page = [], None
              while True:
                  r = svc.files().list(q=f"'{fid}' in parents and trashed = false", pageSize=1000, pageToken=page, fields="nextPageToken,files(id,name,mimeType,size)", supportsAllDrives=True, includeItemsFromAllDrives=True).execute()
                  out.extend(r.get("files", []))
                  page = r.get("nextPageToken")
                  if not page:
                      return out

          def find_folder(part):
              cur = os.environ["GOOGLE_DRIVE_ROOT_ID"]
              for seg in part.strip("/").split("/"):
                  if not seg:
                      continue
                  hits = [x for x in children(cur) if x["name"] == seg and x["mimeType"] == "application/vnd.google-apps.folder"]
                  if not hits:
                      return None
                  cur = hits[0]["id"]
              return cur

          archive = find_folder("production_data/nse_official/intraday_seed/olo_5m_archive/symbols")
          archive_symbols = []
          if archive:
              for x in children(archive):
                  if x["name"].startswith("symbol=") and not str(x["name"]).startswith("symbol=__NIFTY"):
                      archive_symbols.append(str(x["name"]).split("=", 1)[1].upper())
          archive_symbols = sorted(set(archive_symbols))

          fno_folder = find_folder("production_data/nse_official/fno")
          fno_symbols = []
          fno_parquet_name = None
          PREFS = ["fno_daily_features_2024_2026.parquet", "fno_daily_features_2025_2026.parquet", "fno_daily_features_2024_2025.parquet", "fno_daily_features_2026.parquet", "fno_daily_features_history_2022_2024.parquet"]
          if fno_folder:
              for x in children(fno_folder):
                  if x["name"] in PREFS and x["mimeType"] == "application/vnd.google-apps.file":
                      fno_parquet_name = x["name"]
                      p = Path("/tmp") / ("cov_" + x["name"])
                      with p.open("wb") as fh:
                          dl = MediaIoBaseDownload(fh, svc.files().get_media(fileId=x["id"], supportsAllDrives=True))
                          done = False
                          while not done:
                              _, done = dl.next_chunk()
                      fno_frame = pd.read_parquet(p)
                      sym_col = next((c for c in fno_frame.columns if str(c).strip().lower() in ("symbol","ticker","underlying")), None)
                      if sym_col is not None:
                          fno_symbols = sorted({str(s).upper() for s in (fno_frame[sym_col].dropna().astype(str)) if s and "__NIFTY" not in s})
          covered = sorted(set(fno_symbols) & set(archive_symbols))
          missing = sorted(set(fno_symbols) - set(archive_symbols))
          print("COVERAGE_ANALYSIS=" + json.dumps({
              "fno_parquet_name": fno_parquet_name,
              "fno_symbol_count": len(fno_symbols),
              "archive_symbol_count": len(archive_symbols),
              "covered_count": len(covered),
              "missing_count": len(missing),
              "covered_sample": covered[:200],
              "missing": missing,
              "archive_folder_found": archive is not None,
          }, default=str))
          print("LISTING_DONE")
          PY
