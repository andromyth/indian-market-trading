name: Live intraday persistence status audit
# Audits Drive persistence daily after the NSE cash session and on demand.

on:
  workflow_dispatch:
  # 16:15 Asia/Kolkata (UTC is 5:30 behind) each weekday.
  # The script skips requiring current-day snapshots on NSE holidays and audits
  # the last completed NSE session's full-universe minute capture separately.
  schedule:
    - cron: '45 10 * * 1-5'
  push:
    branches:
      - main
    paths:
      - ".github/workflows/live_intraday_status_audit.yml"

permissions:
  contents: read

concurrency:
  group: live-intraday-status-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
      MINUTE_PERSISTENCE_AUDIT_LOOKBACK_DAYS: "7"

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Audit minute predictions, actuals and worker state in Google Drive
        shell: bash
        run: |
          set -euo pipefail
          python -u verify_minute_prediction_persistence.py | tee /tmp/minute-persistence-audit.log
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path("/tmp/minute-persistence-audit.log").read_text(encoding="utf-8")
          begin, end = "MINUTE_PERSISTENCE_AUDIT_JSON_BEGIN", "MINUTE_PERSISTENCE_AUDIT_JSON_END"
          if begin not in output or end not in output:
              raise SystemExit("Persistence audit report markers are missing.")
          report = json.loads(output.split(begin, 1)[1].split(end, 1)[0].strip())
          today = report["current_day"]
          summary = {
              "checked_at_ist": report.get("checked_at_ist"),
              "current_day": today,
              "worker_status": report.get("worker_status_latest"),
              "watchlist_snapshots_today": report.get("watchlist_minute_snapshots_by_day", {}).get(today),
              "prediction_ledger_today": report.get("prediction_ledger_by_day", {}).get(today),
              "one_minute_bar_partitions_today": report.get("watchlist_one_minute_bars_by_day", {}).get(today),
              "full_universe_capture_today": report.get("full_universe_minute_capture_by_day", {}).get(today),
              "latest_global_manifest": report.get("full_universe_latest_manifest"),
              "outcome_audit_today": report.get("outcome_audits_by_day", {}).get(today),
              "verdict": report.get("verdict"),
          }
          rendered = json.dumps(summary, sort_keys=True, default=str)
          print("LIVE_INTRADAY_STATUS_SUMMARY:", rendered)

          # Gate the most recent NSE trading day covered by the lookback.
          # The 09:15 opening tick is exempt from forecast/actual completeness,
          # because no completed 09:15 one-minute candle exists at tick start.
          from datetime import date
          from market_session_guard import is_nse_trading_day
          candidates = sorted(
              (day for day in report.get("watchlist_minute_snapshots_by_day", {}) if is_nse_trading_day(date.fromisoformat(day))),
              reverse=True,
          )
          gate = {"applicable": bool(candidates), "session_date": None, "pass": True, "failures": []}
          if candidates:
              session = candidates[0]
              gate["session_date"] = session
              watch = report["watchlist_minute_snapshots_by_day"].get(session) or {}
              ledger = report["prediction_ledger_by_day"].get(session) or {}
              if watch.get("expected_snapshot_minutes", 0) > 0:
                  if not watch.get("all_expected_snapshot_files_present"):
                      gate["failures"].append("missing or duplicate expected minute snapshot files")
                  if watch.get("expected_prediction_actual_minutes", 0) > 0 and not watch.get("all_required_minutes_have_predictions_and_actuals"):
                      gate["failures"].append("one or more expected minutes lack a valid prediction plus timestamped actual price for every watchlist symbol")
                  if not ledger.get("exists") or int(ledger.get("prediction_rows") or 0) == 0:
                      gate["failures"].append("prediction ledger missing or empty")
              gate["pass"] = not gate["failures"]
          print("WATCHLIST_MINUTE_AUDIT_GATE:", json.dumps(gate, sort_keys=True))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("WATCHLIST_MINUTE_AUDIT_OK=" + ("true" if gate["pass"] else "false") + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("## Live intraday persistence audit\n\n")
              fh.write(json.dumps({"summary": summary, "watchlist_minute_gate": gate}, indent=2, sort_keys=True, default=str) + "\n")          PY

      - name: Audit latest completed NSE session's full-universe minute snapshots
        shell: bash
        run: |
          set -euo pipefail
          AUDIT_DATE="$(python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from market_session_guard import is_nse_trading_day

          day = datetime.now(ZoneInfo("Asia/Kolkata")).date()
          while not is_nse_trading_day(day):
              day -= timedelta(days=1)
          print(day.isoformat())
          PY
          )"
          TODAY_IST="$(TZ=Asia/Kolkata date +%F)"
          echo "TODAY_IST=$TODAY_IST"
          echo "LATEST_COMPLETED_NSE_SESSION_IST=$AUDIT_DATE"

          # Google Drive occasionally returns transient 5xx errors during large
          # resumable uploads. Retry the idempotent audit (same remote filenames)
          # before calling the audit itself failed.
          attempt=1
          while true; do
            if python -u audit_all_universe_minute_snapshots.py --date "$AUDIT_DATE" --sync-drive > /tmp/all-universe-minute-audit.log 2>&1; then
              cat /tmp/all-universe-minute-audit.log
              break
            else
              rc=$?
              cat /tmp/all-universe-minute-audit.log
              if [[ "$attempt" -ge 3 ]]; then
                echo "ERROR: full-universe audit failed after $attempt attempts (exit=$rc)." >&2
                exit "$rc"
              fi
              echo "Audit/upload attempt $attempt failed; retrying after transient-error backoff." >&2
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            fi
          done

          python - <<'PY'
          import json
          import os
          import os
          from pathlib import Path

          output = Path("/tmp/all-universe-minute-audit.log").read_text(encoding="utf-8")
          report = json.loads(output)
          keys = (
              "session_date", "nse_trading_day", "expected_minutes",
              "snapshot_files_present", "missing_snapshot_minutes",
              "minute_manifests_present", "missing_manifest_minutes",
              "capture_status_counts", "total_expected_symbol_minutes",
              "total_quoted_symbol_minutes", "total_missing_quote_rows",
              "observed_quote_coverage_pct", "matched_outcomes",
              "quality_gate_pass", "audit_status",
              "drive_json_write", "drive_csv_write",
          )
          summary = {k: report.get(k) for k in keys}
          rendered = json.dumps(summary, sort_keys=True, default=str)
          print("FULL_UNIVERSE_MINUTE_AUDIT_SUMMARY:", rendered)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("## Full-universe minute capture audit\n\n")
              fh.write("```json\n" + json.dumps(summary, indent=2, sort_keys=True, default=str) + "\n```\n")
          # Make an incomplete capture visible as a failed scheduled audit.
          # The audit files are synced to Drive before this gate is evaluated.
          failures = []
          if os.getenv("WATCHLIST_MINUTE_AUDIT_OK", "true").lower() != "true":
              failures.append("WATCHLIST_MINUTE_CAPTURE_FAILED: per-minute prediction/actual snapshots are missing or incomplete.")
          if report.get("nse_trading_day") and not report.get("quality_gate_pass"):
              failures.append("FULL_UNIVERSE_MINUTE_CAPTURE_FAILED: full-universe snapshot/manifest coverage or quote data-quality gate is incomplete.")
          if failures:
              raise SystemExit(" | ".join(failures))
          PY
