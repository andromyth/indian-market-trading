name: Live intraday persistence status audit
# Audits Drive persistence daily after the NSE cash session, after relevant
# persistence-code changes, and on demand. Scheduler cadence is intentionally unchanged..

on:
  workflow_dispatch:
  # 16:15 Asia/Kolkata (UTC is 5:30 behind) each weekday.
  # The script skips requiring current-day snapshots on NSE holidays and audits
  # the last completed NSE session's full-universe minute capture separately.
  schedule:
    - cron: '45 10 * * 1-5'
  push:
    branches:
      - main
    paths:
      - ".github/workflows/live_intraday_status_audit.yml"
      - ".github/workflows/verify_minute_prediction_persistence.yml"
      - "autonomous_intraday_worker.py"
      - "all_universe_minute_capture.py"
      - "all_nse_minute_prediction_capture.py"
      - "audit_all_universe_minute_snapshots.py"
      - "verify_minute_prediction_persistence.py"
      - "tests/test_all_universe_minute_audit.py"

permissions:
  contents: read

concurrency:
  group: live-intraday-status-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
      MINUTE_PERSISTENCE_AUDIT_LOOKBACK_DAYS: "7"

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Audit minute predictions, actuals and worker state in Google Drive
        shell: bash
        run: |
          set -euo pipefail
          python -u verify_minute_prediction_persistence.py | tee /tmp/minute-persistence-audit.log
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path("/tmp/minute-persistence-audit.log").read_text(encoding="utf-8")
          begin, end = "MINUTE_PERSISTENCE_AUDIT_JSON_BEGIN", "MINUTE_PERSISTENCE_AUDIT_JSON_END"
          if begin not in output or end not in output:
              raise SystemExit("Persistence audit report markers are missing.")
          report = json.loads(output.split(begin, 1)[1].split(end, 1)[0].strip())
          today = report["current_day"]
          summary = {
              "checked_at_ist": report.get("checked_at_ist"),
              "current_day": today,
              "worker_status": report.get("worker_status_latest"),
              "watchlist_snapshots_today": report.get("watchlist_minute_snapshots_by_day", {}).get(today),
              "prediction_ledger_today": report.get("prediction_ledger_by_day", {}).get(today),
              "one_minute_bar_partitions_today": report.get("watchlist_one_minute_bars_by_day", {}).get(today),
              "full_universe_capture_today": report.get("full_universe_minute_capture_by_day", {}).get(today),
              "latest_capture_manifest": report.get("full_universe_latest_manifest"),
              "outcome_audit_today": report.get("outcome_audits_by_day", {}).get(today),
              "diagnostic_note": "Per-symbol persistence and prediction records are evaluated independently; no universe-wide coverage threshold is applied.",
          }
          rendered = json.dumps(summary, sort_keys=True, default=str)
          print("LIVE_INTRADAY_SYMBOL_STATUS_SUMMARY:", rendered)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("## Live intraday persistence and symbol diagnostics\n\n")
              fh.write(json.dumps(summary, indent=2, sort_keys=True, default=str) + "\n")
          PY
      - name: Audit latest completed NSE session's full-universe minute snapshots
        shell: bash
        run: |
          set -euo pipefail
          AUDIT_DATE="$(python - <<'PY'
          from datetime import datetime, time, timedelta
          from zoneinfo import ZoneInfo
          from market_session_guard import is_nse_trading_day

          now = datetime.now(ZoneInfo("Asia/Kolkata"))
          day = now.date()
          # Before today's open, audit the last completed session. During the
          # session, audit only completed five-minute capture slots from today.
          # After close, all 75 scheduled slots are eligible for strict validation.
          if is_nse_trading_day(day) and now.time() < time(9, 15):
              day -= timedelta(days=1)
          while not is_nse_trading_day(day):
              day -= timedelta(days=1)
          print(day.isoformat())
          PY
          )"
          TODAY_IST="$(TZ=Asia/Kolkata date +%F)"
          echo "TODAY_IST=$TODAY_IST"
          echo "LATEST_COMPLETED_NSE_SESSION_IST=$AUDIT_DATE"

          # Google Drive occasionally returns transient 5xx errors during large
          # resumable uploads. Retry the idempotent audit (same remote filenames)
          # before calling the audit itself failed.
          attempt=1
          while true; do
            if python -u audit_all_universe_minute_snapshots.py --date "$AUDIT_DATE" --sync-drive > /tmp/all-universe-minute-audit.log 2>&1; then
              cat /tmp/all-universe-minute-audit.log
              break
            else
              rc=$?
              cat /tmp/all-universe-minute-audit.log
              if [[ "$attempt" -ge 3 ]]; then
                echo "ERROR: full-universe audit failed after $attempt attempts (exit=$rc)." >&2
                exit "$rc"
              fi
              echo "Audit/upload attempt $attempt failed; retrying after transient-error backoff." >&2
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            fi
          done

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path("/tmp/all-universe-minute-audit.log").read_text(encoding="utf-8")
          report = json.loads(output)
          keys = (
              "session_date", "nse_trading_day", "capture_interval_minutes",
              "expected_minutes", "snapshot_files_present", "missing_snapshot_minutes",
              "minute_manifests_present", "missing_manifest_minutes",
              "capture_status_counts", "corrupt_snapshot_minutes",
              "corrupt_manifest_minutes", "slots_with_incomplete_symbols",
              "total_expected_symbol_minutes", "total_quoted_symbol_minutes",
              "total_missing_quote_rows", "observed_quote_coverage_pct",
              "total_complete_symbol_rows", "average_complete_symbol_coverage_pct",
              "minimum_complete_symbol_coverage_pct", "matched_outcomes",
              "prediction_expected_slots", "prediction_files_present",
              "missing_prediction_minutes", "prediction_manifests_present",
              "missing_prediction_manifest_minutes", "prediction_row_count_errors",
              "prediction_snapshot_link_diagnostics", "prediction_model_diagnostics",
              "prediction_status_counts", "prediction_slot_status_counts",
              "total_declared_prediction_rows", "total_model_prediction_count",
              "audit_status", "drive_json_write", "drive_csv_write",
          )
          summary = {k: report.get(k) for k in keys}
          rendered = json.dumps(summary, sort_keys=True, default=str)
          print("FULL_UNIVERSE_MINUTE_AUDIT_SUMMARY:", rendered)

          # Print per-symbol quote failures from the newest persisted snapshot.
          # This is diagnostic-only: it does not alter capture or learning gates.
          try:
              import io
              import pandas as pd
              from audit_all_universe_minute_snapshots import _find_folder, _list_children, _download_json
              from persistent_store import GoogleDriveStore

              session = str(report.get("session_date") or "")
              store = GoogleDriveStore()
              folder_id = _find_folder(store, [
                  "production_data", "all_universe_minute_snapshots",
                  session[:4], session[5:7], session[8:10],
              ])
              files = _list_children(store, folder_id) if folder_id else []
              manifest_files = sorted(
                  (item for item in files if str(item.get("name", "")).startswith("manifest_")
                   and str(item.get("name", "")).endswith(".json")),
                  key=lambda item: str(item.get("name", "")),
              )
              if not manifest_files:
                  raise RuntimeError("No per-minute manifests found for the audited session")
              latest_manifest_file = manifest_files[-1]
              latest_manifest = _download_json(store, latest_manifest_file["id"])
              snapshot_path = str(
                  latest_manifest.get("snapshot_drive_path")
                  or latest_manifest.get("remote_snapshot_path")
                  or ""
              )
              snapshot_name = snapshot_path.rsplit("/", 1)[-1]
              snapshot_file = next(
                  (item for item in files if item.get("name") == snapshot_name), None
              )
              if not snapshot_file:
                  raise RuntimeError(f"Snapshot file not found in Drive folder: {snapshot_name}")
              raw_parquet = store.service.files().get_media(
                  fileId=snapshot_file["id"]
              ).execute()
              snapshot_frame = pd.read_parquet(io.BytesIO(raw_parquet))
              for column in ("symbol", "instrument_code", "quote_status", "quote_error", "actual_observed_price"):
                  if column not in snapshot_frame.columns:
                      snapshot_frame[column] = None
              failed = snapshot_frame.loc[
                  snapshot_frame["quote_status"].astype(str).str.upper().ne("PASS"),
                  ["symbol", "instrument_code", "quote_status", "quote_error", "actual_observed_price"],
              ].copy()
              diagnostic = {
                  "cycle_minute_ist": latest_manifest.get("cycle_minute_ist"),
                  "manifest_status": latest_manifest.get("status"),
                  "expected_symbol_count": latest_manifest.get("expected_symbol_count"),
                  "quoted_symbol_count": latest_manifest.get("quoted_symbol_count"),
                  "missing_quote_count": latest_manifest.get("missing_quote_count"),
                  "unmapped_symbol_count": latest_manifest.get("unmapped_symbol_count"),
                  "quote_status_counts": {
                      str(k): int(v) for k, v in
                      snapshot_frame["quote_status"].fillna("NULL").astype(str).value_counts().items()
                  },
                  "failed_symbol_rows": failed.sort_values("symbol").to_dict(orient="records"),
              }
              print("LATEST_CAPTURE_SYMBOL_DIAGNOSTIC:", json.dumps(diagnostic, sort_keys=True, default=str))
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
                  fh.write("\nLatest full-universe quote exceptions\n\n")
                  fh.write(json.dumps(diagnostic, indent=2, sort_keys=True, default=str) + "\n")
          except Exception as diagnostic_exc:
              # A diagnostic failure must not hide the original audit outcome.
              print("LATEST_CAPTURE_SYMBOL_DIAGNOSTIC_ERROR:", f"{type(diagnostic_exc).__name__}: {diagnostic_exc}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("## Full-universe minute capture audit\n\n")
              fh.write("```json\n" + json.dumps(summary, indent=2, sort_keys=True, default=str) + "\n```\n")
          # Incomplete symbols and partial slots are recorded as diagnostics,
          # not promoted to a universe-wide acceptance or rejection decision.
          print("SYMBOL_LEVEL_DIAGNOSTICS_RECORDED=true")

          operational_failures = []
          if report.get("audit_status") == "PERSISTENCE_ERROR":
              operational_failures.append("Audit report persistence failed.")
          for key in ("drive_json_write", "drive_csv_write"):
              result = report.get(key) or {}
              if result.get("status") != "OK":
                  operational_failures.append(f"{key} was not confirmed OK.")
          if operational_failures:
              raise SystemExit(" | ".join(operational_failures))
          print("AUDIT_EXECUTION=COMPLETED_REPORT_PERSISTED_SYMBOL_LEVEL_DIAGNOSTICS")
          PY
