name: Apply live PIT cache fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Delivery PIT cache invalidation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('all_nse_delivery_model.py')
          s = p.read_text(encoding='utf-8')
          marker = '    root = _normalize_symbol(\n        symbol\n    )\n'
          insert = marker + '\n    # A new PIT snapshot can be uploaded to Drive during the same IST date.\n    # Do not let the process-local lru_cache keep yesterday\'s snapshot for\n    # the remainder of the Streamlit process lifetime.\n    try:\n        _latest_drive_pit_features.cache_clear()\n    except Exception:\n        pass\n'
          if 'Do not let the process-local lru_cache keep yesterday' in s:
              print('cache fix already present')
              raise SystemExit(0)
          if marker not in s:
              raise SystemExit('predict_symbol insertion marker not found')
          p.write_text(s.replace(marker, insert, 1), encoding='utf-8')
          PY
      - name: Commit cache fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add all_nse_delivery_model.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Fix same-day Delivery PIT snapshot cache invalidation'
          git push
