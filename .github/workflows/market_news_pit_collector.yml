name: Market news PIT collector

on:
  workflow_dispatch:
  # GitHub cron is UTC. These entries cover 07:30-15:30 IST at 15-minute intervals.
  # The module independently checks weekends, the NSE holiday calendar and its collection window.
  schedule:
    - cron: "*/15 2-9 * * 1-5"
    - cron: "0 10 * * 1-5"

permissions:
  contents: read

concurrency:
  group: market-news-pit-collector
  cancel-in-progress: false

jobs:
  collect-and-persist-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile news collector
        run: python -m py_compile market_news_pit_collector.py

      - name: Collect current RSS headlines and persist PIT outputs
        run: |
          set -euo pipefail
          python -u market_news_pit_collector.py \
            --drive-root /tmp/Indian_Market_Research \
            --market-window
