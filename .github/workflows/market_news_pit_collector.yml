name: Market news PIT collector

on:
  workflow_dispatch:
  # GitHub cron is UTC (IST = UTC+05:30). Poll headlines from 07:30 through 22:00 IST every day,
  # including weekends/NSE holidays because non-trading-day news can affect the next session.
  schedule:
    - cron: "*/15 2-15 * * *"
    - cron: "0,15,30 16 * * *"

permissions:
  contents: read

concurrency:
  group: market-news-pit-collector
  cancel-in-progress: false

jobs:
  collect-and-persist-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile news collector
        run: python -m py_compile market_news_pit_collector.py

      - name: Collect current RSS headlines and persist PIT outputs
        run: |
          set -euo pipefail
          python -u market_news_pit_collector.py \
            --drive-root /tmp/Indian_Market_Research \
            --market-window
