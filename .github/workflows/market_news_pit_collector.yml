name: Market news PIT collector

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/market_news_pit_collector.yml"
      - "market_news_pit_collector.py"
      - "market_watchlist.py"
      - "delivery_training_universe.py"
  workflow_dispatch:
  # GitHub cron uses UTC. Runs 08:50, then every 15 minutes, ending at 14:50 IST.
  # The Python guard skips weekends and NSE holidays.
  schedule:
    - cron: "20,35,50 3 * * 1-5"
    - cron: "5,20,35,50 4-8 * * 1-5"
    - cron: "5,20,30 9 * * 1-5"

permissions:
  contents: read

concurrency:
  group: market-news-pit-collector
  cancel-in-progress: false

jobs:
  collect-and-persist-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile news collector
        run: python -m py_compile market_news_pit_collector.py

      - name: Collect current RSS headlines and persist PIT outputs
        run: |
          set -euo pipefail
          python -u market_news_pit_collector.py \
            --drive-root /tmp/Indian_Market_Research \
            --market-window
