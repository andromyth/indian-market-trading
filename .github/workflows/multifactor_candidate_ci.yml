name: Multi-factor candidate CI

on:
  push:
    branches:
      - main
      - beta_version
      - beta_version2
  pull_request:
    branches:
      - main
      - beta_version

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Set repository import path
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Compile multi-factor Python files
        run: >
          python -m py_compile
          multifactor_data_layer_v2.py
          nse_data_layer.py
          nse_bulk_eod_ingest.py
          nse_eod_archive_audit.py
          data_fetcher.py
          market_watchlist.py
          indstocks_client.py
          indstocks_smoke_test.py
          google_drive_oauth_login.py
          persistent_store.py
          validate_canonical_cash_research_view.py
          colab_build_all_nse_delivery_multifactor_candidate.py
          colab_run_multifactor_upgrade.py
          build_all_nse_pit_fundamentals.py
          validate_multifactor_candidate.py
          final_algorithm_data_readiness_v2.py
          COLAB_RUN_FINAL_ALGORITHM_DATA_READINESS_V2_20261003.py
          all_nse_delivery_model.py
          directional_ensemble.py
          prediction_validation.py
          prediction_ledger.py
          delivery_prediction_csv_ledger.py
          model_health.py
          autonomous_engine.py
          delivery_production_refresh.py
          build_all_nse_news_events_pit.py
          delivery_policy_update.py
          delivery_validation_diagnostics.py
          delivery_all_nse_prediction_cycle.py
          delivery_factor_weightage.py
          refresh_canonical_cash_master_from_bulk_eod.py
          audit_live_prediction_health.py
          backfill_missing_delivery_pit_snapshots.py
          purged_walk_forward.py
          nse_fno_udiff_ingest.py
          nse_fno_applicability_snapshot.py
          repair_identity_preserved_na_series.py
          validate_identity_preserved_cash_master.py
          deployment_smoke_test.py
          app.py
          market_session_guard.py
          COLAB_RUN_FNO_REPAIR_V2_20261003.py
          selfdriving/sd_v2_panel.py
          selfdriving/sd_intraday_v2.py
          selfdriving/sd_v2_runtime.py
          selfdriving/runtime_timeframe_diagnostics.py
          selfdriving/sd_walkforward.py
          selfdriving/sd_cycle.py
          selfdriving/sd_cycle.py
          selfdriving/sd_registry.py
          selfdriving/sd_github_job_v2.py
          strict_delivery_walkforward_audit.py
          live_signal_guards.py
          COLAB_SD_V2_RETRAIN.py
          COLAB_SD_INTRADAY_V2_RETRAIN.py
          COLAB_SD_INTRADAY_RETURN_HEAD_RETRAIN.py
          daily_ohlc_forecast.py
          cross_sectional_daily_ohlc_audit.py
          rolling_daily_ohlc_audit.py
          autonomous_intraday_worker.py
          autonomous_intraday_worker_service.py
          nse_intraday_all_universe_sync.py
          audit_autonomous_intraday_outcomes.py

      - name: Validate Cloud Run deployment script syntax
        run: bash -n deploy_autonomous_intraday_cloud_run.sh

      - name: Build Cloud Run worker container
        run: docker build --tag indian-market-intraday-worker:ci .

      - name: Run multi-factor tests
        run: >
          pytest -q
          tests/test_purged_walk_forward.py
          tests/test_cash_master_incremental_refresh.py
          tests/test_bulk_eod_zip_recovery.py
          tests/test_backfill_missing_delivery_pit_snapshots.py
          tests/test_multifactor_data_layer_v2.py
          tests/test_59_feature_source_coverage.py
          tests/test_candidate_pipeline_stages.py
          tests/test_final_algorithm_data_readiness_v2.py
          tests/test_nse_fno_udiff_ingest.py
          tests/test_production_model_adapter.py
          tests/test_identity_preserved_cash_rebuild.py
          tests/test_canonical_cash_data_layer.py
          tests/test_selfdriving_v2.py
          tests/test_indstocks_client.py
          tests/test_global_cues_datetime_precision.py
          tests/test_beta_v2_join_timestamp_precision.py
          tests/test_sd_v2_runtime_optional_archives.py
          tests/test_runtime_timeframe_diagnostics.py
          tests/test_return_forecast_head.py
          tests/test_daily_ohlc_forecast.py
          tests/test_cross_sectional_daily_ohlc_audit.py
          tests/test_rolling_daily_ohlc_audit.py
          tests/test_autonomous_intraday_worker.py
          tests/test_intraday_bundle_cache.py
          tests/test_nse_eod_archive_presence.py
          tests/test_nse_eod_archive_audit.py
          tests/test_nse_index_daily_snapshot_fallback.py
          tests/test_market_session_guard.py
          tests/test_gdrive_auth_precedence.py
          tests/test_prediction_validation_scorecard.py
          tests/test_prediction_ledger_revisions.py
          tests/test_delivery_validation_active_model.py
          tests/test_delivery_policy_precision_gate.py
          tests/test_delivery_policy_date_block_holdout.py
          tests/test_delivery_policy_active_model_filter.py
          tests/test_intraday_multihorizon_validation.py
          tests/test_market_watchlist.py
          tests/test_live_signal_guards.py
          tests/test_live_accuracy_audit_inputs.py
          tests/test_strict_delivery_walkforward.py
          tests/test_delivery_production_refresh.py
          tests/test_delivery_factor_weightage.py

      - name: Run deployment smoke test
        run: python deployment_smoke_test.py
