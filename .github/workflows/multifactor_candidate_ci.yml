name: Multi-factor candidate CI

on:
  push:
    branches:
      - multifactor-readiness-v2
  pull_request:
    branches:
      - multifactor-readiness-v2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile new Python files
        run: python -m py_compile multifactor_data_layer_v2.py colab_build_all_nse_delivery_multifactor_candidate.py colab_run_multifactor_upgrade.py build_all_nse_pit_fundamentals.py validate_multifactor_candidate.py
      - name: Run multi-factor tests
        run: pytest -q tests/test_multifactor_data_layer_v2.py
