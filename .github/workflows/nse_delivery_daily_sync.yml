name: NSE ALL-universe Delivery daily sync

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Recent calendar days to gap-check'
        required: false
        default: '14'
  # Security-wise MTO delivery archives can appear later than the first
  # post-close fetch. Retry in the evening so the current session is available
  # before the Delivery production compilation window.
  schedule:
    - cron: '15 14,15 * * 1-5'

concurrency:
  group: nse-delivery-daily-sync
  cancel-in-progress: false

jobs:
  sync-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Google Drive authentication
        env:
          GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          python - <<'PY'
          from persistent_store import drive_status
          status = drive_status()
          print(status)
          if not status.get("configured") or status.get("reachable") is False:
              raise SystemExit("Google Drive authentication check failed")
          PY

      - name: Fetch and persist official NSE Delivery archives
        env:
          GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          set -eux
          LOOKBACK='${{ inputs.lookback_days }}'
          if [ -z "$LOOKBACK" ]; then
            LOOKBACK=14
          fi
          python -u nse_delivery_daily_sync.py --lookback-days "$LOOKBACK" --sleep-seconds 1 --retries 3
