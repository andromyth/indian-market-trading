name: NSE Delivery production cycle

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Optional NSE production session date YYYY-MM-DD'
        required: false
        default: ''
  # Eleven independent hourly opportunities. Each run is short and exits once
  # the target session is already persisted; no GitHub runner sleeps overnight.
  #
  # 15:15-18:15 UTC = 20:45-23:45 IST
  # 19:15-23:15 UTC = 00:45-04:45 IST
  # 00:15-01:15 UTC (Tue-Sat) = 05:45-06:45 IST
  #
  # The target session is pinned by production_data_freshness_gate.py so
  # after midnight the retries remain attached to the previous NSE session.
  schedule:
    - cron: '15 15-18 * * 1-5'
    - cron: '15 19-23 * * 1-5'
    - cron: '15 0-1 * * 2-6'

# Prevent overlapping production refreshes while never cancelling a scheduled
# retry. A normal run is ~5-6 minutes, well below the hourly cadence.
concurrency:
  group: nse-delivery-production-cycle
  cancel-in-progress: false

jobs:
  production-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      INDIAN_MARKET_RESEARCH_ROOT: ${{ github.workspace }}/.market_data
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare persistent data path
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.market_data"
          echo "Persistent data root: $GITHUB_WORKSPACE/.market_data"

      - name: Resolve target NSE session
        id: target
        env:
          MANUAL_TARGET_DATE: ${{ inputs.target_date }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$MANUAL_TARGET_DATE" ]; then
            TARGET_DATE="$MANUAL_TARGET_DATE"
          else
            TARGET_DATE="$(python - <<'PY'
          from production_data_freshness_gate import expected_session_date
          target = expected_session_date()
          print(target.isoformat() if target else "")
          PY
            )"
          fi

          if [ -z "$TARGET_DATE" ]; then
            echo "No NSE production session expected in this retry window."
            echo "target_date=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python - <<PY
          from datetime import date
          d=date.fromisoformat("$TARGET_DATE")
          if d.weekday() >= 5:
              raise SystemExit("Target date is a weekend: " + d.isoformat())
          PY

          echo "Target NSE session: $TARGET_DATE"
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"

      - name: Verify Google Drive authentication
        if: steps.target.outputs.target_date != ''
        run: |
          set -euo pipefail
          python - <<'PY'
          from persistent_store import drive_status
          status = drive_status()
          print(status)
          if not status.get("configured") or status.get("reachable") is False:
              raise SystemExit("Google Drive authentication check failed")
          print(f"Google Drive auth method: {status.get('auth_method')}")
          PY

      - name: Fetch NSE data for target session
        if: steps.target.outputs.target_date != ''
        run: |
          set -u
          python -u nse_bulk_eod_ingest.py --auto --repair-days 14 --sync-drive || EOD_EXIT=$?
          echo "EOD ingestion exit: ${EOD_EXIT:-0}"

          python -u nse_delivery_daily_sync.py --lookback-days 14 --sleep-seconds 1 --retries 3

      - name: Verify target NSE session is fully persisted
        if: steps.target.outputs.target_date != ''
        run: |
          set -euo pipefail
          python -u production_data_freshness_gate.py --target-date "${{ steps.target.outputs.target_date }}"

      - name: Check whether target PIT snapshot is current and production-ready
        id: snapshot
        if: steps.target.outputs.target_date != ''
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, os
          import pandas as pd
          from persistent_store import GoogleDriveStore
          from googleapiclient.http import MediaIoBaseDownload

          target = os.environ["TARGET_DATE"]
          remote = f"features/daily/DELIVERY_PIT_FEATURES_{target}.parquet"
          store = GoogleDriveStore()

          parts = remote.split("/")
          parent = store.root_id
          for part in parts[:-1]:
              hit = store._find_child(parent, part)
              if not hit:
                  print("snapshot_exists=NO")
                  print("snapshot_ready=NO")
                  raise SystemExit(0)
              parent = hit["id"]

          hit = store._find_child(parent, parts[-1])
          if not hit:
              print("snapshot_exists=NO")
              print("snapshot_ready=NO")
              raise SystemExit(0)

          buf = io.BytesIO()
          dl = MediaIoBaseDownload(buf, store.service.files().get_media(fileId=hit["id"]))
          done = False
          while not done:
              _, done = dl.next_chunk()

          tmp = "/tmp/target_delivery_snapshot.parquet"
          with open(tmp, "wb") as fh:
              fh.write(buf.getvalue())

          df = pd.read_parquet(tmp)
          ready = True

          if df.empty or "symbol" not in df.columns:
              ready = False
          else:
              ts = pd.to_datetime(df.get("decision_timestamp"), errors="coerce", utc=True)
              target_rows = int(
                  ts.dt.tz_convert("Asia/Kolkata").dt.date.eq(pd.Timestamp(target).date()).sum()
              ) if ts.notna().any() else 0
              unique_dates = sorted({
                  str(d) for d in ts.dt.tz_convert("Asia/Kolkata").dt.date.dropna().unique()
              })
              gate = (
                  pd.to_numeric(df.get("production_data_quality_gate"), errors="coerce")
                  if "production_data_quality_gate" in df.columns
                  else pd.Series(dtype="float64")
              )
              market = (
                  pd.to_numeric(df.get("ready_market_context"), errors="coerce")
                  if "ready_market_context" in df.columns
                  else pd.Series(dtype="float64")
              )

              ready = (
                  target_rows == len(df)
                  and len(df) == int(df["symbol"].astype(str).str.upper().nunique())
                  and set(unique_dates) == {target}
                  and len(gate) == len(df)
                  and float(gate.mean()) >= 0.999
                  and len(market) == len(df)
                  and float(market.mean()) >= 0.999
              )
              print(f"rows={len(df)} symbols={df['symbol'].astype(str).str.upper().nunique()} target_rows={target_rows}")
              print(f"decision_dates={unique_dates}")
              print(f"production_gate_pct={100*float(gate.mean()) if len(gate) else 0.0:.3f}")
              print(f"market_context_ready_pct={100*float(market.mean()) if len(market) else 0.0:.3f}")

          print("snapshot_exists=YES")
          print(f"snapshot_ready={'YES' if ready else 'NO'}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"exists={'YES' if ready else 'NO'}\n")
          PY

      - name: Build target production PIT snapshot
        if: steps.target.outputs.target_date != ''
        run: |
          if [ "${{ steps.snapshot.outputs.exists }}" = "YES" ]; then
            echo "Target PIT snapshot is current and production-ready; skipping rebuild."
          else
            echo "Target PIT snapshot is missing or stale/blocked; rebuilding."
            python -u delivery_production_refresh.py \
              --lookback-days 150 \
              --delivery-lookback-days 150 \
              --source-wait-minutes 0 \
              --expected-date "${{ steps.target.outputs.target_date }}"
          fi

      - name: Generate target Delivery predictions
        if: steps.target.outputs.target_date != ''
        run: |
          python -u delivery_all_nse_prediction_cycle.py \
            --snapshot-date "${{ steps.target.outputs.target_date }}"

      - name: Validate completed Delivery predictions
        if: steps.target.outputs.target_date != ''
        run: python -u validate_prediction_ledger.py

      - name: Generate Delivery OOS diagnostics
        if: steps.target.outputs.target_date != ''
        run: python -u delivery_validation_diagnostics.py

      - name: Update OOS-gated adaptive Delivery policy
        if: steps.target.outputs.target_date != ''
        run: python -u delivery_policy_update.py --min-samples 80

      - name: Confirm target snapshot
        if: steps.target.outputs.target_date != ''
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from persistent_store import GoogleDriveStore
          target=os.environ["TARGET_DATE"]
          remote=f"features/daily/DELIVERY_PIT_FEATURES_{target}.parquet"
          store=GoogleDriveStore()
          parts=remote.split("/")
          parent=store.root_id
          for part in parts[:-1]:
              hit=store._find_child(parent, part)
              if not hit:
                  raise SystemExit(f"Missing Drive folder: {part}")
              parent=hit["id"]
          if not store._find_child(parent, parts[-1]):
              raise SystemExit(f"Target PIT snapshot missing: {remote}")
          print(f"TARGET_PIT_SNAPSHOT_PRESENT: {remote}")
          PY

      - name: Syntax check
        if: steps.target.outputs.target_date != ''
        run: python -m py_compile production_data_freshness_gate.py delivery_production_refresh.py delivery_all_nse_prediction_cycle.py validate_prediction_ledger.py live_test_preflight.py all_nse_intraday_5m_model.py colab_build_all_nse_intraday_5m_multifactor.py intraday_5m_multihorizon_validation.py app.py delivery_policy_update.py delivery_validation_diagnostics.py
