name: NSE Delivery production cycle

on:
  # A change to the autonomous production-refresh path should run through the
  # real data path immediately, rather than waiting for the evening schedule.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/nse_delivery_production_cycle.yml"
      - "backfill_missing_delivery_pit_snapshots.py"
      - "delivery_production_refresh.py"
      - "nse_bulk_eod_ingest.py"
      - "nse_delivery_daily_sync.py"
      - "production_data_freshness_gate.py"
      - "delivery_all_nse_prediction_cycle.py"
      # Trigger the same end-to-end check when an ingestion or feature-builder
      # dependency changes, not just when the top-level runner changes.
      - "nse_data_layer.py"
      - "nse_delivery_data_layer.py"
      - "persistent_store.py"
      - "multifactor_data_layer_v2.py"
      - "delivery_training_universe.py"
      - "selfdriving/sd_news_collect.py"
      - "prediction_ledger.py"
      - "prediction_validation.py"
      - "validate_prediction_ledger.py"
      - "delivery_prediction_csv_ledger.py"
      - "delivery_validation_diagnostics.py"
      - "delivery_policy_update.py"

  workflow_dispatch:
    inputs:
      target_date:
        description: 'Optional NSE production session date YYYY-MM-DD'
        required: false
        default: ''
  # Post-market hourly retries. Each run fetches/repairs the completed NSE
  # session, backfills recent missed PIT snapshots, builds the current session's
  # PIT snapshot, generates the locked ALL-NSE 59-feature forecast for the next
  # NSE session, validates prior forecasts, and refreshes the audit ledgers.
  #
  # 20:45-23:45 IST, 00:45-04:45 IST, 05:45-06:45 IST.
  # Before close, the clock resolver pins the job to the latest completed
  # session; after close, it advances to the session just completed.
  schedule:
    - cron: '15 15-18 * * 1-5'
    - cron: '15 19-23 * * 1-5'
    - cron: '15 0-1 * * 2-6'

# Prevent overlapping production refreshes while never cancelling a scheduled
# retry. A normal run is ~5-6 minutes, well below the hourly cadence.
concurrency:
  group: nse-delivery-production-cycle
  cancel-in-progress: false

jobs:
  production-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      INDIAN_MARKET_RESEARCH_ROOT: ${{ github.workspace }}/.market_data
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare persistent data path
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.market_data"
          echo "Persistent data root: $GITHUB_WORKSPACE/.market_data"

      - name: Resolve target NSE session
        id: target
        env:
          MANUAL_TARGET_DATE: ${{ inputs.target_date }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$MANUAL_TARGET_DATE" ]; then
            TARGET_DATE="$MANUAL_TARGET_DATE"
          else
            TARGET_DATE="$(python - <<'PY'
          from production_data_freshness_gate import expected_session_date
          target = expected_session_date()
          print(target.isoformat() if target else "")
          PY
            )"
          fi

          if [ -z "$TARGET_DATE" ]; then
            echo "No NSE production session expected in this retry window."
            echo "target_date=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python - <<PY
          from datetime import date
          d=date.fromisoformat("$TARGET_DATE")
          if d.weekday() >= 5:
              raise SystemExit("Target date is a weekend: " + d.isoformat())
          PY

          echo "Target NSE session: $TARGET_DATE"
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"

      - name: Verify Google Drive authentication
        if: steps.target.outputs.target_date != ''
        run: |
          set -euo pipefail
          python - <<'PY'
          from persistent_store import drive_status
          status = drive_status(require_write=True)
          print(status)
          if not status.get("configured") or status.get("reachable") is False:
              raise SystemExit("Google Drive read/write authentication check failed")
          if status.get("write_ready") is False:
              raise SystemExit("Google Drive write authorization is not ready: " + str(status.get("reason")))
          print(f"Google Drive read auth method: {status.get('auth_method')}")
          print(f"Google Drive write auth method: {status.get('write_auth_method')}")
          PY

      - name: Fetch NSE data for target session
        if: steps.target.outputs.target_date != ''
        run: |
          set -u
          python -u nse_bulk_eod_ingest.py --auto --repair-days 14 --sync-drive || EOD_EXIT=$?
          echo "EOD ingestion exit: ${EOD_EXIT:-0}"

          python -u nse_delivery_daily_sync.py --lookback-days 14 --sleep-seconds 1 --retries 3

      - name: Verify target NSE session is fully persisted
        if: steps.target.outputs.target_date != ''
        run: |
          set -euo pipefail
          python -u production_data_freshness_gate.py --target-date "${{ steps.target.outputs.target_date }}"

      - name: Build current-day PIT snapshot for next trading day
        if: steps.target.outputs.target_date != ''
        run: |
          echo "Building the completed-session PIT snapshot for the next trading day."
          echo "The next morning prediction will use this snapshot."

          python -u delivery_production_refresh.py \
            --lookback-days 150 \
            --delivery-lookback-days 150 \
            --source-wait-minutes 0 \
            --expected-date "${{ steps.target.outputs.target_date }}"

      - name: Generate active ALL-NSE 59-feature Delivery predictions for next NSE session
        if: steps.target.outputs.target_date != ''
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
        run: |
          set -euo pipefail
          python -u delivery_all_nse_prediction_cycle.py --snapshot-date "$TARGET_DATE"

      - name: Verify next-session production prediction batch is persisted
        if: steps.target.outputs.target_date != ''
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import date
          from collections import Counter
          from delivery_all_nse_prediction_cycle import _next_trading_day
          from prediction_ledger import load_records

          reference_date = date.fromisoformat(os.environ["TARGET_DATE"])
          prediction_date = _next_trading_day(reference_date).isoformat()
          records = load_records()
          batch = [
              row for row in records
              if str(row.get("mode", "")).lower() == "delivery"
              and str(row.get("reference_session", ""))[:10] == reference_date.isoformat()
              and str(row.get("prediction_for_date", ""))[:10] == prediction_date
          ]
          if not batch:
              raise SystemExit(
                  "NO_PERSISTED_ACTIVE_DELIVERY_BATCH: "
                  f"reference={reference_date} prediction_for={prediction_date}"
              )
          symbols = [str(row.get("symbol", "")).strip().upper() for row in batch]
          if not all(symbols) or len(symbols) != len(set(symbols)):
              raise SystemExit("INVALID_PERSISTED_BATCH: empty or duplicate symbols")
          if any(int(row.get("feature_count", 0) or 0) != 59 for row in batch):
              raise SystemExit("INVALID_PERSISTED_BATCH: production feature_count is not 59")
          versions = sorted({str(row.get("model_version", "")) for row in batch})
          if len(versions) != 1 or not versions[0].startswith("2026-all-nse-delivery-multifactor-59-"):
              raise SystemExit("INVALID_PERSISTED_BATCH: unexpected or mixed active model versions: " + str(versions))
          signals = Counter(str(row.get("signal", "UNKNOWN")).upper() for row in batch)
          print(json.dumps({
              "status": "PASS",
              "reference_session": reference_date.isoformat(),
              "prediction_for_date": prediction_date,
              "rows": len(batch),
              "symbols": len(set(symbols)),
              "model_version": versions[0],
              "signals": dict(signals),
              "persistence": "prediction_ledger.load_records() found the target batch after Drive sync",
          }, indent=2))
          PY

      - name: Validate prior trading-day Delivery predictions against today's actual
        if: steps.target.outputs.target_date != ''
        run: python -u validate_prediction_ledger.py

      - name: Update daywise Delivery prediction-vs-actual CSV ledger with actuals
        if: steps.target.outputs.target_date != ''
        run: |
          python -u delivery_prediction_csv_ledger.py
          echo "Daily Delivery prediction-vs-actual CSV ledger synchronized to Google Drive."

      - name: Generate Delivery OOS diagnostics
        if: steps.target.outputs.target_date != ''
        run: python -u delivery_validation_diagnostics.py

      - name: Update OOS-gated adaptive Delivery policy
        if: steps.target.outputs.target_date != ''
        run: python -u delivery_policy_update.py --min-samples 80

      - name: Confirm target snapshot
        if: steps.target.outputs.target_date != ''
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from persistent_store import GoogleDriveStore
          target=os.environ["TARGET_DATE"]
          remote=f"features/daily/DELIVERY_PIT_FEATURES_{target}.parquet"
          store=GoogleDriveStore()
          parts=remote.split("/")
          parent=store.root_id
          for part in parts[:-1]:
              hit=store._find_child(parent, part)
              if not hit:
                  raise SystemExit(f"Missing Drive folder: {part}")
              parent=hit["id"]
          if not store._find_child(parent, parts[-1]):
              raise SystemExit(f"Target PIT snapshot missing: {remote}")
          print(f"TARGET_PIT_SNAPSHOT_PRESENT: {remote}")
          PY

      - name: Syntax check
        if: steps.target.outputs.target_date != ''
        run: python -m py_compile production_data_freshness_gate.py delivery_production_refresh.py backfill_missing_delivery_pit_snapshots.py delivery_all_nse_prediction_cycle.py delivery_prediction_csv_ledger.py prediction_ledger.py prediction_validation.py validate_prediction_ledger.py live_test_preflight.py all_nse_intraday_5m_model.py colab_build_all_nse_intraday_5m_multifactor.py intraday_5m_multihorizon_validation.py app.py delivery_policy_update.py delivery_validation_diagnostics.py

      # Prioritize today's target PIT and next-session predictions before historical recovery.
      # Bound catch-up time so a backlog cannot consume the whole production window.
      - name: Backfill missed PIT snapshots for prior official NSE sessions
        if: steps.target.outputs.target_date != ''
        continue-on-error: true
        timeout-minutes: 35
        run: |
          set -euo pipefail
          python -u backfill_missing_delivery_pit_snapshots.py \
            --target-date "${{ steps.target.outputs.target_date }}" \
            --lookback-calendar-days 14 \
            --max-backfills-per-run 14

      - name: Require recent NSE EOD, Delivery and PIT snapshot continuity
        if: steps.target.outputs.target_date != ''
        run: |
          set -euo pipefail
          python -u backfill_missing_delivery_pit_snapshots.py \
            --target-date "${{ steps.target.outputs.target_date }}" \
            --lookback-calendar-days 14 \
            --max-backfills-per-run 14 \
            --audit-only
