name: NSE Delivery production cycle

on:
  workflow_dispatch:
  # Start one autonomous production cycle after the market closes. The job
  # itself retries NSE EOD/Delivery ingestion until today's session is
  # persisted, then compiles the current PIT snapshot automatically.
  schedule:
    - cron: '15 15 * * 1-5'

concurrency:
  group: nse-delivery-production-cycle
  cancel-in-progress: false

jobs:
  production-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      INDIAN_MARKET_RESEARCH_ROOT: ${{ github.workspace }}/.market_data
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare Colab-compatible persistent path
        run: |
          mkdir -p /content/drive/MyDrive
          if [ -e /content/drive/MyDrive/Indian_Market_Research ] && [ ! -L /content/drive/MyDrive/Indian_Market_Research ]; then
            rm -rf /content/drive/MyDrive/Indian_Market_Research
          fi
          ln -sfn "$GITHUB_WORKSPACE/.market_data" /content/drive/MyDrive/Indian_Market_Research

      # Fully autonomous late-publication handling. Do not require a second
      # workflow run when NSE publishes the day's archives after the first fetch.
      - name: Fetch NSE data and wait for current session
        run: |
          set -u
          MAX_ATTEMPTS=11
          SLEEP_SECONDS=3600

          for ATTEMPT in $(seq 1 $MAX_ATTEMPTS); do
            echo "================================================================"
            echo "AUTONOMOUS NSE PRODUCTION ATTEMPT ${ATTEMPT}/${MAX_ATTEMPTS}"
            echo "================================================================"

            EOD_EXIT=0
            python -u nse_bulk_eod_ingest.py \
              --auto \
              --repair-days 14 \
              --sync-drive || EOD_EXIT=$?

            DELIVERY_EXIT=0
            python -u nse_delivery_daily_sync.py \
              --lookback-days 14 \
              --sleep-seconds 1 \
              --retries 3 || DELIVERY_EXIT=$?

            GATE_LOG="$(mktemp)"
            if python -u production_data_freshness_gate.py 2>&1 | tee "$GATE_LOG"; then
              echo "CURRENT NSE SESSION IS READY."
              rm -f "$GATE_LOG"
              break
            fi

            if [ "$ATTEMPT" -eq "$MAX_ATTEMPTS" ]; then
              echo "CURRENT NSE SESSION STILL NOT READY AFTER ${MAX_ATTEMPTS} ATTEMPTS."
              echo "EOD exit=${EOD_EXIT}, Delivery exit=${DELIVERY_EXIT}"
              cat "$GATE_LOG"
              rm -f "$GATE_LOG"
              exit 1
            fi

            echo "Today's NSE archive is not ready yet."
            echo "Waiting 1 hour before the next automatic attempt..."
            rm -f "$GATE_LOG"
            sleep "$SLEEP_SECONDS"
          done

      - name: Build latest production PIT snapshot
        run: python -u delivery_production_refresh.py --lookback-days 150 --delivery-lookback-days 150
      - name: Validate completed Delivery predictions
        run: python -u validate_prediction_ledger.py
      - name: Generate Delivery OOS diagnostics
        run: python -u delivery_validation_diagnostics.py
      - name: Update OOS-gated adaptive Delivery policy
        run: python -u delivery_policy_update.py --min-samples 80

      - name: Syntax check
        run: python -m py_compile production_data_freshness_gate.py delivery_production_refresh.py delivery_all_nse_prediction_cycle.py validate_prediction_ledger.py live_test_preflight.py all_nse_intraday_5m_model.py colab_build_all_nse_intraday_5m_multifactor.py intraday_5m_multihorizon_validation.py app.py delivery_policy_update.py delivery_validation_diagnostics.py
