name: NSE EOD archive audit

on:
  push:
    branches:
      - main
    paths:
      - "nse_eod_archive_audit.py"
      - "tests/test_nse_eod_archive_audit.py"
  workflow_dispatch:
    inputs:
      start:
        description: 'First date to audit (YYYY-MM-DD)'
        required: false
        default: '2026-01-01'
      end:
        description: 'Last date to audit (YYYY-MM-DD)'
        required: false
        default: ''
  # Was triggered after every EOD sync (~3 runs/day, ~200 billed minutes/month).
  # One weekly read-only audit is enough; dispatch for ad-hoc checks.
  # Tuesday 01:00 UTC (06:30 IST) so Monday's EOD archive is already published;
  # a Monday-evening run would report today as a missing date and fail.
  schedule:
    - cron: "0 1 * * 2"

concurrency:
  group: nse-eod-archive-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Audit persisted NSE EOD archive
        env:
          GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          START_DATE_INPUT: ${{ inputs.start }}
          END_DATE_INPUT: ${{ inputs.end }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "NSE EOD archive audit starting at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            START="$START_DATE_INPUT"
            END="$END_DATE_INPUT"
          else
            START='2026-01-01'
            END=''
          fi

          if [ -z "$START" ]; then START='2026-01-01'; fi

          # Let the Python auditor determine the last completed EOD date when
          # --end is omitted: before 16:00 IST, today's archive is not yet due.
          if [ -n "$END" ]; then
            PYTHONUNBUFFERED=1 python -u nse_eod_archive_audit.py --start "$START" --end "$END"
          else
            PYTHONUNBUFFERED=1 python -u nse_eod_archive_audit.py --start "$START"
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-eod-archive-audit
          path: /tmp/nse_eod_archive_audit/*.json
          if-no-files-found: warn
