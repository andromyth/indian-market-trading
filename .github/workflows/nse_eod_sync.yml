name: NSE EOD official data sync

on:
  # A merge that changes the EOD refresh/audit implementation should validate
  # the deployed data path immediately, not wait for the evening cron.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/nse_eod_sync.yml"
      - "refresh_canonical_cash_master_from_bulk_eod.py"
      - "audit_live_prediction_health.py"

  workflow_dispatch:
    inputs:
      start:
        description: 'Optional first NSE date (YYYY-MM-DD) for manual backfill'
        required: false
        default: ''
      end:
        description: 'Optional last NSE date (YYYY-MM-DD) for manual backfill'
        required: false
        default: ''
      repair_days:
        description: 'Recent calendar days to gap-check in automatic mode'
        required: false
        default: '14'

  # NSE EOD archives are sometimes published later than the first post-close
  # run. Retry during the evening instead of allowing a transient 404 to leave
  # the production Delivery snapshot on the previous trading day.
  schedule:
    - cron: '15 13,14,15 * * 1-5'

jobs:
  sync-nse-eod:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Google Drive authentication
        env:
          GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          python - <<'PY'
          from persistent_store import drive_status
          status = drive_status(require_write=True)
          print(status)
          if not status.get('configured') or status.get('reachable') is False or status.get('write_ready') is False:
              raise SystemExit('Google Drive read/write preflight failed: ' + str(status.get('reason', 'write authorization is not ready')))
          print(f"Google Drive auth method: {status.get('auth_method')}")
          PY

      - name: Continuous NSE EOD incremental and gap-repair sync
        env:
          GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          set -x
          echo "NSE EOD sync job starting at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          START='${{ inputs.start }}'
          END='${{ inputs.end }}'
          REPAIR_DAYS='${{ inputs.repair_days }}'

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$START" ] && [ -n "$END" ]; then
            PYTHONUNBUFFERED=1 python -u nse_bulk_eod_ingest.py \
              --start "$START" \
              --end "$END" \
              --sync-drive
          else
            if [ -z "$REPAIR_DAYS" ]; then
              REPAIR_DAYS=14
            fi

            PYTHONUNBUFFERED=1 python -u nse_bulk_eod_ingest.py \
              --auto \
              --repair-days "$REPAIR_DAYS" \
              --sync-drive
          fi

      - name: Incrementally refresh identity-preserved cash master from official UDiFF ZIPs
        env:
          GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          set -euo pipefail
          python -u refresh_canonical_cash_master_from_bulk_eod.py \
            --use-google-drive \
            --apply \
            --lookback-calendar-days 30

      - name: Persist NSE index context for model compilation (best effort)
        env:
          GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from nse_bulk_eod_ingest import business_days
          from nse_data_layer import fetch_index_history, nse_last_diagnostic

          today = datetime.now(ZoneInfo("Asia/Kolkata")).date()
          sessions = list(business_days(today - timedelta(days=14), today))
          if not sessions:
              print("INDEX_CONTEXT_SKIPPED: no NSE trading session resolved")
              raise SystemExit(0)

          # Do not request a future/weekend endpoint date from the UTC runner.
          end = sessions[-1]
          start = end - timedelta(days=10)
          failures = []
          for symbol in ("^NSEI", "^NSEBANK"):
              try:
                  df = fetch_index_history(symbol, start, end, sync_drive=True)
                  print(symbol, "rows", len(df), "date_range", start, end)
              except Exception as exc:
                  failures.append(symbol)
                  print(
                      "INDEX_CONTEXT_WARNING:",
                      symbol,
                      type(exc).__name__,
                      str(exc),
                      "diagnostic=",
                      nse_last_diagnostic(),
                  )

          if failures:
              print(
                  "INDEX_CONTEXT_INCOMPLETE:",
                  ",".join(failures),
                  "- EOD archive sync is independent; a later run will retry index context.",
              )
          PY

      - name: Audit live market freshness and prediction outcomes (non-blocking)
        continue-on-error: true
        env:
          GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          python -u audit_live_prediction_health.py --drive-api
