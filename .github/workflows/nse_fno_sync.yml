name: NSE F&O UDiFF daily sync

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional NSE trade date YYYY-MM-DD'
        required: false
        default: ''
      days_back:
        description: 'Weekdays to catch up when date is empty'
        required: false
        default: '3'
      rebuild_2026:
        description: 'Rebuild the full 2026 derived F&O layer from persisted official raw archives'
        required: false
        type: boolean
        default: false
  # Cron schedule paused at user request; manual workflow_dispatch remains available.
concurrency:
  group: nse-fno-udiff
  cancel-in-progress: false

jobs:
  sync-fno:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      INDIAN_MARKET_RESEARCH_ROOT: ${{ github.workspace }}/.market_data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify Google Drive authentication
        env:
          GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          python - <<'PY'
          from persistent_store import drive_status
          status = drive_status(require_write=True)
          print(status)
          if not status.get("configured") or status.get("reachable") is False or status.get("write_ready") is False:
              raise SystemExit("Google Drive read/write preflight failed: " + str(status.get("reason", "write authorization is not ready")))
          PY
      - name: Download official F&O UDiFF and rebuild daily feature history
        env:
          GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.rebuild_2026 }}" = "true" ]; then
            echo "Rebuilding 2026 F&O derived history from persisted official raw archives"
            python -u nse_fno_udiff_ingest.py --rebuild-derived-2026
          else
            python -u nse_fno_udiff_ingest.py --date "${{ inputs.date }}" --days-back "${{ inputs.days_back || '3' }}"
          fi
