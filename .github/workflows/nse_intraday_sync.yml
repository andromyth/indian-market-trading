name: NSE ALL-universe intraday 1-minute sync

on:
  workflow_dispatch:
    inputs:
      start_index:
        description: 'Universe start index (0-based)'
        required: false
        default: '0'
      max_symbols:
        description: '0 = full NSE universe'
        required: false
        default: '0'
  # Capture the full current NSE universe once every trading hour during the
  # regular cash session. Persisted 1-minute data is then available to the
  # live 5-minute prediction engine without a manual Colab run.
  # 09:15, 10:15, ... 15:15 IST = 03:45, 04:45, ... 09:45 UTC.
  schedule:
    - cron: '45 3-9 * * 1-5'

concurrency:
  group: nse-all-universe-intraday
  cancel-in-progress: false

jobs:
  sync-intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify Google Drive authentication
        env:
          GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          python - <<'PY'
          from persistent_store import drive_status
          status = drive_status()
          print(status)
          if not status.get("configured") or status.get("reachable") is False:
              raise SystemExit("Google Drive authentication check failed")
          PY
      - name: Capture full NSE universe
        env:
          GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          python -u nse_intraday_all_universe_sync.py             --start-index "${{ inputs.start_index || '0' }}"             --max-symbols "${{ inputs.max_symbols || '0' }}"
