name: Paper Trading CI

on:
  push:
    branches:
      - "feature/paper-trading-*"
    paths:
      - "app.py"
      - "paper_trading.py"
      - "tests/test_paper_trading.py"
      - ".github/workflows/paper-trading-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app.py"
      - "paper_trading.py"
      - "tests/test_paper_trading.py"
      - ".github/workflows/paper-trading-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-trading-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip pandas streamlit pytest
      - name: Compile application and simulator
        run: python -m compileall -q app.py paper_trading.py
      - name: Run paper-trading tests
        run: python -m pytest -q tests/test_paper_trading.py
