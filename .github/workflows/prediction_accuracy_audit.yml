name: Live prediction accuracy audit

# Manual/commit-triggered only. No cron is enabled; this respects the request
# to keep scheduled jobs paused while allowing an explicit month-to-date audit.
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'First date to audit (YYYY-MM-DD; blank = first of current month in IST)'
        required: false
        default: ''
      end_date:
        description: 'Last date to audit (YYYY-MM-DD; blank = today in IST)'
        required: false
        default: ''
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prediction_accuracy_audit.yml"
      - "audit_live_prediction_health.py"
      - "audit_autonomous_intraday_outcomes.py"
      - "prediction_ledger.py"
      - "prediction_validation.py"
      - "delivery_validation_diagnostics.py"
      - "validate_intraday_30m_predictions.py"
      - "validate_delivery_prediction_ledger.py"
      - "delivery_prediction_csv_ledger.py"
      - "delivery_production_refresh.py"
      - "intraday_5m_multihorizon_validation.py"
      - "tests/test_live_accuracy_audit_inputs.py"

permissions:
  contents: read

jobs:
  audit-live-accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      INDIAN_MARKET_RESEARCH_ROOT: ${{ github.workspace }}/.market_data
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Google Drive access
        run: |
          python - <<'PY'
          from persistent_store import drive_status
          status = drive_status(require_write=True)
          print({
              key: status.get(key)
              for key in (
                  "configured", "reachable", "write_ready",
                  "auth_method", "write_auth_method", "reason"
              )
          })
          if (
              not status.get("configured")
              or status.get("reachable") is False
              or status.get("write_ready") is False
          ):
              raise SystemExit("Google Drive preflight failed.")
          PY

      - name: Resolve audit period (IST)
        id: period
        shell: bash
        run: |
          START_DATE='${{ inputs.start_date }}'
          END_DATE='${{ inputs.end_date }}'
          if [ -z "$START_DATE" ]; then
            START_DATE="$(TZ=Asia/Kolkata date +%Y-%m-01)"
          fi
          if [ -z "$END_DATE" ]; then
            END_DATE="$(TZ=Asia/Kolkata date +%Y-%m-%d)"
          fi
          python - "$START_DATE" "$END_DATE" <<'PY'
          import sys
          from datetime import date
          start, end = map(date.fromisoformat, sys.argv[1:3])
          if end < start:
              raise SystemExit("end_date must be on or after start_date")
          PY
          echo "start_date=$START_DATE" >> "$GITHUB_OUTPUT"
          echo "end_date=$END_DATE" >> "$GITHUB_OUTPUT"
          echo "Auditing $START_DATE through $END_DATE (Asia/Kolkata)"

      - name: Hydrate recent official EOD archive from Drive
        continue-on-error: true
        run: |
          mkdir -p accuracy-audit .market_data
          set +e
          python - <<'PY' > accuracy-audit/eod_hydration.json 2> accuracy-audit/eod_hydration_stderr.txt
          import json
          from delivery_production_refresh import _download_recent_eod
          from persistent_store import GoogleDriveStore
          result = _download_recent_eod(GoogleDriveStore(), lookback_days=45)
          print(json.dumps(result, indent=2))
          if int(result.get("files_found", 0)) == 0:
              raise SystemExit("No official EOD archive files found in Google Drive.")
          PY
          rc=$?
          printf '{"audit":"official_eod_hydration","exit_code":%s}\n' "$rc" > accuracy-audit/eod_hydration_exit.json
          cat accuracy-audit/eod_hydration.json
          if [ "$rc" -ne 0 ]; then
            echo "EOD hydration returned exit code $rc; inspect the stderr artifact."
            exit "$rc"
          fi

      - name: Validate matured Delivery predictions against official EOD bars
        continue-on-error: true
        run: |
          mkdir -p accuracy-audit
          set +e
          python -u validate_delivery_prediction_ledger.py \
            > accuracy-audit/delivery_validation.json \
            2> accuracy-audit/delivery_validation_stderr.txt
          rc=$?
          printf '{"audit":"delivery_target_validation","exit_code":%s}\n' "$rc" > accuracy-audit/delivery_validation_exit.json
          cat accuracy-audit/delivery_validation.json
          if [ "$rc" -ne 0 ]; then
            echo "Delivery target validator returned exit code $rc; inspect the stderr artifact."
            exit "$rc"
          fi

      - name: Validate matured 30-minute predictions against exact target bars
        id: validate-30m
        continue-on-error: true
        run: |
          mkdir -p accuracy-audit
          set +e
          python -u validate_intraday_30m_predictions.py --lookback-calendar-days 14 \
            > accuracy-audit/30m_validation.json \
            2> accuracy-audit/30m_validation_stderr.txt
          rc=$?
          printf '{"audit":"intraday_30m_target_validation","exit_code":%s}\n' "$rc" \
            > accuracy-audit/30m_validation_exit.json
          cat accuracy-audit/30m_validation.json
          if [ "$rc" -ne 0 ]; then
            echo "30-minute target validator returned exit code $rc; inspect the stderr artifact."
            exit "$rc"
          fi

      - name: Score current Delivery outcomes from the live ledger
        id: delivery
        continue-on-error: true
        run: |
          mkdir -p accuracy-audit
          set +e
          python -u audit_live_prediction_health.py --drive-api \
            > accuracy-audit/live_prediction_health.json \
            2> accuracy-audit/delivery_audit_stderr.txt
          rc=$?
          printf '{"audit":"delivery_live_health","exit_code":%s}\n' "$rc" \
            > accuracy-audit/delivery_audit_exit.json
          cat accuracy-audit/live_prediction_health.json
          if [ "$rc" -ne 0 ]; then
            echo "Delivery audit returned exit code $rc; inspect the JSON and stderr artifact."
            exit "$rc"
          fi

      - name: Score matured autonomous Intraday outcomes against persisted 1-minute bars
        id: intraday
        continue-on-error: true
        run: |
          mkdir -p accuracy-audit/intraday
          set +e
          python -u audit_autonomous_intraday_outcomes.py \
            --sync-drive \
            --start-date "${{ steps.period.outputs.start_date }}" \
            --end-date "${{ steps.period.outputs.end_date }}" \
            --segment service \
            --out-dir accuracy-audit/intraday \
            > accuracy-audit/intraday_audit_stdout.json \
            2> accuracy-audit/intraday_audit_stderr.txt
          rc=$?
          printf '{"audit":"intraday_service_outcomes","exit_code":%s}\n' "$rc" \
            > accuracy-audit/intraday_audit_exit.json
          cat accuracy-audit/intraday_audit_stdout.json
          if [ "$rc" -ne 0 ]; then
            echo "Intraday audit returned exit code $rc; inspect the JSON and stderr artifact."
            exit "$rc"
          fi

      - name: Upload accuracy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-prediction-accuracy-${{ github.run_id }}
          path: accuracy-audit/**
          if-no-files-found: warn
          retention-days: 30

      - name: Fail if either audit component reported an error
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          reports = [
              ("Official EOD hydration", Path("accuracy-audit/eod_hydration_exit.json")),
              ("Delivery target validator", Path("accuracy-audit/delivery_validation_exit.json")),
              ("30-minute target validator", Path("accuracy-audit/30m_validation_exit.json")),
              ("Delivery live health", Path("accuracy-audit/delivery_audit_exit.json")),
              ("Autonomous Intraday outcomes", Path("accuracy-audit/intraday_audit_exit.json")),
          ]
          failures = []
          for label, path in reports:
              if not path.exists():
                  failures.append(f"{label}: exit report missing ({path})")
                  continue
              try:
                  report = json.loads(path.read_text(encoding="utf-8"))
                  exit_code = int(report.get("exit_code", 1))
              except Exception as exc:
                  failures.append(f"{label}: invalid exit report ({type(exc).__name__}: {exc})")
                  continue
              if exit_code != 0:
                  failures.append(f"{label}: exit code {exit_code}")

          if failures:
              raise SystemExit("Accuracy audit failure after artifact upload: " + "; ".join(failures))
          print("All accuracy audit components passed.")
          PY
