name: Promote refreshed intraday OAuth revision and verify capture

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/promote_intraday_oauth_revision.yml"

permissions:
  contents: read

concurrency:
  group: intraday-oauth-promotion
  cancel-in-progress: false

jobs:
  promote-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_ID: indian-market-trading
      REGION: asia-south1
      SERVICE: indian-market-intraday-worker
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          project_id: indian-market-trading

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: indian-market-trading

      - name: Verify staged revision references the refreshed OAuth secret
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format=json > /tmp/service.json
          REVISION="$(python - <<'PY'
          import json
          service=json.load(open("/tmp/service.json",encoding="utf-8"))
          status=service.get("status") or {}
          revision=status.get("latestCreatedRevisionName")
          if not revision:
              raise SystemExit("No latest-created revision exists.")
          print(revision)
          PY
          )"
          gcloud run revisions describe "$REVISION" --project="$PROJECT_ID" --region="$REGION" --format=json > /tmp/revision.json
          python - "$REVISION" <<'PY'
          import json, sys
          expected_revision=sys.argv[1]
          revision=json.load(open("/tmp/revision.json",encoding="utf-8"))
          spec=revision.get("spec") or {}
          status=revision.get("status") or {}
          conditions=status.get("conditions") or []
          by_type={item.get("type"):item for item in conditions}
          ready=by_type.get("Ready") or {}
          container_ready=by_type.get("ContainerReady") or {}
          runtime_sa=spec.get("serviceAccountName")
          oauth_ref=None
          version_marker=None
          for container in spec.get("containers") or []:
              for item in container.get("env") or []:
                  name=item.get("name")
                  source=item.get("valueSource") or {}
                  secret=source.get("secretKeyRef") or {}
                  if not secret:
                      secret=((item.get("valueFrom") or {}).get("secretKeyRef") or {})
                  if name=="GOOGLE_OAUTH_TOKEN_JSON":
                      oauth_ref={
                          "secret":secret.get("secret") or secret.get("name"),
                          "version":str(secret.get("version") or secret.get("key") or "latest"),
                      }
                  elif name=="GOOGLE_OAUTH_TOKEN_SECRET_VERSION":
                      version_marker=item.get("value")
          summary={
              "revision":expected_revision,
              "runtime_service_account":runtime_sa,
              "ready_status":ready.get("status"),
              "ready_reason":ready.get("reason"),
              "container_ready_status":container_ready.get("status"),
              "oauth_secret_ref":oauth_ref,
              "oauth_version_marker":version_marker,
          }
          print("STAGED_OAUTH_REVISION_CHECK="+json.dumps(summary,sort_keys=True))
          if ready.get("status")!="True" or container_ready.get("status")!="True":
              raise SystemExit("Staged revision is not Ready and ContainerReady.")
          if runtime_sa!="indian-market-intraday-runtime@indian-market-trading.iam.gserviceaccount.com":
              raise SystemExit("Unexpected Cloud Run runtime service account; refusing promotion.")
          if not oauth_ref or oauth_ref.get("secret")!="google-oauth-token-json" or oauth_ref.get("version")!="6":
              raise SystemExit("Staged revision does not reference OAuth Secret Manager version 6.")
          if str(version_marker)!="6":
              raise SystemExit("Staged revision OAuth version marker does not equal 6.")
          PY
          echo "REVISION=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Promote the verified OAuth revision to production traffic
        shell: bash
        env:
          REVISION: ${{ steps.candidate.outputs.REVISION }}
        run: |
          set -euo pipefail
          [[ -n "$REVISION" ]] || { echo "No verified candidate revision."; exit 1; }
          gcloud run services update-traffic "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --to-revisions="$REVISION=100" \
            --quiet
          echo "PROMOTION_REQUESTED_REVISION=$REVISION"

      - name: Verify promoted revision is Ready and has 100 percent traffic
        shell: bash
        env:
          REVISION: ${{ steps.candidate.outputs.REVISION }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format=json > /tmp/service-after.json
            if python - "$REVISION" <<'PY'
          import json,sys
          revision=sys.argv[1]
          service=json.load(open("/tmp/service-after.json",encoding="utf-8"))
          status=service.get("status") or {}
          traffic=status.get("traffic") or []
          percent=sum(int(item.get("percent") or 0) for item in traffic if item.get("revisionName")==revision)
          ready=status.get("latestReadyRevisionName")
          print("PROMOTION_STATE="+json.dumps({
              "target_revision":revision,
              "latest_created":status.get("latestCreatedRevisionName"),
              "latest_ready":ready,
              "target_traffic_percent":percent,
              "traffic":traffic,
          },sort_keys=True))
          if ready==revision and percent==100:
              raise SystemExit(0)
          raise SystemExit(1)
          PY
            then
              echo "PRODUCTION_OAUTH_REVISION_PROMOTION=PASS"
              exit 0
            fi
            sleep 5
          done
          echo "PRODUCTION_OAUTH_REVISION_PROMOTION=FAIL"
          gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='yaml(status)'
          exit 1

      - name: Trigger one real five-minute production tick
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess, time
          from datetime import datetime, timedelta, timezone, time as clock_time
          from zoneinfo import ZoneInfo
          project="indian-market-trading"
          region="asia-south1"
          ist=ZoneInfo("Asia/Kolkata")
          now=datetime.now(ist)
          if now.weekday()>=5 or not (clock_time(9,15)<=now.time()<clock_time(15,30)):
              raise SystemExit("Outside NSE cash session; promotion verified but no live tick requested.")
          base=now.replace(second=0,microsecond=0)
          minute=((base.minute//5)+1)*5
          target=base.replace(minute=0)+timedelta(hours=1) if minute>=60 else base.replace(minute=minute)
          if target.time()>=clock_time(15,30):
              raise SystemExit("Next five-minute anchor is outside NSE cash session.")
          delay=max(0,(target-now).total_seconds())
          print("WAITING_FOR_CAPTURE_ANCHOR="+target.isoformat())
          time.sleep(delay)
          tick=datetime.now(ist)
          hhmm=tick.hour*100+tick.minute
          job=("intraday-worker-0915-0959" if 915<=hhmm<=959 else
               "intraday-worker-1000-1459" if 1000<=hhmm<=1459 else
               "intraday-worker-1500-1530" if 1500<=hhmm<=1525 else None)
          if not job:
              raise SystemExit("No existing current-session scheduler job matches "+tick.isoformat())
          before=subprocess.run(["gcloud","scheduler","jobs","describe",job,"--project",project,"--location",region,"--format=json"],check=True,capture_output=True,text=True)
          prior=json.loads(before.stdout).get("lastAttemptTime")
          started=datetime.now(timezone.utc)
          subprocess.run(["gcloud","scheduler","jobs","run",job,"--project",project,"--location",region,"--quiet"],check=True)
          print("LIVE_TICK_REQUESTED="+job)
          for _ in range(40):
              result=subprocess.run(["gcloud","scheduler","jobs","describe",job,"--project",project,"--location",region,"--format=json"],check=True,capture_output=True,text=True)
              state=json.loads(result.stdout)
              value=state.get("lastAttemptTime")
              try: current=datetime.fromisoformat(str(value).replace("Z","+00:00"))
              except (TypeError,ValueError): current=None
              try: old=datetime.fromisoformat(str(prior).replace("Z","+00:00")) if prior else None
              except ValueError: old=None
              if current and current>=started and current!=old:
                  status=state.get("lastAttemptStatus") or {}
                  print("LIVE_TICK_RESULT="+json.dumps({
                      "job":job,"last_attempt_time":value,
                      "status_code":status.get("code"),
                      "status_message":str(status.get("message") or "")[:250],
                  },sort_keys=True))
                  break
              time.sleep(3)
          else:
              raise SystemExit("Timed out waiting for Scheduler lastAttemptTime to update.")
          PY

      - name: Audit persisted five-minute snapshots and predictions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy pandas pyarrow fsspec google-api-python-client google-auth google-auth-oauthlib
          sleep 50
          python -u audit_all_universe_minute_snapshots.py --date "$(TZ=Asia/Kolkata date +%F)" --sync-drive > /tmp/current-capture-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("/tmp/current-capture-audit.json").read_text(encoding="utf-8"))
          summary={key:report.get(key) for key in (
              "session_date","expected_minutes","snapshot_files_present",
              "minute_manifests_present","prediction_files_present",
              "prediction_manifests_present","total_model_prediction_count",
              "capture_status_counts","audit_status","drive_json_write","drive_csv_write",
          )}
          print("POST_PROMOTION_CAPTURE_AUDIT="+json.dumps(summary,sort_keys=True,default=str))
          for key in ("drive_json_write","drive_csv_write"):
              if (report.get(key) or {}).get("status")!="OK":
                  raise SystemExit("Audit report failed to persist in Drive: "+key)
          if int(report.get("snapshot_files_present") or 0)<1 or int(report.get("minute_manifests_present") or 0)<1:
              raise SystemExit("Promoted worker has not persisted a five-minute source snapshot/manifest.")
          if int(report.get("prediction_files_present") or 0)<1 or int(report.get("prediction_manifests_present") or 0)<1 or int(report.get("total_model_prediction_count") or 0)<1:
              raise SystemExit("Snapshot exists but corresponding five-minute predictions are not persisted.")
          print("FIVE_MINUTE_CAPTURE_AND_PREDICTION_PERSISTENCE=PASS")
          PY
