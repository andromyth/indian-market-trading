name: Promote to-close champion (Drive)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Candidate run id (blank = models/to_close/latest.json)"
        required: false
        default: ""
      dry_run:
        description: "true = print the decision, write nothing"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      force:
        description: "Publish even when the gate verdict is FAIL"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

concurrency:
  group: to-close-champion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      RUN_ID: ${{ inputs.run_id }}
      DRY_RUN: ${{ inputs.dry_run }}
      FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check joblib numpy pandas scipy scikit-learn google-api-python-client google-auth google-auth-oauthlib
      - name: Promote candidate
        shell: bash
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "${RUN_ID:-}" ]; then ARGS="$ARGS --run-id $RUN_ID"; fi
          if [ "${DRY_RUN:-true}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${FORCE:-false}" = "true" ]; then ARGS="$ARGS --force"; fi
          echo "PROMOTE_ARGS=$ARGS"
          python promote_to_close_candidate.py $ARGS
