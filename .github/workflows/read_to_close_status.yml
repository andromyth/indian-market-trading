name: Read to-close retrain status from Drive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-oauthlib
      - name: Print latest.json and most recent run status
        shell: bash
        run: |
          python - <<'PY'
          import io, json, os
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload

          creds = Credentials.from_authorized_user_info(
              json.loads(os.environ["GOOGLE_OAUTH_TOKEN_JSON"]),
              scopes=["https://www.googleapis.com/auth/drive"])
          if not creds.valid:
              creds.refresh(Request())
          svc = build("drive", "v3", credentials=creds, cache_discovery=False)

          def children(fid):
              out, page = [], None
              while True:
                  r = svc.files().list(
                      q=f"'{fid}' in parents and trashed = false",
                      pageSize=1000, pageToken=page,
                      fields="nextPageToken,files(id,name,mimeType,size,modifiedTime)",
                      supportsAllDrives=True, includeItemsFromAllDrives=True,
                  ).execute()
                  out.extend(r.get("files", []))
                  page = r.get("nextPageToken")
                  if not page:
                      return out

          def descend(parts):
              cur = os.environ["GOOGLE_DRIVE_ROOT_ID"]
              for part in parts:
                  m = [x for x in children(cur) if x["name"] == part and x["mimeType"] == "application/vnd.google-apps.folder"]
                  if not m:
                      return None
                  cur = m[0]["id"]
              return cur

          def read_text(item):
              buf = io.BytesIO()
              dl = MediaIoBaseDownload(buf, svc.files().get_media(fileId=item["id"], supportsAllDrives=True))
              done = False
              while not done:
                  _, done = dl.next_chunk()
              return buf.getvalue().decode("utf-8", "replace")

          models = descend(["models", "to_close"])
          if not models:
              print("TO_CLOSE_FOLDER_MISSING")
              raise SystemExit(0)
          files = children(models)
          latest = [x for x in files if x["name"] == "latest.json"]
          if latest:
              print("LATEST_JSON=" + read_text(max(latest, key=lambda x: x.get("modifiedTime",""))).replace("\n", " "))
          else:
              print("LATEST_JSON_MISSING")

          runs = [x for x in files if x["name"] == "runs" and x["mimeType"] == "application/vnd.google-apps.folder"]
          if runs:
              run_folders = sorted(
                  [x for x in children(runs[0]["id"]) if x["mimeType"] == "application/vnd.google-apps.folder"],
                  key=lambda x: x.get("modifiedTime", ""), reverse=True)
              print("RUN_FOLDER_COUNT=" + str(len(run_folders)))
              for rf in run_folders[:3]:
                  st = [x for x in children(rf["id"]) if x["name"] == "retrain_status.json"]
                  if st:
                      print("RUN_STATUS " + rf["name"] + "=" + read_text(st[0]).replace("\n", " "))
                  aud = [x for x in children(rf["id"]) if x["name"] == "input_audit.json"]
                  if aud:
                      print("AUDIT_JSON " + rf["name"] + "=" + read_text(aud[0]).replace("\n", " ")[:6000])
                  log = [x for x in children(rf["id"]) if x["name"] == "retrain.log"]
                  if log:
                      text = read_text(log[0])
                      print("RETRAIN_LOG " + rf["name"] + "=<<<\n" + text[-8000:] + "\n>>>")
          PY
