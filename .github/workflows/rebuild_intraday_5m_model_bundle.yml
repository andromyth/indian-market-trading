name: Recover ALL-NSE five-minute model bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rebuild_intraday_5m_model_bundle.yml"
      - "rebuild_all_nse_intraday_5m_model_from_drive.py"
      - "colab_build_all_nse_intraday_multifactor.py"
      - "all_nse_intraday_model.py"
      - "persistent_store.py"
      - "delivery_training_universe.py"

permissions:
  contents: read
  actions: write

concurrency:
  group: all-nse-intraday-5m-model-recovery
  cancel-in-progress: false

jobs:
  rebuild-validate-upload:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[repair-intraday-5m-model]')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}

    steps:
      - name: Check out the recovery code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime and training dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile and verify recovery runner
        run: |
          set -euo pipefail
          python -m py_compile \
            rebuild_all_nse_intraday_5m_model_from_drive.py \
            colab_build_all_nse_intraday_multifactor.py \
            all_nse_intraday_model.py \
            persistent_store.py

      - name: Verify Drive read/write access before downloading data
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from persistent_store import drive_status
          status = drive_status(require_write=True)
          safe = {
              key: status.get(key)
              for key in (
                  "configured", "reachable", "write_ready", "auth_method",
                  "write_auth_method", "root_name", "reason",
              )
          }
          print("MODEL_RECOVERY_DRIVE_PREFLIGHT=" + json.dumps(safe, sort_keys=True))
          if not status.get("configured") or status.get("reachable") is not True or status.get("write_ready") is not True:
              raise SystemExit("Model recovery stopped: Google Drive is not read/write ready.")
          PY

      - name: Rebuild and validate compatible five-minute model; upload only after validation
        run: |
          set -euo pipefail
          python -u rebuild_all_nse_intraday_5m_model_from_drive.py \
            --work-root "$RUNNER_TEMP/all-nse-intraday-5m-model-recovery" \
            --min-symbol-coverage 0.50 \
            --min-trainable-symbols 100

      - name: Request guarded staged deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy_intraday_worker_recovery.yml --ref main
          echo "STAGED_DEPLOYMENT_WORKFLOW_DISPATCHED=true" >> "$GITHUB_STEP_SUMMARY"
          echo "The deployment workflow will stage the revision at zero traffic, validate /modelz against the uploaded manifest and estimator hashes, and only then consider promotion." >> "$GITHUB_STEP_SUMMARY"
