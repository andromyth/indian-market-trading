name: Recover minute prediction/actual persistence once

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/recover_minute_prediction_actual_once.yml"

permissions:
  contents: read

concurrency:
  group: recover-minute-prediction-actual-once
  cancel-in-progress: true

jobs:
  one-shot-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
      INDSTOCKS_CLIENT_ID: ${{ secrets.INDSTOCKS_CLIENT_ID }}
      INDSTOCKS_MPIN: ${{ secrets.INDSTOCKS_MPIN }}
      INDSTOCKS_TOTP_SECRET: ${{ secrets.INDSTOCKS_TOTP_SECRET }}
      INDSTOCKS_ACCESS_TOKEN: ${{ secrets.INDSTOCKS_ACCESS_TOKEN }}
      MINUTE_PERSISTENCE_AUDIT_LOOKBACK_DAYS: "1"

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify Google Drive read/write access
        run: |
          python - <<'PY'
          import json
          from persistent_store import drive_status
          status = drive_status(require_write=True)
          safe = {
              key: status.get(key)
              for key in (
                  "configured", "reachable", "write_ready",
                  "auth_method", "write_auth_method", "reason",
              )
          }
          print("DRIVE_PREFLIGHT:", json.dumps(safe, sort_keys=True))
          if (
              not status.get("configured")
              or status.get("reachable") is False
              or status.get("write_ready") is False
          ):
              raise SystemExit("Google Drive read/write preflight failed.")
          PY

      - name: Run one real prediction/actual tick and flush to Drive
        timeout-minutes: 4
        run: |
          python -u - <<'PY'
          import json
          import sys
          import all_universe_minute_capture
          from autonomous_intraday_worker import AutonomousIntradayWorker

          # Recovery scope is the missing prediction + contemporaneous actual-price
          # snapshot. Avoid letting the separate full-universe quote batch block
          # this durable watchlist snapshot; the regular Cloud Run service owns
          # full-universe capture and it is audited separately below.
          def skip_full_universe_for_recovery(*, now=None, worker_root=None, daily_ledger=None, prediction_snapshots=None):
              print("FULL_UNIVERSE_CAPTURE_DEFERRED_FOR_RECOVERY_TICK", flush=True)
              return {
                  "status": "SKIPPED_FOR_ONE_SHOT_RECOVERY",
                  "cycle_minute_ist": str(now),
                  "reason": "isolating the watchlist prediction/actual persistence path from the full-universe capture path",
              }
          all_universe_minute_capture.capture_all_universe_minute_snapshot = skip_full_universe_for_recovery

          worker = AutonomousIntradayWorker(
              # Use the production service ledger namespace so the read-only
              # persistence audit sees this one-off recovery record.
              segment="service",
              interval_seconds=60,
              max_stocks=1,
              max_cycles=1,
          )
          result = worker.tick_once()
          flush = worker._flush(final=True)

          summary = result.get("summary") or {}
          snapshot = result.get("minute_snapshot") or {}
          capture = result.get("all_universe_capture") or {}
          report = {
              "status": result.get("status"),
              "minute": result.get("minute"),
              "cycle": result.get("cycle"),
              "predictions_written": summary.get("predictions_written"),
              "prediction_rows_valid": summary.get("prediction_rows_valid"),
              "prediction_errors": summary.get("prediction_errors"),
              "minute_snapshot": {
                  "status": snapshot.get("status"),
                  "remote_path": snapshot.get("remote_path"),
                  "snapshot_rows": snapshot.get("snapshot_rows"),
                  "prediction_rows": snapshot.get("prediction_rows"),
                  "error": snapshot.get("error"),
              },
              "all_universe_capture": {
                  "status": capture.get("status"),
                  "expected_symbol_count": capture.get("expected_symbol_count"),
                  "quoted_symbol_count": capture.get("quoted_symbol_count"),
                  "missing_quote_count": capture.get("missing_quote_count"),
                  "snapshot_drive_path": capture.get("snapshot_drive_path"),
                  "error": capture.get("error"),
              },
              "final_flush": {
                  "status": flush.get("status"),
                  "ledger_synced": flush.get("ledger_synced"),
                  "status_synced": flush.get("status_synced"),
                  "data_partitions_synced": flush.get("data_partitions_synced"),
                  "errors": flush.get("errors"),
              },
          }
          print("ONE_SHOT_MINUTE_RECOVERY:", json.dumps(report, sort_keys=True, default=str))
          if result.get("status") == "MARKET_CLOSED":
              raise SystemExit("No live tick was captured: worker session guard says market closed.")
          if snapshot.get("status") != "OK":
              raise SystemExit("Prediction/actual minute snapshot was not persisted to Drive.")
          if flush.get("status") != "OK":
              raise SystemExit("Final ledger/status flush to Drive failed.")
          PY

      - name: Verify current-day persisted prediction and actual rows
        run: |
          set -euo pipefail
          python -u verify_minute_prediction_persistence.py | tee /tmp/minute-persistence-audit.log
          python - <<'PY'
          import json
          from pathlib import Path

          output = Path("/tmp/minute-persistence-audit.log").read_text(encoding="utf-8")
          begin = "MINUTE_PERSISTENCE_AUDIT_JSON_BEGIN"
          end = "MINUTE_PERSISTENCE_AUDIT_JSON_END"
          if begin not in output or end not in output:
              raise SystemExit("Minute persistence audit report markers are missing.")
          report = json.loads(output.split(begin, 1)[1].split(end, 1)[0].strip())
          verdict = report.get("verdict") or {}
          summary = {
              "checked_at_ist": report.get("checked_at_ist"),
              "worker_run_status": (report.get("worker_status_latest") or {}).get("run_status"),
              "lookback_days_scanned": report.get("lookback_days_scanned"),
              "watchlist_minute_snapshots_fresh": verdict.get("watchlist_minute_snapshots_fresh"),
              "watchlist_actual_observation_rows_present": verdict.get("watchlist_actual_observation_rows_present"),
              "watchlist_prediction_rows_present_recently": verdict.get("watchlist_prediction_rows_present_recently"),
              "today_prediction_ledger_recent_and_nonempty": verdict.get("today_prediction_ledger_recent_and_nonempty"),
              "full_universe_minute_capture_fresh_and_status_ok": verdict.get("full_universe_minute_capture_fresh_and_status_ok"),
              "overall": verdict.get("overall"),
          }
          print("POST_RECOVERY_PERSISTENCE_VERDICT:", json.dumps(summary, sort_keys=True))
          required = (
              "watchlist_minute_snapshots_fresh",
              "watchlist_actual_observation_rows_present",
              "watchlist_prediction_rows_present_recently",
              "today_prediction_ledger_recent_and_nonempty",
          )
          failed = [key for key in required if not verdict.get(key)]
          if failed:
              raise SystemExit("Current-day watchlist prediction/actual persistence still failed: " + ", ".join(failed))
          PY
