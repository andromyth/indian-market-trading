name: Recover missing ALL-NSE prediction slots

# Post-close repair for slots the live compiler never revisited.
# The live compiler intentionally processes only the newest fresh snapshot, so
# a missed slot stays missing forever. This workflow first re-assembles
# canonical snapshots whose shard uploads succeeded but whose final assembly
# failed, then walks the trading day oldest-first and compiles every snapshot
# whose prediction manifest is not fully supported yet. It runs after the cash
# session, never touches the Cloud Run worker, and never rewrites a slot that
# already has model predictions.

on:
  # 16:20 IST (10:50 UTC) on weekdays, after the 16:05 provider gap backfill
  # (bounded to 12 minutes) and before the 16:30 consolidation. A second slot at
  # 18:50 IST is a late-start fallback: GitHub cron can throttle this repository
  # by hours, but a delayed run still lands after the session and repairs gaps.
  schedule:
    - cron: "50 10,13 * * 1-5"
  # Chain immediately after the backfill workflow so snapshot repair never
  # depends on a second, independently throttled cron entry.
  workflow_run:
    workflows: ["Backfill same-day missing 5m history"]
    types: [completed]
  workflow_dispatch:
    inputs:
      date:
        description: "Trading date to repair (YYYY-MM-DD, default: today IST)"
        required: false
        default: ""
      max_slots:
        description: "Maximum snapshots to compile in this run"
        required: false
        default: "75"

permissions:
  contents: read

concurrency:
  group: recover-missing-prediction-slots
  cancel-in-progress: false

jobs:
  recover-slots:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          project_id: indian-market-trading

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: indian-market-trading

      - name: Set repository import path
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Resolve recovery session date
        id: session
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import date, datetime, time, timedelta
          from zoneinfo import ZoneInfo
          from market_session_guard import is_nse_trading_day

          raw = (os.environ.get("INPUT_DATE") or "").strip()
          if raw:
              session = date.fromisoformat(raw)
          else:
              now = datetime.now(ZoneInfo("Asia/Kolkata"))
              session = now.date()
              if now.time() < time(15, 30):
                  session -= timedelta(days=1)
              while not is_nse_trading_day(session):
                  session -= timedelta(days=1)
          print("date=" + session.isoformat())
          print("trading_day=" + ("true" if is_nse_trading_day(session) else "false"))
          PY

      - name: Ensure same-day provider backfill
        if: steps.session.outputs.trading_day == 'true'
        # Snapshot repair and slot recovery must still run if the provider
        # backfill is deferred (HTTP 423) or temporarily unavailable.
        continue-on-error: true
        env:
          SESSION_DATE: ${{ steps.session.outputs.date }}
          MAX_WAIT_MINUTES: "12"
        run: |
          set -euo pipefail
          python -u scripts/same_day_gap_backfill.py \
            --date "$SESSION_DATE" \
            --max-wait-minutes "$MAX_WAIT_MINUTES"

      - name: Resolve India market date for history cache
        id: market_date
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          value = datetime.now(ZoneInfo("Asia/Kolkata")).strftime("%Y%m%d")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("value=" + value + "\n")
          PY

      - name: Restore Drive history cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/drive_all_nse/history_cache
          key: nse-history-${{ steps.market_date.outputs.value }}
          restore-keys: |
            nse-history-

      - name: Restore consolidated live OHLCV state
        uses: actions/cache/restore@v4
        with:
          path: /tmp/drive_all_nse/live_state
          key: nse-live-${{ steps.market_date.outputs.value }}-${{ github.run_id }}
          restore-keys: |
            nse-live-${{ steps.market_date.outputs.value }}-
            nse-live-

      - name: Re-assemble canonical snapshots from shards or archive
        if: steps.session.outputs.trading_day == 'true'
        env:
          SESSION_DATE: ${{ steps.session.outputs.date }}
        run: |
          set -euo pipefail
          python -u repair_missing_minute_snapshots.py --date "$SESSION_DATE" \
            | tee /tmp/repair_missing_snapshots.log
          grep -q '"repair_status": "COMPLETED"' /tmp/repair_missing_snapshots.log
          echo "::notice::Snapshot repair finished (repair_status=COMPLETED)"

      - name: Compile every unprocessed slot oldest-first
        if: steps.session.outputs.trading_day == 'true'
        env:
          RECOVER_DATE: ${{ steps.session.outputs.date }}
          MAX_SLOTS: ${{ github.event.inputs.max_slots || '75' }}
          ALL_NSE_COMPILER_HISTORY_WORKERS: "24"
        run: |
          set -uo pipefail
          max="${MAX_SLOTS:-75}"
          recovered=0
          skipped=""
          for i in $(seq 1 "$max"); do
            echo "::group::recovery attempt $i"
            if ! ALL_NSE_COMPILER_MODE=recover ALL_NSE_RECOVER_DATE="$RECOVER_DATE" \
              ALL_NSE_RECOVER_SKIP_MINUTES="$skipped" \
              python -u drive_all_nse_prediction_compiler.py 2>&1 | tee "/tmp/recover_$i.log"; then
              echo "recovery attempt $i failed"
              echo "::endgroup::"
              exit 1
            fi
            echo "::endgroup::"
            if grep -q '"status": "RECOVER_COMPLETE"' "/tmp/recover_$i.log"; then
              echo "No unprocessed slots remain."
              break
            fi
            if grep -q '"status": "UNRECOVERABLE_WARMING_HISTORY"' "/tmp/recover_$i.log"; then
              minute_key=$(grep '"status": "UNRECOVERABLE_WARMING_HISTORY"' "/tmp/recover_$i.log" | grep -o '"cycle_minute_key": "[^"]*"' | tail -1 | cut -d'"' -f4)
              if [ -n "$minute_key" ]; then
                skipped="${skipped:+$skipped,}$minute_key"
                echo "Skipped unrecoverable slot $minute_key (missing contiguous 5m history)"
              fi
              continue
            fi
            if ! grep -Eq '"status": "(STORED|NO_PREDICTIONS_EXPECTED)"' "/tmp/recover_$i.log"; then
              echo "Recovery stopped without storing a prediction."
              exit 1
            fi
            recovered=$((recovered + 1))
          done
          echo "Recovered slots in this run: $recovered"
          echo "Skipped unrecoverable slots in this run: $skipped"

      - name: Save updated Drive history cache
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: /tmp/drive_all_nse/history_cache
          key: nse-history-${{ steps.market_date.outputs.value }}

      - name: Save consolidated live OHLCV state
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: /tmp/drive_all_nse/live_state
          key: nse-live-${{ steps.market_date.outputs.value }}-${{ github.run_id }}
