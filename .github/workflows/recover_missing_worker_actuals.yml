name: Backfill missing historical actual candles for saved forecasts
# Recovery only: fetch historic actual bars for symbols already present in the
# prediction ledger. This workflow never creates or edits predictions.
on:
  workflow_dispatch:
    inputs:
      session_date:
        description: "Completed NSE session to backfill (YYYY-MM-DD; blank = latest completed session)"
        required: false
        default: ""
        type: string
      segment:
        description: "Worker ledger segment"
        required: true
        default: "service"
        type: choice
        options:
          - service
          - morning
          - afternoon
          - once
  # Run the initial recovery when this workflow is added to main.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/recover_missing_worker_actuals.yml"

permissions:
  contents: read

concurrency:
  group: historical-worker-actual-backfill
  cancel-in-progress: false

jobs:
  backfill-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
      SESSION_DATE_INPUT: ${{ inputs.session_date || '' }}
      SEGMENT_INPUT: ${{ inputs.segment || 'service' }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Resolve completed NSE session
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$SESSION_DATE_INPUT" ]]; then
            SESSION_DATE="$SESSION_DATE_INPUT"
          else
            SESSION_DATE="$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from market_session_guard import latest_completed_nse_session

          print(latest_completed_nse_session(datetime.now(ZoneInfo("Asia/Kolkata"))).isoformat())
          PY
          )"
          fi
          python - <<PY
          from datetime import date
          print("Resolved session date:", date.fromisoformat("$SESSION_DATE").isoformat())
          PY
          echo "SESSION_DATE=$SESSION_DATE" >> "$GITHUB_ENV"
          echo "SEGMENT=$SEGMENT_INPUT" >> "$GITHUB_ENV"
          echo "Recovery scope: saved predictions only; no retrospective prediction generation."

      - name: Backfill historical 1-minute actual bars for saved forecast symbols
        run: python -u backfill_missing_worker_actuals.py --session-date "$SESSION_DATE" --segment "$SEGMENT"

      - name: Re-evaluate saved forecasts against the recovered actual bars
        shell: bash
        run: |
          set -euo pipefail
          python -u audit_autonomous_intraday_outcomes.py \
            --start-date "$SESSION_DATE" \
            --end-date "$SESSION_DATE" \
            --segment "$SEGMENT" \
            --sync-drive | tee /tmp/backfilled-outcome-audit.log
