name: Repair health diagnostic IAM access

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair_health_diagnostic_iam.yml"

permissions:
  contents: read

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_ID: indian-market-trading
      REGION: asia-south1
      SERVICE: indian-market-intraday-worker
      DIAGNOSTIC_IDENTITY: google-service-account-json@indian-market-trading.iam.gserviceaccount.com
      SCHEDULER_IDENTITY: indian-market-scheduler@indian-market-trading.iam.gserviceaccount.com
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          project_id: indian-market-trading

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: indian-market-trading

      - name: Ensure Cloud Resource Manager API is available
        shell: bash
        run: |
          set -euo pipefail
          STATE="$(gcloud services list --enabled --project="$PROJECT_ID" \
            --filter="config.name=cloudresourcemanager.googleapis.com" \
            --format='value(config.name)')"
          if [[ "$STATE" != "cloudresourcemanager.googleapis.com" ]]; then
            echo "CLOUD_RESOURCE_MANAGER_API_ENABLE_ATTEMPT=true"
            gcloud services enable cloudresourcemanager.googleapis.com --project="$PROJECT_ID" --quiet
            STATE="$(gcloud services list --enabled --project="$PROJECT_ID" \
              --filter="config.name=cloudresourcemanager.googleapis.com" \
              --format='value(config.name)')"
          fi
          [[ "$STATE" == "cloudresourcemanager.googleapis.com" ]] || {
            echo "ERROR: Cloud Resource Manager API is not enabled"
            exit 1
          }
          echo "CLOUD_RESOURCE_MANAGER_API=ENABLED"

      - name: Explain IAM policy checks are validated by least-privilege runtime probes
        shell: bash
        run: |
          set -euo pipefail
          echo "Skipping get-iam-policy inspection: the diagnostic identity is intentionally not granted project-wide IAM-policy read access."
          echo "The following step verifies only the permissions required for diagnostics by performing a real Cloud Logging read and minting an OIDC token for the private service."
          echo "NO_PROJECT_IAM_POLICY_READ_REQUIRED=true"

      - name: Verify log access and private endpoint authentication
        shell: bash
        run: |
          set -euo pipefail
          echo "CHECK=cloud_logging_read"
          gcloud logging read \
            "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"$SERVICE\"" \
            --project="$PROJECT_ID" --limit=1 --format='value(timestamp)' >/dev/null
          echo "CLOUD_LOGGING_ACCESS=PASS"

          echo "CHECK=cloud_run_service_url"
          if ! SERVICE_URL="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"; then
            echo "ERROR=cloud_run_services_describe_failed"
            exit 1
          fi
          [[ "$SERVICE_URL" == https://* ]] || { echo "ERROR=cloud_run_service_url_missing"; exit 1; }
          echo "CLOUD_RUN_SERVICE_URL=RESOLVED"

          echo "CHECK=scheduler_oidc_token_mint"
          TOKEN_RESPONSE="$(mktemp)"
          RESPONSE="$(mktemp)"
          trap 'rm -f "$TOKEN_RESPONSE" "$RESPONSE"' EXIT
          CALLER_ACCESS_TOKEN="$(gcloud auth print-access-token)"
          [[ -n "$CALLER_ACCESS_TOKEN" ]] || { echo "ERROR=caller_access_token_empty"; exit 1; }
          TOKEN_HTTP_CODE="$(curl --silent --show-error --connect-timeout 10 --max-time 25 \
            --output "$TOKEN_RESPONSE" --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $CALLER_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(python -c 'import json,sys; print(json.dumps({"audience":sys.argv[1],"includeEmail":True}))' "$SERVICE_URL")" \
            "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/$SCHEDULER_IDENTITY:generateIdToken")" || {
              unset CALLER_ACCESS_TOKEN
              echo "ERROR=oidc_token_api_request_failed"
              exit 1
            }
          unset CALLER_ACCESS_TOKEN
          if [[ "$TOKEN_HTTP_CODE" != "200" ]]; then
            echo "ERROR=oidc_token_api_rejected http=$TOKEN_HTTP_CODE"
            python - "$TOKEN_RESPONSE" <<'PY'
          import json, sys
          try:
              body = json.load(open(sys.argv[1], encoding="utf-8"))
              error = body.get("error", {})
              print("IAM_CREDENTIALS_ERROR=" + str(error.get("status", "UNKNOWN")) + ": " + str(error.get("message", "No error message returned")))
          except Exception:
              print("IAM_CREDENTIALS_ERROR=response was not valid JSON")
          PY
            exit 1
          fi
          TOKEN="$(python - "$TOKEN_RESPONSE" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              body = json.load(handle)
          token = body.get("token") or body.get("idToken")
          if not token:
              error = body.get("error", {})
              raise SystemExit("OIDC_TOKEN_MISSING: " + str(error.get("message", "response did not contain an ID token")))
          print(token)
          PY
          )"
          [[ -n "$TOKEN" ]] || { echo "ERROR=oidc_token_empty"; exit 1; }
          echo "SCHEDULER_OIDC_TOKEN_MINT=PASS method=iamcredentials.generateIdToken"
          unset TOKEN
          # Keep the token only in memory for the authenticated endpoint probes.
          TOKEN="$(python - "$TOKEN_RESPONSE" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              body = json.load(handle)
          print(body.get("token") or body.get("idToken") or "")
          PY
          )"
          for endpoint in capturez predictionz; do
            echo "CHECK=private_endpoint_$endpoint"
            if ! CODE="$(curl --silent --show-error --connect-timeout 10 --max-time 25 \
              -H "Authorization: Bearer $TOKEN" -H "Accept: application/json" \
              --output "$RESPONSE" --write-out '%{http_code}' "$SERVICE_URL/$endpoint")"; then
              echo "ERROR=endpoint_request_failed endpoint=/$endpoint"
              exit 1
            fi
            python - "$RESPONSE" "$endpoint" "$CODE" <<'PY'
          import json, sys
          path, endpoint, code = sys.argv[1:]
          try:
              with open(path, encoding="utf-8") as handle:
                  body = json.load(handle)
          except Exception as exc:
              raise SystemExit(f"ENDPOINT_RESPONSE_NOT_JSON endpoint=/{endpoint} http={code} error={exc}")
          expected = "all_nse_quote_capture" if endpoint == "capturez" else "all_nse_minute_prediction_actual"
          if body.get("probe") != expected:
              raise SystemExit(f"ENDPOINT_PROBE_MISMATCH endpoint=/{endpoint} http={code} keys={sorted(body) if isinstance(body, dict) else type(body).__name__}")
          print(f"ENDPOINT_AUTH=PASS endpoint=/{endpoint} http={code} diagnostic_status={body.get('status')}")
          if code not in {"200", "503"}:
              raise SystemExit(f"UNEXPECTED_HTTP_STATUS endpoint=/{endpoint} http={code}")
          PY
          done
          echo "IAM_DIAGNOSTIC_REPAIR=PASS"
