name: Repair verified native 5-minute checkpoint manifests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair_native_5m_checkpoint_manifests.yml"

permissions:
  contents: read

concurrency:
  group: repair-native-5m-checkpoint-manifests
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Drive and Parquet dependencies
        run: python -m pip install --quiet pandas pyarrow google-api-python-client google-auth

      - name: Reconstruct only cryptographically verified checkpoint manifests
        env:
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
        run: python scripts/repair_native_5m_checkpoint_manifests.py
