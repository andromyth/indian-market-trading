name: Repair verified native 5-minute checkpoint manifests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair_native_5m_checkpoint_manifests.yml"

permissions:
  contents: read

concurrency:
  group: repair-native-5m-checkpoint-manifests
  cancel-in-progress: false

jobs:
  repair-and-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PROJECT_ID: indian-market-trading
      REGION: asia-south1
      SERVICE: indian-market-intraday-worker
      INVOKER: indian-market-scheduler@indian-market-trading.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          project_id: indian-market-trading

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: indian-market-trading

      - name: Install Drive and Parquet dependencies
        run: python -m pip install --quiet pandas pyarrow google-api-python-client google-auth

      - name: Reconstruct only cryptographically verified checkpoint manifests
        env:
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
        run: python scripts/repair_native_5m_checkpoint_manifests.py

      - name: Resume the existing private Cloud Run backfill if it is idle
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          [[ "$SERVICE_URL" == https://* ]] || { echo "ERROR=cloud_run_service_url_missing"; exit 1; }
          RESPONSE="$(mktemp)"
          trap 'rm -f "$RESPONSE"; unset TOKEN' EXIT
          CALLER=""
          HTTP_CODE=""
          for SA in "SELF" "$INVOKER" "intraday-scheduler@$PROJECT_ID.iam.gserviceaccount.com"; do
            if [[ "$SA" == "SELF" ]]; then
              TOKEN="$(gcloud auth print-identity-token --audiences="$SERVICE_URL" 2>/dev/null)" || TOKEN=""
            else
              TOKEN="$(gcloud auth print-identity-token --impersonate-service-account="$SA" --audiences="$SERVICE_URL" 2>/dev/null)" || TOKEN=""
            fi
            [[ -n "$TOKEN" ]] || continue
            HTTP_CODE="$(curl --silent --show-error --connect-timeout 10 --max-time 25 \
              -H "Authorization: Bearer $TOKEN" -H "Accept: application/json" \
              --output "$RESPONSE" --write-out '%{http_code}' "$SERVICE_URL/backfillz")" || HTTP_CODE=000
            if [[ "$HTTP_CODE" == "200" ]]; then
              CALLER="$SA"
              break
            fi
          done
          [[ -n "$CALLER" ]] || { echo "ERROR=private_backfill_status_endpoint_not_accessible http=$HTTP_CODE"; cat "$RESPONSE"; exit 1; }

          PUBLIC_CODE="$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
            --output /dev/null --write-out '%{http_code}' "$SERVICE_URL/backfillz")" || PUBLIC_CODE=000
          if [[ "$PUBLIC_CODE" == "200" ]]; then
            echo "ERROR=cloud_run_service_is_public_refusing_to_start_backfill"
            exit 1
          fi
          if [[ "$PUBLIC_CODE" != "401" && "$PUBLIC_CODE" != "403" && "$PUBLIC_CODE" != "404" ]]; then
            echo "ERROR=unauthenticated_private_service_check_failed http=$PUBLIC_CODE"
            exit 1
          fi
          echo "CLOUD_RUN_UNAUTHENTICATED_ACCESS=BLOCKED http=$PUBLIC_CODE"

          STATE="$(python - "$RESPONSE" <<'PY'
          import json,sys
          body=json.load(open(sys.argv[1],encoding="utf-8"))
          state=body.get("five_minute_backfill") or {}
          print(state.get("status") or body.get("status") or "UNKNOWN")
          PY
          )"
          echo "BACKFILL_STATE_BEFORE=$STATE"
          if [[ "$STATE" == "RUNNING" || "$STATE" == "PAUSED_FOR_LIVE_MARKET" ]]; then
            echo "BACKFILL_ACTION=ALREADY_ACTIVE"
            exit 0
          fi
          [[ "$STATE" != "UNKNOWN" ]] || { echo "ERROR=unrecognized_backfill_state"; cat "$RESPONSE"; exit 1; }

          if [[ "$CALLER" == "SELF" ]]; then
            TOKEN="$(gcloud auth print-identity-token --audiences="$SERVICE_URL" 2>/dev/null)" || TOKEN=""
          else
            TOKEN="$(gcloud auth print-identity-token --impersonate-service-account="$CALLER" --audiences="$SERVICE_URL" 2>/dev/null)" || TOKEN=""
          fi
          [[ -n "$TOKEN" ]] || { echo "ERROR=invoker_identity_token_unavailable"; exit 1; }
          CODE="$(curl --silent --show-error --connect-timeout 10 --max-time 25 \
            -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data '{"confirm":"START_NATIVE_5M_BACKFILL"}' \
            --output "$RESPONSE" --write-out '%{http_code}' "$SERVICE_URL/backfill")" || CODE=000
          python - "$RESPONSE" "$CODE" <<'PY'
          import json,sys
          path,code=sys.argv[1:]
          try:
              body=json.load(open(path,encoding="utf-8"))
          except Exception:
              raise SystemExit("BACKFILL_START_RESPONSE_INVALID_JSON http="+code)
          print("BACKFILL_START_RESULT="+json.dumps({
              "http_status":code,
              "status":body.get("status"),
              "status_endpoint":body.get("status_endpoint"),
              "note":body.get("note"),
          },sort_keys=True))
          if code=="202" and body.get("status")=="BACKFILL_STARTED":
              raise SystemExit(0)
          if code=="409" and body.get("status")=="BACKFILL_ALREADY_RUNNING":
              state=body.get("five_minute_backfill") or {}
              if state.get("status") in {"RUNNING","PAUSED_FOR_LIVE_MARKET"}:
                  raise SystemExit(0)
          raise SystemExit("BACKFILL_START_FAILED http="+code+" status="+str(body.get("status")))
          PY
