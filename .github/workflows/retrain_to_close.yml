name: Retrain to-close champion (Cloud Run)

on:
  workflow_dispatch:
    inputs:
      universe:
        description: "all = every backfilled symbol (default); fno = only F&O underlyings"
        required: false
        default: "all"
        type: choice
        options: ["fno", "all"]
      sessions:
        description: "Maximum sessions retained per symbol"
        required: false
        default: "500"
      max_symbols:
        description: "Maximum symbols downloaded/trained (0 = no cap)"
        required: false
        default: "500"
      cost:
        description: "Assumed round-trip cost + slippage (0.0011 = 11 bps)"
        required: false
        default: "0.0011"
      warmup_bars:
        description: "3 = first decision 09:35"
        required: false
        default: "3"
      consolidate_live_days:
        description: "Trading-day lookback for the pre-training live-snapshot consolidation (0 disables)"
        required: false
        default: "5"
      session_date:
        description: "Optional NSE session to backfill before training (YYYY-MM-DD)"
        required: false
        default: ""
      skip_gap_backfill:
        description: "Skip the same-day provider gap backfill step (no Cloud Run invocation)"
        required: false
        type: boolean
        default: false
      allow_stale_archive:
        description: "Continue training when a five-minute slot is missing (archive-only run)"
        required: false
        type: boolean
        default: false
  # Nightly retrain at 20:15 IST (14:45 UTC), after the 19:15 IST F&O sync. Enabled after the
  # first two manual runs passed. Set the repo variable RETRAIN_SCHEDULE=off to pause it.
  schedule:
    - cron: "45 14 * * 1-5"

permissions:
  contents: read
  actions: read

concurrency:
  group: retrain-to-close
  cancel-in-progress: false

jobs:
  deploy-and-run:
    # Pause the nightly run without editing code: set repo variable RETRAIN_SCHEDULE=off.
    if: github.event_name != 'schedule' || vars.RETRAIN_SCHEDULE != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PROJECT_ID: indian-market-trading
      REGION: asia-south1
      JOB: to-close-retrain
      IMAGE_REPO: asia-south1-docker.pkg.dev/indian-market-trading/cloud-run-source-deploy
      UNIVERSE: ${{ inputs.universe || 'all' }}
      SESSIONS: ${{ inputs.sessions || '500' }}
      MAX_SYMBOLS: ${{ inputs.max_symbols || '500' }}
      COST: ${{ inputs.cost || '0.0011' }}
      WARMUP_BARS: ${{ inputs.warmup_bars || '3' }}
      CONSOLIDATE_LIVE_DAYS: ${{ inputs.consolidate_live_days || '5' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          project_id: indian-market-trading

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: indian-market-trading

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Collect the same-day provider gaps before consolidation and training.
      # A deferred run (HTTP 423) exits cleanly; the coverage gate below will
      # still block training if the archive is genuinely incomplete.
      - name: Collect same-day missing 5m bars
        if: ${{ !inputs.skip_gap_backfill }}
        shell: bash
        continue-on-error: true
        env:
          SESSION_DATE: ${{ inputs.session_date }}
          MAX_WAIT_MINUTES: "12"
        run: |
          set -euo pipefail
          args=(--max-wait-minutes "$MAX_WAIT_MINUTES")
          if [ -n "${SESSION_DATE:-}" ]; then
            args+=(--date "$SESSION_DATE")
          fi
          python -u scripts/same_day_gap_backfill.py "${args[@]}"

      - name: Build training image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$IMAGE_REPO/to-close-retrain:$GITHUB_SHA"
          echo "TRAIN_IMAGE=$IMAGE"
          gcloud builds submit \
            --project="$PROJECT_ID" \
            --config=cloudbuild-backfill-job.yaml \
            --substitutions="_IMAGE=$IMAGE" \
            .

      - name: Deploy Cloud Run training job
        shell: bash
        env:
          ALLOW_STALE_ARCHIVE: ${{ inputs.allow_stale_archive }}
        run: |
          set -euo pipefail
          IMAGE="$IMAGE_REPO/to-close-retrain:$GITHUB_SHA"
          EXTRA_ARGS=""
          if [ "${ALLOW_STALE_ARCHIVE:-false}" = "true" ]; then
            EXTRA_ARGS=",--allow-stale-archive"
          fi
          gcloud run jobs deploy "$JOB" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$IMAGE" \
            --service-account "indian-market-intraday-runtime@$PROJECT_ID.iam.gserviceaccount.com" \
            --cpu 8 --memory 32Gi --task-timeout 86400 --max-retries 0 \
            --command python \
            --args="-u,retrain_to_close_job.py,--universe=$UNIVERSE,--sessions=$SESSIONS,--max-symbols=$MAX_SYMBOLS,--cost=$COST,--warmup-bars=$WARMUP_BARS,--consolidate-live-days=$CONSOLIDATE_LIVE_DAYS$EXTRA_ARGS" \
            --set-secrets "GOOGLE_DRIVE_ROOT_ID=google-drive-root-id:latest,GDRIVE_ROOT_FOLDER_ID=google-drive-root-id:latest,GOOGLE_OAUTH_TOKEN_JSON=google-oauth-token-json:latest"
          gcloud run jobs describe "$JOB" \
            --project="$PROJECT_ID" --region="$REGION" \
            --format='yaml(spec.template.spec.template.spec.containers[0].image,spec.template.spec.template.spec.containers[0].args,spec.template.spec.template.spec.timeoutSeconds,spec.template.spec.template.spec.maxRetries,spec.template.spec.template.spec.serviceAccountName)'

      - name: Run training job and wait
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs execute "$JOB" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --wait
          gcloud run jobs executions list \
            --job="$JOB" --project="$PROJECT_ID" --region="$REGION" \
            --limit=1 \
            --format='table(name,status.startTime,status.completionTime,status.conditions[0].status,status.conditions[0].message)'

      - name: Show recent training logs
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          gcloud logging read \
            "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$JOB\"" \
            --project="$PROJECT_ID" --limit=120 --order=desc \
            --format='value(timestamp,textPayload)' 2>/dev/null \
            | grep -aE "RETRAIN_STATUS|RETRAIN_CONSOLIDATION|CONSOLIDATE_INCOMPLETE_SESSION|TRAIN_UNIVERSE|DATA_NOT_READY|TRAIN_FAILED|Traceback|COMPLETED_|UPLOAD_FAILED" || true
