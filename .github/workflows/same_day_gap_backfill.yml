name: Backfill same-day missing 5m history

# Runs at the end of every NSE trading session (after the 15:30 cash close and
# 15:32 Cloud Run finalize/backfill trigger) and before consolidation. It
# discovers missing 5m live history, warming prediction slots, and missing
# canonical daily snapshots, triggers the private Cloud Run provider backfill
# (the only authorized caller to INDstocks API), and automatically
# reconstructs/repairs missing canonical snapshots from genuine provider archive bars.
# It never touches the live Cloud Run worker during market hours.
on:
  schedule:
    # 15:35 IST (10:05 UTC) right after the 15:30 cash close and 15:32 Cloud Run
    # finalize tick, plus fallback slots because GitHub cron can throttle.
    - cron: "5 10 * * 1-5"
    - cron: "35 10,12,14 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Trading date YYYY-MM-DD (default: latest completed session)"
        required: false
        default: ""
      max_wait_minutes:
        description: "Maximum minutes to wait for provider backfill"
        required: false
        default: "12"
      repair_snapshots:
        description: "Repair missing canonical snapshots after backfill"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: same-day-gap-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      PROJECT_ID: indian-market-trading
      REGION: asia-south1
      SERVICE: indian-market-intraday-worker
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve session date
        id: session
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import date, datetime, time, timedelta
          from zoneinfo import ZoneInfo
          from market_session_guard import is_nse_trading_day

          raw = (os.environ.get("INPUT_DATE") or "").strip()
          if raw:
              session = date.fromisoformat(raw)
          else:
              now = datetime.now(ZoneInfo("Asia/Kolkata"))
              session = now.date()
              if now.time() < time(9, 15):
                  session -= timedelta(days=1)
              while not is_nse_trading_day(session):
                  session -= timedelta(days=1)
          print("date=" + session.isoformat())
          print("trading_day=" + ("true" if is_nse_trading_day(session) else "false"))
          PY

      - name: Authenticate to Google Cloud
        if: steps.session.outputs.trading_day == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          project_id: indian-market-trading

      - name: Set up gcloud
        if: steps.session.outputs.trading_day == 'true'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: indian-market-trading

      - name: Discover gaps and backfill missing provider bars
        if: steps.session.outputs.trading_day == 'true'
        env:
          SESSION_DATE: ${{ steps.session.outputs.date }}
          MAX_WAIT_MINUTES: ${{ github.event.inputs.max_wait_minutes || '12' }}
          REPAIR_SNAPSHOTS: ${{ github.event.inputs.repair_snapshots != 'false' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          REPAIR_FLAG="--repair-snapshots"
          if [ "$REPAIR_SNAPSHOTS" = "false" ]; then
            REPAIR_FLAG="--no-repair-snapshots"
          fi
          python -u scripts/same_day_gap_backfill.py \
            --date "$SESSION_DATE" \
            --max-wait-minutes "$MAX_WAIT_MINUTES" \
            "$REPAIR_FLAG" \
            | tee /tmp/same_day_gap_backfill.log
