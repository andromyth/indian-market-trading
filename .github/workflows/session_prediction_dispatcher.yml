name: Session prediction supervisor

# Opt-in recovery + health supervision for the ALL-NSE five-minute prediction
# compiler. GitHub cron throttles this repository's scheduled workflows by hours
# (observed 2026-11-09..13: compiler schedules only fired after 17:00 IST), so
# this workflow dispatches the compiler on every five-minute boundary and posts
# a read-only Drive health report every thirty minutes.
#
# Same-slot predictions are produced by the Cloud Run tick; this lane only
# repairs slots the tick could not store and publishes session health.
# It never touches the Cloud Run worker.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "health (default, read-only single check) or supervise (long runner, not for normal use)"
        required: false
        default: health
  # GitHub throttles this repository's crons, but a late start is still useful:
  # the loop derives its next boundary from the wall clock, so any firing during
  # the session resumes gap-filling and publishes health. Predictions themselves
  # are produced by the Cloud Run tick; this is the repair + monitoring lane.
  schedule:
    - cron: "5,35 3-10 * * 1-5"

permissions:
  contents: write
  actions: write

jobs:
  supervise-morning:
    if: github.event.inputs.mode != 'health'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    # Job-level so a read-only "health" dispatch never cancels the supervisor.
    # Latest supervisor wins: a re-dispatch cancels the stale runner instead of
    # leaving two loops dispatching the same compiler every five minutes.
    concurrency:
      group: session-prediction-supervisor
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      WINDOW_START_IST: "09:20"
      WINDOW_END_IST: "12:05"
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Drive audit dependencies
        run: >-
          python -m pip install --quiet --disable-pip-version-check -r requirements.txt

      - name: Dispatch compiler and verify Drive persistence (morning half)
        run: |
          python -u - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time
          import urllib.request
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          IST = ZoneInfo("Asia/Kolkata")
          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          start_h, start_m = (int(x) for x in os.environ["WINDOW_START_IST"].split(":"))
          end_h, end_m = (int(x) for x in os.environ["WINDOW_END_IST"].split(":"))
          url = (
              f"https://api.github.com/repos/{repo}/actions/workflows/"
              "compile_all_nse_predictions_from_drive.yml/dispatches"
          )

          def next_slot(now):
              base = now.replace(second=0, microsecond=0)
              minute = (base.minute // 5 + 1) * 5
              target = base.replace(minute=0) + timedelta(hours=1) if minute >= 60 else base.replace(minute=minute)
              if (target.hour, target.minute) < (start_h, start_m):
                  target = target.replace(hour=start_h, minute=start_m)
              return target

          def dispatch():
              request = urllib.request.Request(
                  url,
                  data=json.dumps({"ref": "main"}).encode(),
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.status

          def busy():
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/workflows/"
                  "compile_all_nse_predictions_from_drive.yml/runs?status=in_progress&per_page=1",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.loads(response.read() or b"{}")
              return bool(payload.get("workflow_runs"))

          def health():
              result = subprocess.run(
                  [sys.executable, "-u", "scripts/session_prediction_health.py"],
                  capture_output=True,
                  text=True,
              )
              line = next(
                  (l for l in result.stdout.splitlines() if l.startswith("SESSION_HEALTH_JSON=")),
                  None,
              )
              print("HEALTH_STAMP", datetime.now(IST).isoformat(), flush=True)
              print(line or ("HEALTH_ERROR " + (result.stderr or "")[-400:]), flush=True)
              if line:
                  payload = line.split("=", 1)[1] if line.startswith("SESSION_HEALTH_JSON=") else line
                  with open("/tmp/session_health.json", "w") as fh:
                      fh.write(payload)
                  pub = subprocess.run(
                      [sys.executable, "scripts/session_health_publish.py", "/tmp/session_health.json"],
                      capture_output=True,
                      text=True,
                  )
                  print("HEALTH_PUBLISH", pub.returncode, (pub.stdout or "").strip()[:200], (pub.stderr or "").strip()[:300], flush=True)

          health()

          while True:
              now = datetime.now(IST)
              if now.weekday() >= 5:
                  print("WEEKEND_STOP", now.isoformat(), flush=True)
                  break
              target = next_slot(now)
              if (target.hour, target.minute) > (end_h, end_m):
                  print("WINDOW_COMPLETE", now.isoformat(), flush=True)
                  break
              delay = (target + timedelta(seconds=40) - now).total_seconds()
              if delay > 0:
                  time.sleep(delay)
              stamp = datetime.now(IST).isoformat()
              try:
                  if busy():
                      print("DISPATCH_SKIPPED_BUSY", stamp, flush=True)
                  else:
                      print("DISPATCH", stamp, dispatch(), flush=True)
              except Exception as exc:
                  print("DISPATCH_ERROR", stamp, type(exc).__name__, str(exc)[:200], flush=True)
              if target.minute % 30 == 0:
                  health()
          health()
          PY

  supervise-afternoon:
    if: github.event.inputs.mode != 'health'
    runs-on: ubuntu-latest
    # Covers 12:10 through the 15:25 slot plus the closing verification even
    # when the run starts early in the morning half.
    timeout-minutes: 280
    concurrency:
      group: session-prediction-supervisor-afternoon
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      WINDOW_START_IST: "12:10"
      WINDOW_END_IST: "15:25"
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Drive audit dependencies
        run: >-
          python -m pip install --quiet --disable-pip-version-check -r requirements.txt

      - name: Dispatch compiler and verify Drive persistence (afternoon half)
        run: |
          python -u - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time
          import urllib.request
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          IST = ZoneInfo("Asia/Kolkata")
          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          start_h, start_m = (int(x) for x in os.environ["WINDOW_START_IST"].split(":"))
          end_h, end_m = (int(x) for x in os.environ["WINDOW_END_IST"].split(":"))
          url = (
              f"https://api.github.com/repos/{repo}/actions/workflows/"
              "compile_all_nse_predictions_from_drive.yml/dispatches"
          )

          def next_slot(now):
              base = now.replace(second=0, microsecond=0)
              minute = (base.minute // 5 + 1) * 5
              target = base.replace(minute=0) + timedelta(hours=1) if minute >= 60 else base.replace(minute=minute)
              if (target.hour, target.minute) < (start_h, start_m):
                  target = target.replace(hour=start_h, minute=start_m)
              return target

          def dispatch():
              request = urllib.request.Request(
                  url,
                  data=json.dumps({"ref": "main"}).encode(),
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.status

          def publish(line):
              try:
                  payload = line.split("=", 1)[1] if line.startswith("SESSION_HEALTH_JSON=") else line
                  json.loads(payload)
              except Exception as exc:
                  print("HEALTH_PUBLISH_SKIP", type(exc).__name__, flush=True)
                  return
              root = "health/session_health"
              os.makedirs(root, exist_ok=True)
              with open(os.path.join(root, "latest.json"), "w") as fh:
                  fh.write(payload + "\n")
              with open(os.path.join(root, "history.jsonl"), "a") as fh:
                  fh.write(json.dumps({"recorded_at_ist": datetime.now(IST).isoformat(), "health": json.loads(payload)}, default=str) + "\n")
              env = dict(os.environ)
              env.update({
                  "GIT_AUTHOR_NAME": "session-health-bot",
                  "GIT_AUTHOR_EMAIL": "session-health-bot@users.noreply.github.com",
                  "GIT_COMMITTER_NAME": "session-health-bot",
                  "GIT_COMMITTER_EMAIL": "session-health-bot@users.noreply.github.com",
              })
              subprocess.run(["git", "-C", "health", "pull", "--quiet", "--rebase", "--autostash"], env=env, check=False)
              subprocess.run(["git", "-C", "health", "add", "-A"], env=env, check=False)
              subprocess.run(["git", "-C", "health", "commit", "-q", "-m", "Session health " + datetime.now(IST).strftime("%Y-%m-%d %H:%M IST")], env=env, check=False)
              for attempt in range(2):
                  push = subprocess.run(["git", "-C", "health", "push", "--quiet", "origin", "session-health"], env=env, capture_output=True, text=True)
                  if push.returncode == 0:
                      break
                  subprocess.run(["git", "-C", "health", "pull", "--quiet", "--rebase", "--autostash"], env=env, check=False)
              print("HEALTH_PUBLISH", push.returncode, (push.stderr or "").strip()[:300], flush=True)

          def busy():
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/workflows/"
                  "compile_all_nse_predictions_from_drive.yml/runs?status=in_progress&per_page=1",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.loads(response.read() or b"{}")
              return bool(payload.get("workflow_runs"))

          def health():
              result = subprocess.run(
                  [sys.executable, "-u", "scripts/session_prediction_health.py"],
                  capture_output=True,
                  text=True,
              )
              line = next(
                  (l for l in result.stdout.splitlines() if l.startswith("SESSION_HEALTH_JSON=")),
                  None,
              )
              print("HEALTH_STAMP", datetime.now(IST).isoformat(), flush=True)
              print(line or ("HEALTH_ERROR " + (result.stderr or "")[-400:]), flush=True)
              if line:
                  payload = line.split("=", 1)[1] if line.startswith("SESSION_HEALTH_JSON=") else line
                  with open("/tmp/session_health.json", "w") as fh:
                      fh.write(payload)
                  pub = subprocess.run(
                      [sys.executable, "scripts/session_health_publish.py", "/tmp/session_health.json"],
                      capture_output=True,
                      text=True,
                  )
                  print("HEALTH_PUBLISH", pub.returncode, (pub.stdout or "").strip()[:200], (pub.stderr or "").strip()[:300], flush=True)

          health()

          while True:
              now = datetime.now(IST)
              if now.weekday() >= 5:
                  print("WEEKEND_STOP", now.isoformat(), flush=True)
                  break
              target = next_slot(now)
              if (target.hour, target.minute) > (end_h, end_m):
                  print("WINDOW_COMPLETE", now.isoformat(), flush=True)
                  break
              delay = (target + timedelta(seconds=40) - now).total_seconds()
              if delay > 0:
                  time.sleep(delay)
              stamp = datetime.now(IST).isoformat()
              try:
                  if busy():
                      print("DISPATCH_SKIPPED_BUSY", stamp, flush=True)
                  else:
                      print("DISPATCH", stamp, dispatch(), flush=True)
              except Exception as exc:
                  print("DISPATCH_ERROR", stamp, type(exc).__name__, str(exc)[:200], flush=True)
              if target.minute % 30 == 0:
                  health()
          # Closing slot: 15:25 capture is durably stored just after 15:25.
          now = datetime.now(IST)
          closing = now.replace(hour=15, minute=28, second=0, microsecond=0)
          if now < closing:
              time.sleep((closing - now).total_seconds())
          try:
              print("CLOSING_DISPATCH", datetime.now(IST).isoformat(), dispatch(), flush=True)
          except Exception as exc:
              print("CLOSING_DISPATCH_ERROR", type(exc).__name__, str(exc)[:200], flush=True)
          time.sleep(150)
          health()
          PY

  health-once:
    if: github.event.inputs.mode == 'health'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Drive audit dependencies
        run: python -m pip install --quiet --disable-pip-version-check -r requirements.txt

      - name: Read-only Drive health check
        run: |
          python -u scripts/session_prediction_health.py | tee /tmp/health.log
          grep SESSION_HEALTH_JSON /tmp/health.log | sed 's/^SESSION_HEALTH_JSON=//' > /tmp/session_health.json
          python -u scripts/session_health_publish.py /tmp/session_health.json
