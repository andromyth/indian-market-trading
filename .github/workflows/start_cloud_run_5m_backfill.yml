name: Start Cloud Run native five-minute history backfill

on:
  workflow_dispatch:
    inputs:
      confirm_backfill:
        description: "Explicitly authorize the resumable ALL-NSE native five-minute history backfill"
        type: choice
        required: true
        default: "no"
        options:
          - "no"
          - "yes"
      end_date:
        description: "Inclusive backfill end date in IST (a bare date means that session's 15:30 close)"
        type: string
        required: false
        default: "2026-11-18"
      replace_existing_history:
        description: "Replace legacy bars that lack normalized date definitions (auto replaces once when the schema changes)"
        type: choice
        required: false
        default: "auto"
        options:
          - "auto"
          - "yes"
          - "no"
      revision_tag:
        description: "Optional Cloud Run traffic tag to target (e.g. preflight5m) instead of production, to run a staged revision without promoting it"
        type: string
        required: false
        default: ""
  # Fully automated off-hours trigger. 10:30 UTC is 16:00 IST, when the
  # backfill window opens on NSE trading days; non-trading days are eligible
  # all day, and the Cloud Run guard still pauses 09:15-15:59 IST.
  schedule:
    - cron: "30 10 * * *"
permissions:
  contents: read
  actions: read

concurrency:
  group: start-cloud-run-native-5m-backfill
  cancel-in-progress: false

jobs:
  start-backfill:
    if: (github.event_name == 'workflow_dispatch' && inputs.confirm_backfill == 'yes') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[start-native-5m-backfill]')) || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PROJECT_ID: indian-market-trading
      REGION: asia-south1
      SERVICE: indian-market-intraday-worker
      INVOKER: indian-market-scheduler@indian-market-trading.iam.gserviceaccount.com
      BACKFILL_END_DATE: ${{ inputs.end_date || '2026-11-18' }}
      BACKFILL_REPLACE_EXISTING: ${{ inputs.replace_existing_history || 'auto' }}
      BACKFILL_REVISION_TAG: ${{ inputs.revision_tag || (github.event_name == 'schedule' && 'preflight5m') || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate backfill by NSE trading calendar and 16:00 IST start
        id: schedule_gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from nse_trading_calendar import is_nse_trading_day

          now = datetime.now(ZoneInfo("Asia/Kolkata"))
          trading_day = is_nse_trading_day(now.date())
          allowed = (not trading_day) or (now.hour, now.minute) >= (16, 0)
          reason = (
              "NSE trading day before 16:00 IST: backfill is not eligible"
              if trading_day and not allowed
              else "NSE non-trading day: backfill is eligible all day"
              if not trading_day
              else "NSE trading day at or after 16:00 IST: backfill is eligible"
          )
          print(f"IST_NOW={now.isoformat()} TRADING_DAY={trading_day} ALLOWED={allowed} REASON={reason}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("should_run=" + ("true" if allowed else "false") + "\n")
          PY

      - name: Require successful deployment when worker code changed
        if: github.event_name == 'push' && steps.schedule_gate.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_DEPLOY_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED_PATHS < <(git diff --name-only "${EXPECTED_DEPLOY_SHA}^" "$GITHUB_SHA")
          if [[ "${#CHANGED_PATHS[@]}" -eq 1 && "${CHANGED_PATHS[0]}" == ".github/workflows/start_cloud_run_5m_backfill.yml" ]]; then
            echo "DEPLOY_GATE=SKIPPED_WORKFLOW_ONLY_CHANGE"
            exit 0
          fi
          for attempt in $(seq 1 90); do
            RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy_intraday_worker_recovery.yml/runs?branch=main&head_sha=${EXPECTED_DEPLOY_SHA}&per_page=20")"
            MATCH="$(printf '%s' "$RUNS" | python -c 'import json,os,sys; sha=os.environ["EXPECTED_DEPLOY_SHA"]; runs=[r for r in json.load(sys.stdin).get("workflow_runs",[]) if r.get("head_sha")==sha]; print(json.dumps(max(runs,key=lambda r:r.get("created_at","")) if runs else {}))')"
            RUN_ID="$(printf '%s' "$MATCH" | python -c 'import json,sys; print(json.load(sys.stdin).get("id",""))')"
            STATUS="$(printf '%s' "$MATCH" | python -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')"
            CONCLUSION="$(printf '%s' "$MATCH" | python -c 'import json,sys; print(json.load(sys.stdin).get("conclusion",""))')"
            if [[ -n "$RUN_ID" ]]; then
              echo "DEPLOY_RUN_ID=$RUN_ID STATUS=$STATUS CONCLUSION=$CONCLUSION"
              if [[ "$STATUS" == "completed" ]]; then
                [[ "$CONCLUSION" == "success" ]] || { echo "Backfill start blocked: previous commit deployment failed."; exit 1; }
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Backfill start blocked: timed out waiting for this commit's worker deployment."
          exit 1

      - name: Authenticate to Google Cloud
        if: steps.schedule_gate.outputs.should_run == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          project_id: indian-market-trading

      - name: Set up gcloud
        if: steps.schedule_gate.outputs.should_run == 'true'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: indian-market-trading

      # Immediate post-deploy kickoff: the marker commit is gated on the prior deploy.
      - name: Wait for the deployed private backfill endpoint
        if: steps.schedule_gate.outputs.should_run == 'true'
        id: endpoint
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          [[ "$SERVICE_URL" == https://* ]] || { echo "ERROR=cloud_run_service_url_missing"; exit 1; }
          AUDIENCE_URL="$SERVICE_URL"
          RESPONSE="$(mktemp)"
          SERVICE_JSON="$(mktemp)"
          trap 'rm -f "$RESPONSE" "$SERVICE_JSON"; unset TOKEN' EXIT
          TARGET_TAG="${BACKFILL_REVISION_TAG:-}"
          if [[ -n "$TARGET_TAG" ]]; then
            [[ "$TARGET_TAG" =~ ^[A-Za-z0-9-]+$ ]] || { echo "ERROR=invalid_revision_tag"; exit 1; }
            gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format=json > "$SERVICE_JSON"
            SERVICE_URL="$(python - "$SERVICE_JSON" "$TARGET_TAG" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          tag = sys.argv[2]
          rows = (data.get("status") or {}).get("traffic") or []
          print(next((row.get("url", "") for row in rows if row.get("tag") == tag), ""))
          PY
            )"
            if [[ "$SERVICE_URL" != https://* ]]; then
              echo "ERROR=cloud_run_revision_tag_url_missing tag=$TARGET_TAG"
              python - "$SERVICE_JSON" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          rows = (data.get("status") or {}).get("traffic") or []
          print("AVAILABLE_TRAFFIC=" + json.dumps([
              {key: row.get(key) for key in ("tag", "url", "revisionName", "percent")}
              for row in rows
          ]))
          PY
              exit 1
            fi
            echo "TARGETING_STAGED_REVISION_TAG=$TARGET_TAG url=$SERVICE_URL"
          fi
          CALLER_IDENTITY=""
          for attempt in $(seq 1 60); do
            ROUTE_WAIT=false
            for SA in "SELF" "$INVOKER" "intraday-scheduler@$PROJECT_ID.iam.gserviceaccount.com"; do
              if [[ "$SA" == "SELF" ]]; then
                TOKEN="$(gcloud auth print-identity-token --audiences="$AUDIENCE_URL" 2>/dev/null)" || TOKEN=""
              else
                TOKEN="$(gcloud auth print-identity-token --impersonate-service-account="$SA" --audiences="$AUDIENCE_URL" 2>/dev/null)" || TOKEN=""
              fi
              [[ -n "$TOKEN" ]] || continue
              CODE="$(curl --silent --show-error --connect-timeout 10 --max-time 25 \
                -H "Authorization: Bearer $TOKEN" -H "Accept: application/json" \
                --output "$RESPONSE" --write-out '%{http_code}' "$SERVICE_URL/backfillz")" || CODE=000
              if [[ "$CODE" == "200" ]]; then
                PUBLIC_CODE="$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
                  --output /dev/null --write-out '%{http_code}' "$AUDIENCE_URL/backfillz")" || PUBLIC_CODE=000
                if [[ "$PUBLIC_CODE" == "200" ]]; then
                  echo "ERROR=cloud_run_service_is_public; refusing to start backfill"
                  exit 1
                fi
                if [[ "$PUBLIC_CODE" != "401" && "$PUBLIC_CODE" != "403" && "$PUBLIC_CODE" != "404" ]]; then
                  echo "ERROR=unauthenticated_private_service_check_failed http=$PUBLIC_CODE"
                  exit 1
                fi
                CALLER_IDENTITY="$SA"
                echo "CLOUD_RUN_BACKFILL_ENDPOINT=READY"
                echo "CLOUD_RUN_UNAUTHENTICATED_ACCESS=BLOCKED http=$PUBLIC_CODE"
                echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_OUTPUT"
                echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
                echo "AUDIENCE_URL=$AUDIENCE_URL" >> "$GITHUB_ENV"
                echo "CALLER_IDENTITY=$CALLER_IDENTITY" >> "$GITHUB_ENV"
                exit 0
              fi
              if [[ "$CODE" == "404" ]]; then
                # IAM accepted this identity; the new route is not yet on the
                # service's production URL, so wait and retry this identity.
                CALLER_IDENTITY="$SA"
                ROUTE_WAIT=true
                break
              fi
            done
            if [[ "$ROUTE_WAIT" == "false" && -z "$CALLER_IDENTITY" ]]; then
              echo "ERROR=no_identity_could_invoke_private_cloud_run_service"
              exit 1
            fi
            echo "Waiting for deployed endpoint attempt=$attempt/60 http=$CODE"
            sleep 30
          done
          echo "ERROR=backfill_endpoint_not_ready_after_30_minutes"
          exit 1

      - name: Start resumable backfill using Cloud Run's existing TOTP cache
        if: steps.schedule_gate.outputs.should_run == 'true'
        id: start
        shell: bash
        run: |
          set -euo pipefail
          TRIGGER_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "trigger_started_at=$TRIGGER_STARTED_AT" >> "$GITHUB_OUTPUT"
          if [[ "$CALLER_IDENTITY" == "SELF" ]]; then
            TOKEN="$(gcloud auth print-identity-token --audiences="${AUDIENCE_URL:-$SERVICE_URL}" 2>/dev/null)" || TOKEN=""
          else
            TOKEN="$(gcloud auth print-identity-token --impersonate-service-account="$CALLER_IDENTITY" --audiences="${AUDIENCE_URL:-$SERVICE_URL}" 2>/dev/null)" || TOKEN=""
          fi
          [[ -n "$TOKEN" ]] || { echo "ERROR=cloud_run_invoker_identity_token_unavailable"; exit 1; }
          RESPONSE="$(mktemp)"
          trap 'rm -f "$RESPONSE"; unset TOKEN' EXIT
          CODE="$(curl --silent --show-error --connect-timeout 10 --max-time 25 \
            -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data "{\"confirm\":\"START_NATIVE_5M_BACKFILL\",\"end_date\":\"${BACKFILL_END_DATE}\",\"replace_existing_history\":\"${BACKFILL_REPLACE_EXISTING}\"}" \
            --output "$RESPONSE" --write-out '%{http_code}' "$SERVICE_URL/backfill")" || CODE=000
          python - "$RESPONSE" "$CODE" <<'PY'
          import json, sys
          path, code = sys.argv[1:]
          try:
              body = json.load(open(path, encoding="utf-8"))
          except Exception:
              raise SystemExit("BACKFILL_START_RESPONSE_INVALID_JSON http=" + code)
          print("BACKFILL_START_RESULT=" + json.dumps({
              "http_status": code,
              "status": body.get("status"),
              "status_endpoint": body.get("status_endpoint"),
              "note": body.get("note"),
          }, sort_keys=True))
          if code == "202" and body.get("status") == "BACKFILL_STARTED":
              raise SystemExit(0)
          if code == "409" and body.get("status") == "BACKFILL_ALREADY_RUNNING":
              state = body.get("five_minute_backfill") or {}
              if state.get("status") in {"RUNNING", "PAUSED_FOR_LIVE_MARKET"}:
                  raise SystemExit(0)
          raise SystemExit("BACKFILL_START_FAILED http=" + code + " status=" + str(body.get("status")))
          PY

      - name: Monitor backfill to completion while keeping the instance warm
        if: steps.schedule_gate.outputs.should_run == 'true'
        env:
          TRIGGER_STARTED_AT: ${{ steps.start.outputs.trigger_started_at }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${TRIGGER_STARTED_AT}" ]] || { echo "ERROR=trigger_timestamp_missing"; exit 1; }
          RESPONSE="$(mktemp)"
          trap 'rm -f "$RESPONSE"; unset TOKEN' EXIT
          IDLE_STREAK=0
          SAW_PARQUET=false
          for attempt in $(seq 1 180); do
            if [[ "${CALLER_IDENTITY}" == "SELF" ]]; then
              TOKEN="$(gcloud auth print-identity-token --audiences="${AUDIENCE_URL:-$SERVICE_URL}" 2>/dev/null)" || TOKEN=""
            else
              TOKEN="$(gcloud auth print-identity-token --impersonate-service-account="${CALLER_IDENTITY}" --audiences="${AUDIENCE_URL:-$SERVICE_URL}" 2>/dev/null)" || TOKEN=""
            fi
            [[ -n "$TOKEN" ]] || { echo "ERROR=keepalive_identity_token_unavailable"; exit 1; }
            CODE="$(curl --silent --show-error --connect-timeout 10 --max-time 25 \
              -H "Authorization: Bearer $TOKEN" -H "Accept: application/json" \
              --output "$RESPONSE" --write-out '%{http_code}' "$SERVICE_URL/backfillz")" || CODE=000
            if [[ "$CODE" != "200" ]]; then
              echo "KEEPALIVE_STATUS_HTTP=$CODE attempt=$attempt/180"
              sleep 30
              continue
            fi
            MONITOR_CODE="$(python - "$RESPONSE" <<'PY'
          import json, sys
          body = json.load(open(sys.argv[1], encoding="utf-8"))
          state = body.get("five_minute_backfill") or {}
          progress = state.get("progress") or {}
          summary = {
              "status": body.get("status"),
              "phase": state.get("phase"),
              "started_at_utc": state.get("started_at_utc"),
              "updated_at_utc": state.get("updated_at_utc"),
              "finished_at_utc": state.get("finished_at_utc"),
              "exit_code": state.get("exit_code"),
              "error": state.get("error"),
              "counters": state.get("counters") or {},
              "progress": progress,
          }
          print("BACKFILL_LIVE_STATE=" + json.dumps(summary, sort_keys=True, default=str), file=sys.stderr)
          status = str(body.get("status") or "").upper()
          stage = str(progress.get("stage") or "").upper()
          if status in {"COMPLETED", "COMPLETED_WITH_GAPS"}:
              print(0)
          elif status in {"FAILED", "ERROR"}:
              print(2)
          elif stage == "SYMBOL_PARQUET_PERSISTED":
              print(3)
          elif status == "IDLE" and not state.get("started_at_utc"):
              print(4)
          else:
              print(1)
          PY
            )"
            case "$MONITOR_CODE" in
              0) echo "BACKFILL_MONITOR=COMPLETED"; exit 0 ;;
              2) echo "BACKFILL_MONITOR=FAILED"; exit 1 ;;
              3) SAW_PARQUET=true; IDLE_STREAK=0; echo "DURABLE_SYMBOL_PARQUET_OBSERVED=true" ;;
              4) IDLE_STREAK=$((IDLE_STREAK + 1)) ;;
              *) IDLE_STREAK=0 ;;
            esac
            if [[ "$IDLE_STREAK" -ge 5 ]]; then
              echo "BACKFILL_MONITOR=FAILED_THREAD_NOT_RUNNING"
              exit 1
            fi
            if [[ "$attempt" -eq 30 && "$SAW_PARQUET" != "true" ]]; then
              echo "BACKFILL_MONITOR=WARNING_NO_SYMBOL_PARQUET_AFTER_30_MIN"
            fi
            if [[ "$attempt" -ge 180 ]]; then
              echo "BACKFILL_MONITOR=TIMEOUT"
              exit 1
            fi
            sleep 60
          done

# Resume request after verifier correction: use Cloud Run persistence events; preserve all existing checkpoints.
