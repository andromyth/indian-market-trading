name: Start Cloud Run native five-minute history backfill

on:
  workflow_dispatch:
    inputs:
      confirm_backfill:
        description: "Explicitly authorize the resumable ALL-NSE native five-minute history backfill"
        type: choice
        required: true
        default: "no"
        options:
          - "no"
          - "yes"
  schedule:
    # 00:00 IST daily: start early on weekends and NSE holidays.
    - cron: "30 18 * * *"
    # 16:00 IST on weekdays: start after the live 5-minute capture session.
    - cron: "30 10 * * 1-5"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/start_cloud_run_5m_backfill.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: start-cloud-run-native-5m-backfill
  cancel-in-progress: false

jobs:
  start-backfill:
    if: (github.event_name == 'workflow_dispatch' && inputs.confirm_backfill == 'yes') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[start-native-5m-backfill]')) || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PROJECT_ID: indian-market-trading
      REGION: asia-south1
      SERVICE: indian-market-intraday-worker
      INVOKER: indian-market-scheduler@indian-market-trading.iam.gserviceaccount.com
    steps:
      - name: Check out repository for the NSE trading calendar
        if: github.event_name == 'schedule'
        uses: actions/checkout@v4

      - name: Gate scheduled start by NSE trading calendar and local time
        id: schedule_gate
        if: github.event_name == 'schedule'
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from nse_trading_calendar import is_nse_trading_day

          now = datetime.now(ZoneInfo("Asia/Kolkata"))
          cron = os.environ.get("SCHEDULE_CRON", "")
          trading_day = is_nse_trading_day(now.date())
          if cron == "30 18 * * *":
              allowed = not trading_day
              reason = "non-trading day: full-day backfill window" if allowed else "trading day: wait until 16:00 IST"
          elif cron == "30 10 * * 1-5":
              allowed = trading_day and now.hour >= 16
              reason = "trading day: post-market backfill window" if allowed else "not a trading day or before 16:00 IST"
          else:
              raise SystemExit("Unknown scheduled trigger; refusing to start backfill.")
          print(f"IST_NOW={now.isoformat()} TRADING_DAY={trading_day} ALLOWED={allowed} REASON={reason}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("should_run=" + ("true" if allowed else "false") + "\n")
          PY

      - name: Require successful deployment of the previous commit before starting backfill
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_DEPLOY_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy_intraday_worker_recovery.yml/runs?branch=main&head_sha=${EXPECTED_DEPLOY_SHA}&per_page=20")"
            MATCH="$(printf '%s' "$RUNS" | python -c 'import json,os,sys; sha=os.environ["EXPECTED_DEPLOY_SHA"]; runs=[r for r in json.load(sys.stdin).get("workflow_runs",[]) if r.get("head_sha")==sha]; print(json.dumps(max(runs,key=lambda r:r.get("created_at","")) if runs else {}))')"
            RUN_ID="$(printf '%s' "$MATCH" | python -c 'import json,sys; print(json.load(sys.stdin).get("id",""))')"
            STATUS="$(printf '%s' "$MATCH" | python -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')"
            CONCLUSION="$(printf '%s' "$MATCH" | python -c 'import json,sys; print(json.load(sys.stdin).get("conclusion",""))')"
            if [[ -n "$RUN_ID" ]]; then
              echo "DEPLOY_RUN_ID=$RUN_ID STATUS=$STATUS CONCLUSION=$CONCLUSION"
              if [[ "$STATUS" == "completed" ]]; then
                [[ "$CONCLUSION" == "success" ]] || { echo "Backfill start blocked: previous commit deployment failed."; exit 1; }
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Backfill start blocked: timed out waiting for previous-commit deployment."
          exit 1

      - name: Require latest main-branch Cloud Run deployment to be successful
        if: github.event_name == 'schedule' && steps.schedule_gate.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy_intraday_worker_recovery.yml/runs?branch=main&per_page=20")"
            MATCH="$(printf '%s' "$RUNS" | python -c 'import json,sys; runs=[r for r in json.load(sys.stdin).get("workflow_runs",[]) if r.get("head_branch")=="main"]; print(json.dumps(max(runs,key=lambda r:r.get("created_at","")) if runs else {}))')"
            RUN_ID="$(printf '%s' "$MATCH" | python -c 'import json,sys; print(json.load(sys.stdin).get("id",""))')"
            STATUS="$(printf '%s' "$MATCH" | python -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')"
            CONCLUSION="$(printf '%s' "$MATCH" | python -c 'import json,sys; print(json.load(sys.stdin).get("conclusion",""))')"
            if [[ -n "$RUN_ID" ]]; then
              echo "LATEST_MAIN_DEPLOY_RUN_ID=$RUN_ID STATUS=$STATUS CONCLUSION=$CONCLUSION"
              if [[ "$STATUS" == "completed" ]]; then
                [[ "$CONCLUSION" == "success" ]] || { echo "Scheduled backfill blocked: latest main deployment did not succeed."; exit 1; }
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Scheduled backfill blocked: timed out waiting for latest main deployment."
          exit 1

      - name: Authenticate to Google Cloud
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          project_id: indian-market-trading

      - name: Set up gcloud
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: indian-market-trading

      # Immediate post-deploy kickoff: the marker commit is gated on the prior deploy.
      - name: Wait for the deployed private backfill endpoint
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        id: endpoint
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          [[ "$SERVICE_URL" == https://* ]] || { echo "ERROR=cloud_run_service_url_missing"; exit 1; }
          RESPONSE="$(mktemp)"
          trap 'rm -f "$RESPONSE"; unset TOKEN' EXIT
          CALLER_IDENTITY=""
          for attempt in $(seq 1 60); do
            ROUTE_WAIT=false
            for SA in "SELF" "$INVOKER" "intraday-scheduler@$PROJECT_ID.iam.gserviceaccount.com"; do
              if [[ "$SA" == "SELF" ]]; then
                TOKEN="$(gcloud auth print-identity-token --audiences="$SERVICE_URL" 2>/dev/null)" || TOKEN=""
              else
                TOKEN="$(gcloud auth print-identity-token --impersonate-service-account="$SA" --audiences="$SERVICE_URL" 2>/dev/null)" || TOKEN=""
              fi
              [[ -n "$TOKEN" ]] || continue
              CODE="$(curl --silent --show-error --connect-timeout 10 --max-time 25 \
                -H "Authorization: Bearer $TOKEN" -H "Accept: application/json" \
                --output "$RESPONSE" --write-out '%{http_code}' "$SERVICE_URL/backfillz")" || CODE=000
              if [[ "$CODE" == "200" ]]; then
                PUBLIC_CODE="$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
                  --output /dev/null --write-out '%{http_code}' "$SERVICE_URL/backfillz")" || PUBLIC_CODE=000
                if [[ "$PUBLIC_CODE" == "200" ]]; then
                  echo "ERROR=cloud_run_service_is_public; refusing to start backfill"
                  exit 1
                fi
                if [[ "$PUBLIC_CODE" != "401" && "$PUBLIC_CODE" != "403" && "$PUBLIC_CODE" != "404" ]]; then
                  echo "ERROR=unauthenticated_private_service_check_failed http=$PUBLIC_CODE"
                  exit 1
                fi
                CALLER_IDENTITY="$SA"
                echo "CLOUD_RUN_BACKFILL_ENDPOINT=READY"
                echo "CLOUD_RUN_UNAUTHENTICATED_ACCESS=BLOCKED http=$PUBLIC_CODE"
                echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_OUTPUT"
                echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
                echo "CALLER_IDENTITY=$CALLER_IDENTITY" >> "$GITHUB_ENV"
                exit 0
              fi
              if [[ "$CODE" == "404" ]]; then
                # IAM accepted this identity; the new route is not yet on the
                # service's production URL, so wait and retry this identity.
                CALLER_IDENTITY="$SA"
                ROUTE_WAIT=true
                break
              fi
            done
            if [[ "$ROUTE_WAIT" == "false" && -z "$CALLER_IDENTITY" ]]; then
              echo "ERROR=no_identity_could_invoke_private_cloud_run_service"
              exit 1
            fi
            echo "Waiting for deployed endpoint attempt=$attempt/60 http=$CODE"
            sleep 30
          done
          echo "ERROR=backfill_endpoint_not_ready_after_30_minutes"
          exit 1

      - name: Start resumable backfill using Cloud Run's existing TOTP cache
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CALLER_IDENTITY" == "SELF" ]]; then
            TOKEN="$(gcloud auth print-identity-token --audiences="$SERVICE_URL" 2>/dev/null)" || TOKEN=""
          else
            TOKEN="$(gcloud auth print-identity-token --impersonate-service-account="$CALLER_IDENTITY" --audiences="$SERVICE_URL" 2>/dev/null)" || TOKEN=""
          fi
          [[ -n "$TOKEN" ]] || { echo "ERROR=cloud_run_invoker_identity_token_unavailable"; exit 1; }
          RESPONSE="$(mktemp)"
          trap 'rm -f "$RESPONSE"; unset TOKEN' EXIT
          CODE="$(curl --silent --show-error --connect-timeout 10 --max-time 25 \
            -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data '{"confirm":"START_NATIVE_5M_BACKFILL"}' \
            --output "$RESPONSE" --write-out '%{http_code}' "$SERVICE_URL/backfill")" || CODE=000
          python - "$RESPONSE" "$CODE" <<'PY'
          import json, sys
          path, code = sys.argv[1:]
          try:
              body = json.load(open(path, encoding="utf-8"))
          except Exception:
              raise SystemExit("BACKFILL_START_RESPONSE_INVALID_JSON http=" + code)
          print("BACKFILL_START_RESULT=" + json.dumps({
              "http_status": code,
              "status": body.get("status"),
              "status_endpoint": body.get("status_endpoint"),
              "note": body.get("note"),
          }, sort_keys=True))
          if code == "202" and body.get("status") == "BACKFILL_STARTED":
              raise SystemExit(0)
          if code == "409" and body.get("status") == "BACKFILL_ALREADY_RUNNING":
              state = body.get("five_minute_backfill") or {}
              if state.get("status") in {"RUNNING", "PAUSED_FOR_LIVE_MARKET"}:
                  raise SystemExit(0)
          raise SystemExit("BACKFILL_START_FAILED http=" + code + " status=" + str(body.get("status")))
          PY
