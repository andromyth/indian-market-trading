name: Verify all-NSE Drive minute snapshots

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify_all_nse_drive_snapshots.yml"

permissions:
  contents: read

jobs:
  inspect-drive-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROJECT_ID: indian-market-trading
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          project_id: indian-market-trading

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: indian-market-trading

      - name: Prepare Drive audit credentials without printing them
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${GOOGLE_OAUTH_TOKEN_JSON:-}" ]]; then
            echo "DRIVE_OAUTH_GITHUB_SECRET=EMPTY"
            exit 2
          fi
          if [[ -z "${GOOGLE_DRIVE_ROOT_ID:-}" ]]; then
            echo "DRIVE_ROOT_ID_GITHUB_SECRET=EMPTY"
            exit 2
          fi
          printf '%s' "$GOOGLE_OAUTH_TOKEN_JSON" > /tmp/gdrive-oauth.json
          printf '%s' "$GOOGLE_DRIVE_ROOT_ID" > /tmp/gdrive-root-id.txt
          echo "DRIVE_CREDENTIALS_RETRIEVED=YES from existing GitHub Actions secrets (values withheld)"
          python -m pip install --quiet requests

      - name: Inspect latest Drive manifests and minute-shard gaps
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import json
          import re
          import sys
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo
          import requests

          PROJECT = "indian-market-trading"
          ROOT_ID = Path("/tmp/gdrive-root-id.txt").read_text(encoding="utf-8").strip()
          token_info = json.loads(Path("/tmp/gdrive-oauth.json").read_text(encoding="utf-8"))
          now = dt.datetime.now(dt.timezone.utc)
          access = token_info.get("token") or token_info.get("access_token")
          expires = token_info.get("expiry") or token_info.get("expires_at")
          stale = True
          if expires:
              try:
                  exp = dt.datetime.fromisoformat(str(expires).replace("Z", "+00:00"))
                  stale = exp <= now + dt.timedelta(minutes=2)
              except Exception:
                  stale = True
          if not access or stale:
              refresh_token = token_info.get("refresh_token")
              if not refresh_token:
                  print("DRIVE_AUTH=FAIL: OAuth token is missing or expired and has no refresh token")
                  sys.exit(2)
              token_uri = token_info.get("token_uri") or "https://oauth2.googleapis.com/token"
              resp = requests.post(token_uri, data={
                  "client_id": token_info.get("client_id"),
                  "client_secret": token_info.get("client_secret"),
                  "refresh_token": refresh_token,
                  "grant_type": "refresh_token",
              }, timeout=20)
              if resp.status_code != 200:
                  print(f"DRIVE_AUTH=FAIL: OAuth refresh returned HTTP {resp.status_code}")
                  sys.exit(2)
              access = resp.json().get("access_token")
          if not access:
              print("DRIVE_AUTH=FAIL: no access token available")
              sys.exit(2)

          def drive_get(path, params=None, media=False):
              suffix = "?" + urlencode(params or {}) if params else ""
              url = "https://www.googleapis.com/drive/v3/" + path + suffix
              if media:
                  url += ("&" if suffix else "?") + "alt=media"
              r = requests.get(url, headers={"Authorization": "Bearer " + access}, timeout=25)
              if r.status_code != 200:
                  raise RuntimeError(f"Drive API HTTP {r.status_code} for read-only query {path}")
              return r.json() if not media else r.content

          def list_children(parent_id, name=None, mime_type=None):
              q = f"'{parent_id}' in parents and trashed = false"
              if name:
                  escaped = name.replace("\\", "\\\\").replace("'", "\\'")
                  q += f" and name = '{escaped}'"
              if mime_type:
                  q += f" and mimeType = '{mime_type}'"
              params = {
                  "q": q,
                  "pageSize": 1000,
                  "orderBy": "modifiedTime desc",
                  "fields": "files(id,name,mimeType,modifiedTime,size,parents),nextPageToken",
                  "supportsAllDrives": "true",
                  "includeItemsFromAllDrives": "true",
              }
              all_files=[]
              while True:
                  body=drive_get("files",params)
                  all_files.extend(body.get("files",[]))
                  page=body.get("nextPageToken")
                  if not page: break
                  params["pageToken"]=page
              return all_files

          def child_folder(parent_id, name):
              files=list_children(parent_id,name,"application/vnd.google-apps.folder")
              return files[0] if files else None

          def child_file(parent_id, name):
              files=list_children(parent_id,name)
              candidates=[f for f in files if f["name"]==name and f.get("mimeType")!="application/vnd.google-apps.folder"]
              return candidates[0] if candidates else None

          def read_json_file(file):
              if not file: return None
              return json.loads(drive_get(f"files/{file['id']}",media=True).decode("utf-8"))

          def safe_get(obj, *keys):
              for key in keys:
                  if not isinstance(obj,dict): return None
                  obj=obj.get(key)
              return obj

          def print_manifest(label, folder, remote_root):
              latest=child_file(folder["id"],"latest_manifest.json")
              if not latest:
                  print(f"{label}_LATEST_MANIFEST=NOT_FOUND")
                  return None
              payload=read_json_file(latest)
              print(f"{label}_MANIFEST_MODIFIED_UTC={latest.get('modifiedTime')}")
              keys = (
                  "status","cycle_minute_ist","expected_symbol_count","row_count",
                  "quoted_symbol_count","actual_quote_count","missing_quote_count",
                  "unmapped_symbol_count","eligible_symbol_count","prediction_count",
                  "prediction_status_counts","data_limited_count","untrained_symbol_count",
                  "model_failure_count","model_artifact_verified","trained_symbol_manifest_available",
                  "model_coverage_symbols","model_version","model_status","prediction_coverage_pct",
                  "history_ready","history_seed_coverage_symbols","history_seed_complete",
                  "remote_snapshot_path","snapshot_drive_path","remote_path","manifest_drive_path",
                  "prediction_drive_path","predictions_drive_path","prediction_drive_error",
                  "manifest_drive_error","error",
              )
              for key in keys:
                  if key in payload:
                      print(f"{label}_{key.upper()}={payload.get(key)}")
              if remote_root:
                  print(f"{label}_REMOTE_ROOT={remote_root}")
              return payload

          try:
              root_meta=drive_get(f"files/{ROOT_ID}",{
                  "fields":"id,name,mimeType,trashed"
              })
              if root_meta.get("mimeType")!="application/vnd.google-apps.folder" or root_meta.get("trashed"):
                  raise RuntimeError("configured root ID is not an accessible, active folder")
              print("DRIVE_AUTH=PASS")
              print("DRIVE_ROOT_ACCESS=PASS")
              prod=child_folder(ROOT_ID,"production_data")
              if not prod: raise RuntimeError("production_data folder not found under configured root")
              quotes=child_folder(prod["id"],"all_universe_minute_snapshots")
              predictions=child_folder(prod["id"],"all_nse_minute_predictions")
              if not quotes: raise RuntimeError("all_universe_minute_snapshots folder not found")
              if not predictions: raise RuntimeError("all_nse_minute_predictions folder not found")
              qm=print_manifest("QUOTE",quotes,"production_data/all_universe_minute_snapshots")
              pm=print_manifest("PREDICTION",predictions,"production_data/all_nse_minute_predictions")

              def get_minute(obj):
                  if not obj or not obj.get("cycle_minute_ist"): return None
                  ts=dt.datetime.fromisoformat(str(obj["cycle_minute_ist"]).replace("Z","+00:00"))
                  return ts.replace(tzinfo=ZoneInfo("Asia/Kolkata")) if ts.tzinfo is None else ts

              qts=get_minute(qm); pts=get_minute(pm)
              for label, ts in (("QUOTE",qts),("PREDICTION",pts)):
                  if ts:
                      age=(dt.datetime.now(ZoneInfo("Asia/Kolkata"))-ts.astimezone(ZoneInfo("Asia/Kolkata"))).total_seconds()/60
                      print(f"{label}_AGE_MINUTES={age:.1f}")

              def inspect_day(label, parent_folder, ts, prefix):
                  if not ts:
                      print(f"{label}_MINUTE_FILES=UNAVAILABLE_NO_TIMESTAMP")
                      return False
                  local=ts.astimezone(ZoneInfo("Asia/Kolkata"))
                  cur=parent_folder
                  for component in (f"{local:%Y}",f"{local:%m}",f"{local:%d}"):
                      cur_obj=child_folder(cur["id"],component)
                      if not cur_obj:
                          print(f"{label}_DAY_FOLDER_MISSING={component}")
                          return False
                      cur=cur_obj
                  files=list_children(cur["id"])
                  target_slot_file = f"{prefix}_{local:%Y%m%d_%H%M}.parquet"
                  target_slot_file_present = any(
                      item.get("name") == target_slot_file for item in files
                  )
                  print(f"{label}_LATEST_SLOT_FILE={target_slot_file}")
                  print(f"{label}_LATEST_SLOT_FILE_STORED={target_slot_file_present}")
                  pattern=re.compile(rf"^{re.escape(prefix)}_(\d{{8}})_(\d{{4}})\.parquet$")
                  stamps=[]
                  for file in files:
                      m=pattern.match(file.get("name",""))
                      if not m: continue
                      stamp=dt.datetime.strptime(m.group(1)+m.group(2),"%Y%m%d%H%M").replace(tzinfo=ZoneInfo("Asia/Kolkata"))
                      stamps.append((stamp,file.get("name"),file.get("modifiedTime")))
                  stamps.sort()
                  local_now=dt.datetime.now(ZoneInfo("Asia/Kolkata"))
                  session_open=local_now.replace(hour=9,minute=15,second=0,microsecond=0)
                  session_close=local_now.replace(hour=15,minute=30,second=0,microsecond=0)
                  window_end=min(local_now.replace(second=0,microsecond=0),session_close)
                  if window_end < session_open:
                      window_start=None
                      recent=[]
                      expected_slots=[]
                  else:
                      window_start=max(session_open,window_end-dt.timedelta(minutes=29))
                      offset_minutes=(window_start-session_open).total_seconds()/60.0
                      first_slot_index=int((offset_minutes+4.999999)//5)
                      first_slot=session_open+dt.timedelta(minutes=first_slot_index*5)
                      last_slot=min(window_end,session_close-dt.timedelta(minutes=5))
                      expected_slots=[]
                      cursor=first_slot
                      while cursor<=last_slot:
                          expected_slots.append(cursor)
                          cursor+=dt.timedelta(minutes=5)
                      recent=[x for x in stamps if window_start<=x[0]<=window_end]
                  print(f"{label}_MARKET_WINDOW_START={window_start.strftime('%H:%M') if window_start else 'market-not-open'}")
                  print(f"{label}_MARKET_WINDOW_END={window_end.strftime('%H:%M') if window_start else 'market-not-open'}")
                  print(f"{label}_EXPECTED_FIVE_MINUTE_SLOTS={len(expected_slots)}")
                  print(f"{label}_FILES_IN_WINDOW={len(recent)}")
                  if recent:
                      print(f"{label}_OLDEST_FILE_IN_WINDOW={recent[0][1]}")
                      print(f"{label}_LATEST_FILE={recent[-1][1]}")
                      print(f"{label}_LATEST_FILE_MODIFIED_UTC={recent[-1][2]}")
                  tset={x[0] for x in recent}
                  gaps=[slot.strftime('%H:%M') for slot in expected_slots if slot not in tset]
                  print(f"{label}_MISSING_FIVE_MINUTE_SLOTS={','.join(gaps) if gaps else 'none'}")
                  return target_slot_file_present

              quote_slot_file_stored = inspect_day("QUOTE",quotes,qts,"snapshot")
              prediction_slot_file_stored = inspect_day("PREDICTION",predictions,pts,"predictions")

              now_ist=dt.datetime.now(ZoneInfo("Asia/Kolkata"))
              for label,obj,ts in (("QUOTE",qm,qts),("PREDICTION",pm,pts)):
                  if not obj or not ts:
                      print(f"{label}_STORAGE_STATUS=NO_READABLE_LATEST_MANIFEST")
                      continue
                  local_ts=ts.astimezone(ZoneInfo("Asia/Kolkata"))
                  age=(now_ist-local_ts).total_seconds()
                  status=str(obj.get("status") or "").upper()
                  expected=obj.get("expected_symbol_count")
                  count=obj.get("quoted_symbol_count") if label=="QUOTE" else obj.get("prediction_count")
                  miss=obj.get("missing_quote_count")
                  row_count=obj.get("row_count")
                  slot_file_stored = (
                      quote_slot_file_stored if label=="QUOTE" else prediction_slot_file_stored
                  )
                  stored = (
                      status in {"OK","STORED","PARTIAL"}
                      and slot_file_stored
                      and row_count is not None and int(row_count)>0
                      and count is not None and int(count)>0
                  )
                  print(f"{label}_LATEST_AGE_MINUTES={max(0.0,age)/60:.1f}")
                  print(f"{label}_SESSION_DATE={local_ts.date().isoformat()}")
                  print(f"{label}_CYCLE_TIME_IST={local_ts.strftime('%H:%M:%S')}")
                  print(f"{label}_EXPECTED_SYMBOL_COUNT={expected}")
                  print(f"{label}_STORED_ROW_COUNT={row_count}")
                  print(f"{label}_SYMBOL_ROWS_WITH_DATA={count}")
                  if label=="QUOTE":
                      print(f"{label}_MISSING_SYMBOL_COUNT={miss}")
                  if label=="PREDICTION":
                      print(f"{label}_MODEL_ARTIFACT_VERIFIED={obj.get('model_artifact_verified')}")
                      print(f"{label}_MODEL_FAILURE_COUNT={obj.get('model_failure_count')}")
                  print(f"{label}_STORAGE_STATUS={'STORED_SYMBOL_ROWS_AVAILABLE' if stored else 'NO_PERSISTED_SYMBOL_ROWS'}")
              print("AGGREGATE_COVERAGE_POLICY=INFORMATIONAL_ONLY")
              print("OVERALL_VERDICT=NOT_APPLICABLE_PER_SYMBOL_RECORDS_REPORTED")
              sys.exit(0)
          except Exception as exc:
              print(f"DRIVE_INSPECTION_ERROR={type(exc).__name__}: {exc}")
              sys.exit(2)
          PY
          rm -f /tmp/gdrive-oauth.json /tmp/gdrive-root-id.txt /tmp/oauth-secret-error.txt /tmp/root-secret-error.txt
