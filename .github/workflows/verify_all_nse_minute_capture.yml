name: Verify all-NSE minute capture

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify_all_nse_minute_capture.yml"
      - "autonomous_intraday_worker_service.py"

permissions:
  contents: read
  actions: read

jobs:
  verify-live-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PROJECT_ID: indian-market-trading
      REGION: asia-south1
      SERVICE: indian-market-intraday-worker
    steps:
      - name: Checkout the commit being verified
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          project_id: indian-market-trading

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: indian-market-trading

      - name: Wait for ready revision containing the worker code
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_SHA="$(git log -1 --format=%H -- autonomous_intraday_worker_service.py)"
          CODE_COMMIT_TIME="$(git show -s --format=%cI "$DEPLOY_SHA")"
          echo "SERVICE_CODE_COMMIT=$DEPLOY_SHA"
          echo "SERVICE_CODE_COMMIT_TIME=$CODE_COMMIT_TIME"
          for attempt in $(seq 1 60); do
            REVISION="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.latestReadyRevisionName)')"
            if [[ -n "$REVISION" ]]; then
              REVISION_TIME="$(gcloud run revisions describe "$REVISION" --project="$PROJECT_ID" --region="$REGION" --format='value(metadata.creationTimestamp)')"
              READY="$(gcloud run revisions describe "$REVISION" --project="$PROJECT_ID" --region="$REGION" --format='value(status.conditions[0].status)')"
              if [[ "$READY" == "True" ]] && python - "$REVISION_TIME" "$CODE_COMMIT_TIME" <<'PY'
          import datetime, sys
          def parse(value):
              return datetime.datetime.fromisoformat(value.replace("Z", "+00:00"))
          try:
              sys.exit(0 if parse(sys.argv[1]) >= parse(sys.argv[2]) else 1)
          except Exception:
              sys.exit(1)
          PY
              then
                echo "DEPLOYED_READY_REVISION=$REVISION"
                echo "DEPLOYED_REVISION_CREATION_TIME=$REVISION_TIME"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "ERROR: no ready Cloud Run revision created after the worker-code commit time."
          exit 1

      - name: Probe private quote and prediction diagnostics without overstating off-session readiness
        shell: bash
        run: |
          set -euo pipefail
          SESSION_ACTIVE="$(python - <<'PY'
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Asia/Kolkata"))
          print("true" if now.weekday() < 5 and time(9, 15) <= now.time() < time(15, 30) else "false")
          PY
          )"
          if [[ "$SESSION_ACTIVE" != "true" ]]; then
            echo "LIVE_CAPTURE_CHECK=DEFERRED_OUTSIDE_NSE_CASH_SESSION"
            echo "NOTE=Diagnostic endpoints will be queried read-only; no live-session freshness claim will be made."
          fi

          SERVICE_URL="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          RESPONSE="$(mktemp)"
          trap 'rm -f "$RESPONSE"' EXIT
          CAPTURE_OK=0
          PREDICTION_OK=0
          CAPTURE_DIAGNOSTIC_OK=0
          PREDICTION_DIAGNOSTIC_OK=0

          # First try the already-authenticated diagnostic identity itself.
          # Only if it cannot mint/use a token, try the existing Scheduler
          # identities; no IAM bindings or Scheduler settings are changed.
          for SA in "SELF" "indian-market-scheduler@$PROJECT_ID.iam.gserviceaccount.com" "intraday-scheduler@$PROJECT_ID.iam.gserviceaccount.com"; do
            echo "TRYING_READ_ONLY_INVOKER=$SA"
            if [[ "$SA" == "SELF" ]]; then
              TOKEN="$(gcloud auth print-identity-token --audiences="$SERVICE_URL" 2>/dev/null)" || TOKEN=""
            else
              TOKEN="$(gcloud auth print-identity-token --impersonate-service-account="$SA" --audiences="$SERVICE_URL" 2>/dev/null)" || TOKEN=""
            fi
            if [[ -z "$TOKEN" ]]; then
              echo "IDENTITY_TOKEN_UNAVAILABLE=$SA"
              continue
            fi

            for item in "capturez:ALL_NSE_QUOTE_CAPTURE" "predictionz:ALL_NSE_PREDICTION_ACTUAL_CAPTURE"; do
              PATH_PART="${item%%:*}"
              LABEL="${item##*:}"
              HTTP_CODE="$(curl --silent --show-error --connect-timeout 10 --max-time 25 -H "Authorization: Bearer $TOKEN" -H "Accept: application/json" --output "$RESPONSE" --write-out "%{http_code}" "$SERVICE_URL/$PATH_PART")" || HTTP_CODE=000
              echo "${LABEL}_HTTP_STATUS=$HTTP_CODE"
              set +e
              python - "$RESPONSE" "$HTTP_CODE" "$LABEL" "$SESSION_ACTIVE" <<'PY'
          import json, sys
          path, code, label, session_active = sys.argv[1:]
          try:
              with open(path, encoding="utf-8") as handle:
                  payload=json.load(handle)
          except Exception:
              print(f"{label}_DIAGNOSTIC_BODY_UNAVAILABLE")
              sys.exit(2)
          expected_probe = "all_nse_quote_capture" if label == "ALL_NSE_QUOTE_CAPTURE" else "all_nse_minute_prediction_actual"
          if payload.get("probe") != expected_probe:
              print(f"{label}_IDENTITY_CANNOT_READ_PRIVATE_DIAGNOSTIC")
              sys.exit(2)
          print(f"{label}_AUTHENTICATED_DIAGNOSTIC=PASS")
          print(f"{label}_STATUS={payload.get('status')}")
          for key in ("cycle_minute_ist","age_seconds","expected_symbol_count","row_count","quoted_symbol_count","prediction_count","missing_quote_count","data_limited_count","quality_gate_pass","history_ready","drive_path","manifest_drive_path","reasons","model_manifest_hash_ok","artifact_hashes_ok","history_seed_coverage_pct","history_seed_failed_batches_pct"):
              if key in payload:
                  print(f"{label}_{key.upper()}={payload.get(key)}")
          if code == "200" and payload.get("status") == "ok":
              sys.exit(0)
          # Valid authenticated diagnostic response, but not a live-ready result.
          sys.exit(1)
          PY
              RC=$?
              set -e
              if [[ "$PATH_PART" == "capturez" ]]; then
                if [[ $RC -eq 0 ]]; then CAPTURE_DIAGNOSTIC_OK=1; [[ "$SESSION_ACTIVE" == "true" ]] && CAPTURE_OK=1
                elif [[ $RC -eq 1 ]]; then CAPTURE_DIAGNOSTIC_OK=1
                fi
              else
                if [[ $RC -eq 0 ]]; then PREDICTION_DIAGNOSTIC_OK=1; [[ "$SESSION_ACTIVE" == "true" ]] && PREDICTION_OK=1
                elif [[ $RC -eq 1 ]]; then PREDICTION_DIAGNOSTIC_OK=1
                fi
              fi
              if [[ $RC -eq 2 ]]; then break; fi
            done

            if [[ "$CAPTURE_DIAGNOSTIC_OK" == "1" && "$PREDICTION_DIAGNOSTIC_OK" == "1" ]]; then break; fi
          done

          if [[ "$SESSION_ACTIVE" == "true" ]]; then
            if [[ "$CAPTURE_OK" == "1" ]]; then echo "QUOTE_CAPTURE_VERDICT=PASS"; else echo "QUOTE_CAPTURE_VERDICT=FAIL_OR_UNVERIFIABLE"; fi
            if [[ "$PREDICTION_OK" == "1" ]]; then echo "PREDICTION_ACTUAL_VERDICT=PASS"; else echo "PREDICTION_ACTUAL_VERDICT=FAIL_OR_UNVERIFIABLE"; fi
            [[ "$CAPTURE_OK" == "1" && "$PREDICTION_OK" == "1" ]]
          else
            if [[ "$CAPTURE_DIAGNOSTIC_OK" == "1" ]]; then echo "QUOTE_DIAGNOSTIC_AUTH_VERDICT=PASS"; else echo "QUOTE_DIAGNOSTIC_AUTH_VERDICT=FAIL_OR_UNVERIFIABLE"; fi
            if [[ "$PREDICTION_DIAGNOSTIC_OK" == "1" ]]; then echo "PREDICTION_DIAGNOSTIC_AUTH_VERDICT=PASS"; else echo "PREDICTION_DIAGNOSTIC_AUTH_VERDICT=FAIL_OR_UNVERIFIABLE"; fi
            echo "LIVE_CAPTURE_READINESS=NOT_ASSERTED_OUTSIDE_SESSION"
            [[ "$CAPTURE_DIAGNOSTIC_OK" == "1" && "$PREDICTION_DIAGNOSTIC_OK" == "1" ]]
          fi

      - name: Verify actual Cloud Run INDstocks credentials and read-only data endpoints
        shell: bash
        run: |
          set -euo pipefail
          READY_REVISION="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.latestReadyRevisionName)')"
          gcloud run revisions describe "$READY_REVISION" --project="$PROJECT_ID" --region="$REGION" --format=json > /tmp/ready_revision.json
          python - <<'PY'
          from __future__ import annotations
          import os, subprocess, sys
          from pathlib import Path
          import pandas as pd

          names=("INDSTOCKS_CLIENT_ID","INDSTOCKS_MPIN","INDSTOCKS_TOTP_SECRET","INDSTOCKS_ACCESS_TOKEN")
          payload=__import__("json").loads(Path("/tmp/ready_revision.json").read_text())
          envs={}
          for container in (payload.get("spec") or {}).get("containers") or []:
              for item in container.get("env") or []:
                  envs[item.get("name")]=item

          def secret_value(secret, version):
              result=subprocess.run(
                  ["gcloud","secrets","versions","access",str(version),"--secret",secret,
                   "--project",os.environ["PROJECT_ID"]],
                  stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=False
              )
              return result.stdout.decode().strip() if result.returncode==0 else ""

          for name in names:
              item=envs.get(name) or {}
              if item.get("value"):
                  os.environ[name]=item["value"]
              else:
                  ref=((item.get("valueSource") or {}).get("secretKeyRef") or {})
                  if ref.get("secret"):
                      value=secret_value(ref["secret"],ref.get("version","latest"))
                      if value:
                          os.environ[name]=value

          auto=all(os.environ.get(k,"").strip() for k in names[:3])
          manual=bool(os.environ.get("INDSTOCKS_ACCESS_TOKEN","").strip())
          if not auto and not manual:
              print("PROVIDER_AUTH=FAIL; Cloud Run revision has no readable complete provider credential configuration.")
              print("NO_CREDENTIAL_VALUES_PRINTED=true")
              sys.exit(2)

          import importlib
          import indstocks_client as client
          candidates=["totp"] if auto else []
          if manual:
              candidates.append("manual")
          success=None
          for mode in candidates:
              if mode=="manual":
                  for key in names[:3]:
                      os.environ.pop(key,None)
              client=importlib.reload(client)
              try:
                  client.profile()
                  instruments=client._load_instruments("NSE")
                  if instruments is None or instruments.empty:
                      raise RuntimeError("instrument master unavailable")
                  candles=client.historical_1m("RELIANCE.NS",days=3)
                  if candles is None or candles.empty:
                      raise RuntimeError("one-minute history endpoint returned no rows")
                  symbol_rows=instruments.loc[
                      instruments["TRADING_SYMBOL"].astype(str).str.upper().eq("RELIANCE")
                  ]
                  if symbol_rows.empty:
                      raise RuntimeError("RELIANCE not in NSE instrument master")
                  code="NSE_"+str(symbol_rows.iloc[0]["SECURITY_ID"]).strip()
                  quote_response=client._request("GET","/market/quotes/full",params={"scrip-codes":code})
                  success=(mode,len(instruments),len(candles),quote_response.status_code)
                  break
              except Exception as exc:
                  print(f"PROVIDER_CANDIDATE=FAIL mode={mode} error_type={type(exc).__name__}")
          if success is None:
              print("PROVIDER_AUTH=FAIL; configured credentials could not pass profile, quote API, and historical candle checks.")
              print("NO_CREDENTIAL_VALUES_PRINTED=true")
              sys.exit(3)
          mode,instrument_count,candle_count,quote_status=success
          print(f"PROVIDER_AUTH=PASS mode={mode}")
          print("PROFILE_ENDPOINT=PASS")
          print(f"NSE_INSTRUMENT_MASTER=PASS symbols={len(instruments)}")
          print(f"QUOTE_ENDPOINT=PASS http_status={quote_status}")
          print(f"ONE_MINUTE_HISTORY=PASS rows={candle_count}")
          print("NO_CREDENTIAL_VALUES_PRINTED=true")
          Path("/tmp/ready_revision.json").unlink(missing_ok=True)
          PY
