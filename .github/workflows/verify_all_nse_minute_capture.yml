name: Verify all-NSE minute capture

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify_all_nse_minute_capture.yml"
      - "autonomous_intraday_worker_service.py"

permissions:
  contents: read
  actions: read

jobs:
  verify-live-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PROJECT_ID: indian-market-trading
      REGION: asia-south1
      SERVICE: indian-market-intraday-worker
    steps:
      - name: Checkout the commit being verified
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          project_id: indian-market-trading

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: indian-market-trading

      - name: Wait for the exact commit's deployment to finish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy_intraday_worker_recovery.yml/runs?branch=main&head_sha=${GITHUB_SHA}&per_page=20")"
            MATCH="$(printf '%s' "$RUNS" | python -c 'import json,os,sys; sha=os.environ["GITHUB_SHA"]; rows=[r for r in json.load(sys.stdin).get("workflow_runs",[]) if r.get("head_sha")==sha]; print(json.dumps(max(rows,key=lambda r:r.get("created_at","")) if rows else {}))')"
            STATUS="$(printf '%s' "$MATCH" | python -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')"
            CONCLUSION="$(printf '%s' "$MATCH" | python -c 'import json,sys; print(json.load(sys.stdin).get("conclusion",""))')"
            if [[ "$STATUS" == "completed" ]]; then
              [[ "$CONCLUSION" == "success" ]] || {
                echo "ERROR: deployment workflow for this exact commit did not pass."
                exit 1
              }
              echo "DEPLOYMENT_FOR_EXACT_COMMIT=PASS"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: timed out waiting for deployment of this exact commit."
          exit 1

      - name: Probe full-universe quote and prediction capture through Scheduler identity
        shell: bash
        run: |
          set -euo pipefail
          PROBE_JOB=intraday-worker-0915-0959
          SERVICE_URL="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          ORIGINAL_JSON="$(gcloud scheduler jobs describe "$PROBE_JOB" --project="$PROJECT_ID" --location="$REGION" --format=json)"
          ORIGINAL_URI="$(printf '%s' "$ORIGINAL_JSON" | python -c 'import json,sys; print(json.load(sys.stdin).get("httpTarget",{}).get("uri",""))')"
          ORIGINAL_METHOD="$(printf '%s' "$ORIGINAL_JSON" | python -c 'import json,sys; print(json.load(sys.stdin).get("httpTarget",{}).get("httpMethod","POST").upper())')"
          JOB_STATE="$(printf '%s' "$ORIGINAL_JSON" | python -c 'import json,sys; print(json.load(sys.stdin).get("state",""))')"
          echo "PROBE_JOB_STATE=$JOB_STATE"
          echo "ORIGINAL_TARGET_URI=$ORIGINAL_URI"
          echo "ORIGINAL_TARGET_METHOD=$ORIGINAL_METHOD"
          if [[ "$JOB_STATE" != "ENABLED" || "$ORIGINAL_URI" != "$SERVICE_URL/tick" || "$ORIGINAL_METHOD" != "POST" ]]; then
            echo "ERROR: probe job is not in its expected enabled /tick POST configuration; refusing to modify it."
            exit 1
          fi
          IST_HOUR="$(python -c 'from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo("Asia/Kolkata")).hour)')"
          if (( IST_HOUR < 10 || IST_HOUR >= 15 )); then
            echo "ERROR: safe probe window is 10:00–14:59 IST, outside this job's normal 09:15–09:59 schedule."
            exit 1
          fi

          RESTORE_NEEDED=0
          restore_target() {
            if [[ "$RESTORE_NEEDED" == "1" ]]; then
              echo "Restoring scheduler target to its original /tick POST URI."
              if ! gcloud scheduler jobs update http "$PROBE_JOB" --project="$PROJECT_ID" --location="$REGION" --uri="$ORIGINAL_URI" --http-method="$ORIGINAL_METHOD" --quiet; then
                echo "CRITICAL: failed to restore the original scheduler target."
                return 1
              fi
              RESTORE_NEEDED=0
              RESTORED_JSON="$(gcloud scheduler jobs describe "$PROBE_JOB" --project="$PROJECT_ID" --location="$REGION" --format=json)"
              RESTORED_URI="$(printf '%s' "$RESTORED_JSON" | python -c 'import json,sys; print(json.load(sys.stdin).get("httpTarget",{}).get("uri",""))')"
              RESTORED_METHOD="$(printf '%s' "$RESTORED_JSON" | python -c 'import json,sys; print(json.load(sys.stdin).get("httpTarget",{}).get("httpMethod","POST").upper())')"
              RESTORED_STATE="$(printf '%s' "$RESTORED_JSON" | python -c 'import json,sys; print(json.load(sys.stdin).get("state",""))')"
              if [[ "$RESTORED_URI" != "$ORIGINAL_URI" || "$RESTORED_METHOD" != "$ORIGINAL_METHOD" || "$RESTORED_STATE" != "ENABLED" ]]; then
                echo "CRITICAL: scheduler restoration verification did not match the original configuration."
                return 1
              fi
              echo "SCHEDULER_TARGET_RESTORED=PASS"
            fi
          }
          trap restore_target EXIT

          probe_endpoint() {
            local path="$1"
            local label="$2"
            local before check rc
            before="$(gcloud scheduler jobs describe "$PROBE_JOB" --project="$PROJECT_ID" --location="$REGION" --format='value(lastAttemptTime)')"
            RESTORE_NEEDED=1
            gcloud scheduler jobs update http "$PROBE_JOB" --project="$PROJECT_ID" --location="$REGION" --uri="$SERVICE_URL$path" --http-method=GET --quiet
            gcloud scheduler jobs run "$PROBE_JOB" --project="$PROJECT_ID" --location="$REGION" --quiet

            for attempt in $(seq 1 20); do
              JOB_JSON="$(gcloud scheduler jobs describe "$PROBE_JOB" --project="$PROJECT_ID" --location="$REGION" --format=json)"
              set +e
              check="$(printf '%s' "$JOB_JSON" | python - "$before" <<'PY'
          import datetime, json, sys
          job=json.load(sys.stdin)
          try:
              before=datetime.datetime.fromisoformat(sys.argv[1].replace("Z","+00:00"))
          except Exception:
              before=None
          try:
              attempted=datetime.datetime.fromisoformat(str(job.get("lastAttemptTime","")).replace("Z","+00:00"))
          except Exception:
              attempted=None
          newer=attempted is not None and (before is None or attempted > before)
          status=job.get("status") or {}
          code=status.get("code")
          message=str(status.get("message") or "")[:240]
          if code is None and not message:
              code=0
          print(json.dumps({"new_attempt":newer,"lastAttemptTime":job.get("lastAttemptTime"),"code":code,"message":message},sort_keys=True))
          sys.exit(2 if not newer else (0 if code == 0 and not message else 1))
          PY
          )"
              rc=$?
              set -e
              echo "${label}_SCHEDULER_RESULT=$check"
              if [[ $rc -eq 0 ]]; then
                echo "${label}=PASS (endpoint returned HTTP 2xx)"
                return 0
              elif [[ $rc -eq 1 ]]; then
                echo "${label}=FAIL (endpoint returned non-2xx)"
                return 1
              fi
              sleep 3
            done
            echo "${label}=UNKNOWN (no fresh Scheduler attempt was observed)"
            return 2
          }

          CAPTURE_OK=0
          PREDICTION_OK=0
          if probe_endpoint "/capturez" "ALL_NSE_QUOTE_CAPTURE"; then CAPTURE_OK=1; fi
          if probe_endpoint "/predictionz" "ALL_NSE_PREDICTION_ACTUAL_CAPTURE"; then PREDICTION_OK=1; fi
          restore_target
          trap - EXIT

          if [[ "$CAPTURE_OK" == "1" ]]; then
            echo "QUOTE_CAPTURE_VERDICT=PASS: every expected NSE symbol had a fresh valid quote and the minute snapshot was confirmed in Drive."
          else
            echo "QUOTE_CAPTURE_VERDICT=FAIL_OR_PARTIAL: latest quote file failed the full-coverage/freshness/Drive-write gate."
          fi
          if [[ "$PREDICTION_OK" == "1" ]]; then
            echo "PREDICTION_ACTUAL_VERDICT=PASS: one fresh model-prediction and actual-value row per expected NSE symbol passed its quality gate."
          else
            echo "PREDICTION_ACTUAL_VERDICT=FAIL_OR_PARTIAL: latest prediction/actual file failed full-coverage/freshness/Drive-write checks."
          fi
          [[ "$CAPTURE_OK" == "1" && "$PREDICTION_OK" == "1" ]]
