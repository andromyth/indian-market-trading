name: Verify all-NSE minute capture

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify_all_nse_minute_capture.yml"
      - "autonomous_intraday_worker_service.py"

permissions:
  contents: read
  actions: read

jobs:
  verify-live-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PROJECT_ID: indian-market-trading
      REGION: asia-south1
      SERVICE: indian-market-intraday-worker
    steps:
      - name: Checkout the commit being verified
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          project_id: indian-market-trading

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: indian-market-trading

      - name: Wait for ready revision containing the worker code
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_SHA="$(git log -1 --format=%H -- autonomous_intraday_worker_service.py)"
          CODE_COMMIT_TIME="$(git show -s --format=%cI "$DEPLOY_SHA")"
          echo "SERVICE_CODE_COMMIT=$DEPLOY_SHA"
          echo "SERVICE_CODE_COMMIT_TIME=$CODE_COMMIT_TIME"
          for attempt in $(seq 1 60); do
            REVISION="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.latestReadyRevisionName)')"
            if [[ -n "$REVISION" ]]; then
              REVISION_TIME="$(gcloud run revisions describe "$REVISION" --project="$PROJECT_ID" --region="$REGION" --format='value(metadata.creationTimestamp)')"
              READY="$(gcloud run revisions describe "$REVISION" --project="$PROJECT_ID" --region="$REGION" --format='value(status.conditions[0].status)')"
              if [[ "$READY" == "True" ]] && python - "$REVISION_TIME" "$CODE_COMMIT_TIME" <<'PY'
          import datetime, sys
          def parse(value):
              return datetime.datetime.fromisoformat(value.replace("Z", "+00:00"))
          try:
              sys.exit(0 if parse(sys.argv[1]) >= parse(sys.argv[2]) else 1)
          except Exception:
              sys.exit(1)
          PY
              then
                echo "DEPLOYED_READY_REVISION=$REVISION"
                echo "DEPLOYED_REVISION_CREATION_TIME=$REVISION_TIME"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "ERROR: no ready Cloud Run revision created after the worker-code commit time."
          exit 1
      - name: Probe full-universe quote and prediction capture using read-only identity checks
        shell: bash
        run: |
          set -euo pipefail
          IN_NSE_CASH_SESSION="$(python - <<'PY'
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Asia/Kolkata"))
          print("true" if now.weekday() < 5 and time(9, 15) <= now.time() < time(15, 30) else "false")
          PY
          )"
          if [[ "$IN_NSE_CASH_SESSION" != "true" ]]; then
            echo "LIVE_CAPTURE_CHECK=DEFERRED_OUTSIDE_NSE_CASH_SESSION"
            echo "READY_WORKER_REVISION_CHECK=PASS"
            echo "DETAIL=Fresh quote/prediction diagnostics require an active market session; the deployment workflow separately verifies the private Scheduler jobs and Drive preflight."
            exit 0
          fi
          SERVICE_URL="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          RESPONSE="$(mktemp)"
          trap 'rm -f "$RESPONSE"' EXIT
          CAPTURE_OK=0
          PREDICTION_OK=0
          AUTH_OK=0
          for SA in "indian-market-scheduler@$PROJECT_ID.iam.gserviceaccount.com" "intraday-scheduler@$PROJECT_ID.iam.gserviceaccount.com"; do
            echo "TRYING_READ_ONLY_INVOKER=$SA"
            if ! TOKEN="$(gcloud auth print-identity-token --impersonate-service-account="$SA" --audiences="$SERVICE_URL" 2>&1)"; then
              echo "IDENTITY_IMPERSONATION_UNAVAILABLE=$SA"
              continue
            fi
            for item in "capturez:ALL_NSE_QUOTE_CAPTURE" "predictionz:ALL_NSE_PREDICTION_ACTUAL_CAPTURE"; do
              PATH_PART="${item%%:*}"
              LABEL="${item##*:}"
              HTTP_CODE="$(curl --silent --show-error --connect-timeout 10 --max-time 25 -H "Authorization: Bearer $TOKEN" -H "Accept: application/json" --output "$RESPONSE" --write-out "%{http_code}" "$SERVICE_URL/$PATH_PART")" || HTTP_CODE=000
              echo "${LABEL}_HTTP_STATUS=$HTTP_CODE"
              set +e
              python - "$RESPONSE" "$HTTP_CODE" "$LABEL" <<'PY'
          import json, sys
          path, code, label = sys.argv[1:]
          try:
              payload=json.load(open(path,encoding="utf-8"))
          except Exception:
              print(f"{label}_DIAGNOSTIC_BODY_UNAVAILABLE")
              sys.exit(2)
          expected_probe = "all_nse_quote_capture" if label == "ALL_NSE_QUOTE_CAPTURE" else "all_nse_minute_prediction_actual"
          if payload.get("probe") != expected_probe:
              print(f"{label}_IDENTITY_CANNOT_READ_PRIVATE_DIAGNOSTIC")
              sys.exit(2)
          print(f"{label}_STATUS={payload.get('status')}")
          for key in ("cycle_minute_ist","age_seconds","expected_symbol_count","row_count","quoted_symbol_count","prediction_count","missing_quote_count","data_limited_count","quality_gate_pass","history_ready","drive_path","manifest_drive_path","reasons"):
              if key in payload:
                  print(f"{label}_{key.upper()}={payload.get(key)}")
          sys.exit(0 if code == "200" and payload.get("status") == "ok" else 1)
          PY
              RC=$?
              set -e
              if [[ $RC -eq 0 ]]; then
                AUTH_OK=1
                if [[ "$PATH_PART" == "capturez" ]]; then CAPTURE_OK=1; else PREDICTION_OK=1; fi
              elif [[ $RC -eq 1 ]]; then
                AUTH_OK=1
              else
                break
              fi
            done
            if [[ "$CAPTURE_OK" == "1" && "$PREDICTION_OK" == "1" ]]; then break; fi
          done
          if [[ "$CAPTURE_OK" == "1" ]]; then
            echo "QUOTE_CAPTURE_VERDICT=PASS"
          else
            echo "QUOTE_CAPTURE_VERDICT=FAIL_OR_UNVERIFIABLE"
          fi
          if [[ "$PREDICTION_OK" == "1" ]]; then
            echo "PREDICTION_ACTUAL_VERDICT=PASS"
          else
            echo "PREDICTION_ACTUAL_VERDICT=FAIL_OR_UNVERIFIABLE"
          fi
          if [[ "$AUTH_OK" != "1" ]]; then
            echo "ACCESS_BLOCKER=deployment identity cannot impersonate either existing invoker service account; no Scheduler configuration was changed."
          fi
          [[ "$CAPTURE_OK" == "1" && "$PREDICTION_OK" == "1" ]]
