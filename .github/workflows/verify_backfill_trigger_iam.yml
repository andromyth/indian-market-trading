name: Verify native 5m backfill trigger IAM (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_ID: indian-market-trading
      REGION: asia-south1
      JOB: native-5m-backfill
      SCHED_SA: indian-market-scheduler@indian-market-trading.iam.gserviceaccount.com
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          project_id: indian-market-trading

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: indian-market-trading

      - name: Read job IAM policy
        shell: bash
        run: |
          set -uo pipefail
          echo "=== JOB IAM ==="
          gcloud run jobs get-iam-policy "$JOB" --project="$PROJECT_ID" --region="$REGION" --format=json 2>&1 || true
          echo "=== PROJECT IAM (scheduler SA roles) ==="
          gcloud projects get-iam-policy "$PROJECT_ID" --format=json 2>/dev/null \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); sa=sys.argv[1]; [print(b.get("role"), sorted(b.get("members",[]))) for b in d.get("bindings",[]) if sa in b.get("members",[])]' "$SCHED_SA" || true
          echo "=== SCHEDULER JOB ==="
          gcloud scheduler jobs describe native-5m-backfill-daily --project="$PROJECT_ID" --location="$REGION" \
            --format='yaml(state,schedule,timeZone,httpTarget.uri,httpTarget.oauthToken.serviceAccountEmail,lastAttemptTime,status)' 2>&1 || true
