name: Verify minute prediction persistence

on:
  workflow_dispatch:
  # A one-time recovery trigger when this diagnostic workflow is added/changed.
  # Normal application-code pushes do not run it.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify_minute_prediction_persistence.yml"

permissions:
  contents: read

concurrency:
  group: verify-minute-prediction-persistence
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Drive audit dependencies
        run: python -m pip install -r requirements.txt

      - name: Read-only Drive audit of minute prediction and actual persistence
        run: python -u verify_minute_prediction_persistence.py
